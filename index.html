  <!-- 卸载旧 Service Worker,不再注册新的 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => {
          reg.unregister();
          console.log('[SW] 卸载旧SW');
        });
      });
      if (window.caches) {
        caches.keys().then(keys => {
          keys.forEach(k => {
            caches.delete(k);
            console.log('[SW] 清理缓存:', k);
          });
        });
      }
    }
  </script>
