  _quickBtn(icon, label, onclick) {
    return `
      <button class="btn btn--sm" style="flex-direction:column;padding:12px 6px;min-height:72px" onclick="${onclick.replace(/"/g,'&quot;')}">
        <span style="font-size:22px">${icon}</span>
        <span class="text-xs" style="margin-top:4px">${label}</span>
      </button>
    `;
  },

  _fmtDur(ms) {
    if (!ms) return '0分';
    const m = Math.floor(ms / 60000);
    if (m < 60) return `${m}分`;
    return `${Math.floor(m/60)}时${m%60}分`;
  },

  _getDailyQuote() {
    const quotes = [
      { zh: '愿你成为自己的太阳，无需借谁的光。', en: 'May you become your own sun, needing no one else\'s light.' },
      { zh: '所有的努力都不会完全白费。', en: 'No effort is ever completely in vain.' },
      { zh: '今天的你，是过去所有你的总和。', en: 'Today\'s you is the sum of all your past selves.' },
      { zh: '慢慢来，比较快。', en: 'Slowly is the fastest way.' },
      { zh: '生活明朗，万物可爱。', en: 'Life is bright, and all things are lovely.' },
      { zh: '愿你眼里有光，心中有爱。', en: 'May there be light in your eyes and love in your heart.' },
      { zh: '每一个不曾起舞的日子，都是对生命的辜负。', en: 'Every day without dance is a betrayal of life.' },
      { zh: '你只管努力，剩下的交给时间。', en: 'Just do your best, and leave the rest to time.' },
      { zh: '心怀温柔，所遇皆温柔。', en: 'With a gentle heart, all you meet is gentle.' },
      { zh: '今日事，今日毕。', en: 'Finish today\'s work today.' },
    ];
    const d = new Date();
    const idx = (d.getFullYear()*1000 + d.getMonth()*32 + d.getDate()) % quotes.length;
    return quotes[idx];
  },

  async _renderEmotionMini(emotions) {
    const el = document.getElementById('homeEmotionChart');
    if (!el) return;
    if (emotions.length === 0 || typeof Chart === 'undefined') {
      el.innerHTML = '<div class="text-center text-faint text-sm" style="padding:30px 0">今天还没有情绪记录<br>系统默认：平和</div>';
      return;
    }
    const canvas = document.createElement('canvas');
    canvas.style.maxHeight = '120px';
    el.innerHTML = '';
    el.appendChild(canvas);
    const types = await DB.getSetting('emotion_types') || [];
    const labels = emotions.map(e => new Date(e.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
    const data = emotions.map(e => {
      const t = types.find(x => x.name === e.emotion_type);
      return t ? t.valence * (e.intensity||5) : 0;
    });
    new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{ data, borderColor: '#F194A6', tension: 0.4, fill: true, backgroundColor: 'rgba(241,148,166,0.1)' }] },
      options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } }, maintainAspectRatio: false },
    });
  },

  async addTask() {
    UI.modal('添加今日待办', `
      <div class="field">
        <label class="field__label">任务内容</label>
        <input class="input" id="taskTitle" placeholder="今天要做什么？">
      </div>
      <div class="field">
        <label class="field__label">优先级</label>
        <select class="select" id="taskPrio">
          <option value="normal">普通</option>
          <option value="high">重要</option>
          <option value="urgent">紧急</option>
        </select>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="HomeModule._saveTask()">保存</button>
      </div>
    `);
    setTimeout(() => document.getElementById('taskTitle')?.focus(), 100);
  },

  async _saveTask() {
    const title = document.getElementById('taskTitle').value.trim();
    if (!title) { UI.toast('请输入任务内容','error'); return; }
    const prio = document.getElementById('taskPrio').value;
    await DB.save('tasks', {
      title, priority: prio, completed: false, date: todayKey(),
      reset_daily: false,
    });
    UI.closeModal();
    UI.toast('已添加','success');
    this.render();
  },

  async toggleTask(id, checked) {
    const t = await DB.get('tasks', id);
    if (t) {
      t.completed = checked;
      t.completed_date = checked ? todayKey() : null;
      await DB.save('tasks', t);
      this.render();
    }
  },

  async toggleGoal(idx, checked) {
    const goals = await DB.getSetting('week_goals') || [];
    if (goals[idx]) {
      goals[idx].done = checked;
      await DB.setSetting('week_goals', goals);
    }
  },
};


// === js/modules/timer.js ===
/**
 * 工作与专注计时模块
 * 支持自由计时、番茄钟、刷新恢复、补录、统计
 */
const TimerModule = {
  _tickTimer: null,
  _running: null,  // 当前运行中的计时器缓存

  async render() {
    const taskTypes = await DB.getSetting('task_types') || ['阅读','锻炼','电影/电影解说','纪录片','复盘阿苡视频','其他'];
    const running = (await DB.list('timer_running')).filter(t => !t.deleted_at);
    const todayRecords = (await DB.list('timers')).filter(t => !t.deleted_at && t.start_time?.startsWith(todayKey()));

    const html = `
      <div class="page">
        <div class="page__title">⏱️ 工作与专注计时</div>

        <!-- 当前计时 -->
        <div class="card mb-4" id="timerPanel" style="${running.length>0?'border:1px solid var(--color-rose);background:rgba(241,148,166,0.04)':''}">
          ${running.length > 0 ? this._renderRunning(running[0]) : this._renderStartForm(taskTypes)}
        </div>

        <!-- 今日记录 -->
        <div class="card mb-4">
          <div class="card-header">
            <div class="card-title">📋 今日记录</div>
            <button class="btn btn--sm btn--ghost" onclick="TimerModule.addManual()">+ 补录</button>
          </div>
          ${todayRecords.length === 0 ? UI.empty('⏰','今天还没有计时记录') : `
            <div class="flex flex-col gap-2">
              ${todayRecords.sort((a,b)=>b.start_time.localeCompare(a.start_time)).map(t => `
                <div class="list-item">
                  <span style="font-size:20px">${this._typeIcon(t.task_type)}</span>
                  <div class="list-item__main">
                    <div class="list-item__title">${t.task_name}</div>
                    <div class="list-item__sub">${t.task_type} · ${this._fmtDur(t.duration)} · ${new Date(t.start_time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}-${new Date(t.end_time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</div>
                  </div>
                  <button class="btn btn--sm btn--ghost" onclick="TimerModule.viewDetail('${t.id}')">详情</button>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <!-- 统计 -->
        <div class="grid grid-3 mb-4">
          <div class="card">
            <div class="card-title text-sm">📅 今日</div>
            <div class="text-2xl" style="color:var(--color-primary);font-weight:600">${this._fmtDur(todayRecords.reduce((s,t)=>s+(t.duration||0),0))}</div>
            <div class="text-faint text-xs mt-1">${todayRecords.length} 次计时</div>
          </div>
          <div class="card">
            <div class="card-title text-sm">📆 本周</div>
            <div class="text-2xl" style="color:var(--color-rose);font-weight:600" id="weekStat">-</div>
            <div class="text-faint text-xs mt-1" id="weekCount">-</div>
          </div>
          <div class="card">
            <div class="card-title text-sm">🗓️ 本月</div>
            <div class="text-2xl" style="color:var(--color-wisteria);font-weight:600" id="monthStat">-</div>
            <div class="text-faint text-xs mt-1" id="monthCount">-</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">📊 按类型统计</div>
          <div id="typeStatChart" style="min-height:200px"></div>
        </div>

        <div class="flex gap-3 mt-4">
          <button class="btn flex-1" onclick="TimerModule.showStats('day')">日统计</button>
          <button class="btn flex-1" onclick="TimerModule.showStats('week')">周统计</button>
          <button class="btn flex-1" onclick="TimerModule.showStats('month')">月统计</button>
          <button class="btn flex-1" onclick="TimerModule.showStats('year')">年统计</button>
        </div>
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;

    // 启动计时显示
    if (running.length > 0) {
      this._running = running[0];
      this._startTick();
    }
    await this._loadStats();
  },

  _renderStartForm(taskTypes) {
    return `
      <div class="card-title">开始专注</div>
      <div class="field">
        <label class="field__label">任务类型</label>
        <div class="tag-select" id="typeSelect">
          ${taskTypes.map((t,i) => `<div class="tag-chip ${i===0?'active':''}" onclick="TimerModule._selectType(this)">${t}</div>`).join('')}
        </div>
      </div>
      <div class="field">
        <label class="field__label">任务名称</label>
        <input class="input" id="taskName" placeholder="例如：读《被讨厌的勇气》第3章">
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label class="field__label">目标</label>
          <input class="input" id="taskGoal" placeholder="完成什么算成功？">
        </div>
        <div class="field">
          <label class="field__label">预计时长（分钟）</label>
          <input class="input" id="estMin" type="number" min="1" placeholder="25">
        </div>
      </div>
      <div class="field">
        <label class="field__label">模式</label>
        <div class="tag-select">
          <div class="tag-chip active" onclick="TimerModule._selectMode(this,'free')">自由计时</div>
          <div class="tag-chip" onclick="TimerModule._selectMode(this,'pomodoro')">番茄钟（25分+5分）</div>
        </div>
      </div>
      <div class="flex gap-3 mt-2">
        <button class="btn btn--primary btn--lg flex-1" onclick="TimerModule.start()">▶ 开始</button>
      </div>
    `;
  },

  _renderRunning(r) {
    const elapsed = (Date.now() - new Date(r.start_time).getTime()) - (r.paused_ms||0);
    const isPaused = r.paused;
    return `
      <div class="card-title">⏱️ 正在计时</div>
      <div class="text-center" style="padding:20px 0">
        <div style="font-size:48px;color:var(--color-primary);font-weight:600;font-variant-numeric:tabular-nums" id="timerDisplay">${this._fmtDur(elapsed)}</div>
        <div class="text-soft mt-2">${r.task_name} · ${r.task_type}</div>
        <div class="text-faint text-xs mt-1">预计 ${r.estimated_min||0} 分钟 · 开始于 ${new Date(r.start_time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div class="flex gap-3" style="justify-content:center">
        ${isPaused
          ? '<button class="btn btn--primary" onclick="TimerModule.resume()">▶ 继续</button>'
          : '<button class="btn" onclick="TimerModule.pause()">⏸ 暂停</button>'}
        <button class="btn btn--accent" onclick="TimerModule.stop()">⏹ 结束</button>
      </div>
    `;
  },

  _selectedType: '阅读',
  _selectedMode: 'free',

  _selectType(el) {
    document.querySelectorAll('#typeSelect .tag-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this._selectedType = el.textContent;
  },

  _selectMode(el, mode) {
    el.parentElement.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this._selectedMode = mode;
    if (mode === 'pomodoro') {
      const est = document.getElementById('estMin');
      if (est && !est.value) est.value = 25;
    }
  },

  async quickStart(type) {
    this._selectedType = type || '阅读';
    const form = document.getElementById('taskName');
    if (form) {
      form.value = type === '阅读' ? '阅读时间' : (type === '锻炼' ? '锻炼时间' : '专注时间');
      this.start();
    }
  },

  async start() {
    // 检查是否已有运行中
    const running = (await DB.list('timer_running')).filter(t => !t.deleted_at);
    if (running.length > 0) {
      UI.toast('已有计时进行中，同一时间只能运行一个','error');
      return;
    }
    const name = document.getElementById('taskName')?.value.trim();
    if (!name) { UI.toast('请填写任务名称','error'); return; }
    const goal = document.getElementById('taskGoal')?.value.trim() || '';
    const estMin = parseInt(document.getElementById('estMin')?.value) || 0;
    const record = {
      id: uuid(),
      task_type: this._selectedType,
      task_name: name,
      goal,
      estimated_min: estMin,
      mode: this._selectedMode,
      start_time: nowISO(),
      paused: false,
      paused_ms: 0,
      pause_start: null,
    };
    await DB.save('timer_running', record);
    this._running = record;
    this._startTick();
    UI.toast('计时开始！专注中…','success');
    this.render();
  },

  async pause() {
    if (!this._running) return;
    this._running.paused = true;
    this._running.pause_start = nowISO();
    await DB.save('timer_running', this._running);
    this.render();
  },

  async resume() {
    if (!this._running) return;
    if (this._running.pause_start) {
      const pauseDur = Date.now() - new Date(this._running.pause_start).getTime();
      this._running.paused_ms = (this._running.paused_ms||0) + pauseDur;
      this._running.pause_start = null;
    }
    this._running.paused = false;
    await DB.save('timer_running', this._running);
    this._startTick();
    this.render();
  },

  async stop() {
    if (!this._running) return;
    const r = this._running;
    const end = nowISO();
    // 计算实际时长（减去暂停时间）
    let dur = new Date(end).getTime() - new Date(r.start_time).getTime();
    if (r.paused_ms) dur -= r.paused_ms;
    if (r.pause_start) dur -= (Date.now() - new Date(r.pause_start).getTime());

    // 询问完成情况
    UI.modal('计时结束 🎉', `
      <div class="text-center mb-4">
        <div style="font-size:36px;color:var(--color-primary);font-weight:600">${this._fmtDur(dur)}</div>
        <div class="text-soft text-sm mt-1">${r.task_name}</div>
        ${r.estimated_min ? `<div class="text-faint text-xs mt-1">预计 ${r.estimated_min} 分钟 / 实际 ${Math.round(dur/60000)} 分钟</div>` : ''}
      </div>
      <div class="field">
        <label class="field__label">完成成果</label>
        <textarea class="textarea" id="endResult" placeholder="这次专注完成了什么？"></textarea>
      </div>
      <div class="field">
        <label class="field__label">专注程度</label>
        <div class="tag-select" id="focusLevel">
          <div class="tag-chip" onclick="TimerModule._selFocus(this,1)">1 分心</div>
          <div class="tag-chip" onclick="TimerModule._selFocus(this,2)">2</div>
          <div class="tag-chip" onclick="TimerModule._selFocus(this,3)">3 一般</div>
          <div class="tag-chip" onclick="TimerModule._selFocus(this,4)">4</div>
          <div class="tag-chip active" onclick="TimerModule._selFocus(this,5)">5 专注</div>
        </div>
      </div>
      <div class="field">
        <label class="field__label">备注</label>
        <textarea class="textarea" id="endNote" placeholder="可留空"></textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="TimerModule._discardStop()">放弃不保存</button>
        <button class="btn btn--primary" onclick="TimerModule._saveStop('${dur}')">保存记录</button>
      </div>
    `);
    this._focusLevel = 5;
  },

  _selFocus(el, lvl) {
    el.parentElement.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this._focusLevel = lvl;
  },

  async _saveStop(durStr) {
    const dur = parseInt(durStr);
    const r = this._running;
    const record = {
      task_type: r.task_type,
      task_name: r.task_name,
      goal: r.goal,
      estimated_min: r.estimated_min || 0,
      mode: r.mode,
      start_time: r.start_time,
      end_time: nowISO(),
      duration: dur,
      result: document.getElementById('endResult')?.value || '',
      focus_level: this._focusLevel || 3,
      note: document.getElementById('endNote')?.value || '',
    };
    await DB.save('timers', record);
    // 删除运行中
    await DB.hardDelete('timer_running', r.id);
    this._running = null;
    this._stopTick();
    UI.closeModal();
    UI.toast('记录已保存','success');
    // 提醒休息
    if (dur > 50 * 60000) {
      setTimeout(() => UI.toast('已经专注超过50分钟了，记得休息一下哦 💕','info',4000), 500);
    }
    this.render();
  },

  async _discardStop() {
    if (!UI.confirm('确定放弃这条计时记录吗？')) return;
    await DB.hardDelete('timer_running', this._running.id);
    this._running = null;
    this._stopTick();
    UI.closeModal();
    UI.toast('已放弃','info');
    this.render();
  },

  _startTick() {
    this._stopTick();
    this._tickTimer = setInterval(() => {
      const el = document.getElementById('timerDisplay');
      if (!el || !this._running) { this._stopTick(); return; }
      let elapsed = Date.now() - new Date(this._running.start_time).getTime();
      if (this._running.paused_ms) elapsed -= this._running.paused_ms;
      if (this._running.pause_start) elapsed -= (Date.now() - new Date(this._running.pause_start).getTime());
      el.textContent = this._fmtDur(elapsed);
    }, 1000);
  },

  _stopTick() {
    if (this._tickTimer) { clearInterval(this._tickTimer); this._tickTimer = null; }
  },

  // 刷新/重新打开时恢复
  async restoreRunning() {
    const running = (await DB.list('timer_running')).filter(t => !t.deleted_at);
    if (running.length > 0) {
      this._running = running[0];
      console.log('[Timer] 恢复运行中计时器:', this._running.task_name);
    }
  },

  _fmtDur(ms) {
    if (!ms || ms < 0) ms = 0;
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    return `${m}:${String(sec).padStart(2,'0')}`;
  },

  _typeIcon(type) {
    const map = { '阅读':'📖','锻炼':'🏃','电影/电影解说':'🎬','纪录片':'🎞️','复盘阿苡视频':'📹','其他':'✨' };
    return map[type] || '⏱️';
  },

  async _loadStats() {
    const now = new Date();
    const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay()); weekStart.setHours(0,0,0,0);
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const all = (await DB.list('timers')).filter(t => !t.deleted_at);
    const weekRecs = all.filter(t => new Date(t.start_time) >= weekStart);
    const monthRecs = all.filter(t => new Date(t.start_time) >= monthStart);
    const wEl = document.getElementById('weekStat');
    const wcEl = document.getElementById('weekCount');
    const mEl = document.getElementById('monthStat');
    const mcEl = document.getElementById('monthCount');
    if (wEl) wEl.textContent = this._fmtDur(weekRecs.reduce((s,t)=>s+(t.duration||0),0));
    if (wcEl) wcEl.textContent = `${weekRecs.length} 次计时`;
    if (mEl) mEl.textContent = this._fmtDur(monthRecs.reduce((s,t)=>s+(t.duration||0),0));
    if (mcEl) mcEl.textContent = `${monthRecs.length} 次计时`;

    // 类型统计图
    const chartEl = document.getElementById('typeStatChart');
    if (chartEl && typeof Chart !== 'undefined') {
      const byType = {};
      all.forEach(t => { byType[t.task_type] = (byType[t.task_type]||0) + (t.duration||0); });
      const labels = Object.keys(byType);
      const data = Object.values(byType).map(ms => Math.round(ms/60000));
      if (labels.length === 0) {
        chartEl.innerHTML = '<div class="text-center text-faint text-sm" style="padding:30px">暂无数据</div>';
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.style.maxHeight = '200px';
      chartEl.innerHTML = '';
      chartEl.appendChild(canvas);
      new Chart(canvas, {
        type: 'bar',
        data: { labels, datasets: [{ data, backgroundColor: ['#F194A6','#8A4E7B','#BBA4D9','#DB5A6B','#7EC8A0','#F5B97A'] }] },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } }, maintainAspectRatio: false },
      });
    }
  },

  async showStats(range) {
    const now = new Date();
    let start;
    let title;
    if (range === 'day') { start = new Date(now); start.setHours(0,0,0,0); title = '今日'; }
    else if (range === 'week') { start = new Date(now); start.setDate(now.getDate()-now.getDay()); start.setHours(0,0,0,0); title = '本周'; }
    else if (range === 'month') { start = new Date(now.getFullYear(), now.getMonth(), 1); title = '本月'; }
    else { start = new Date(now.getFullYear(), 0, 1); title = '本年'; }
    const all = (await DB.list('timers')).filter(t => !t.deleted_at && new Date(t.start_time) >= start);
    const byType = {};
    all.forEach(t => { byType[t.task_type] = byType[t.task_type] || { count:0, ms:0 }; byType[t.task_type].count++; byType[t.task_type].ms += t.duration||0; });
    UI.modal(`${title}计时统计`, `
      <div class="text-center mb-4">
        <div class="text-2xl" style="color:var(--color-primary);font-weight:600">${this._fmtDur(all.reduce((s,t)=>s+(t.duration||0),0))}</div>
        <div class="text-soft text-sm">${all.length} 次计时</div>
      </div>
      ${Object.keys(byType).length === 0 ? UI.empty('📭','该时段暂无记录') : `
        <table class="w-full text-sm">
          <tr style="color:var(--color-text-soft)"><td>类型</td><td>次数</td><td>时长</td></tr>
          ${Object.entries(byType).map(([type,v]) => `
            <tr style="border-top:1px solid var(--color-divider)">
              <td style="padding:8px 0">${this._typeIcon(type)} ${type}</td>
              <td>${v.count}</td>
              <td>${this._fmtDur(v.ms)}</td>
            </tr>
          `).join('')}
        </table>
      `}
    `);
  },

  async addManual() {
    const taskTypes = await DB.getSetting('task_types') || ['阅读','锻炼','其他'];
    UI.modal('补录计时记录', `
      <div class="field">
        <label class="field__label">任务类型</label>
        <select class="select" id="mType">${taskTypes.map(t => `<option>${t}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label class="field__label">任务名称</label>
        <input class="input" id="mName">
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label class="field__label">开始时间</label>
          <input class="input" type="datetime-local" id="mStart">
        </div>
        <div class="field">
          <label class="field__label">时长（分钟）</label>
          <input class="input" type="number" id="mMin" min="1">
        </div>
      </div>
      <div class="field">
        <label class="field__label">备注</label>
        <textarea class="textarea" id="mNote"></textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="TimerModule._saveManual()">保存</button>
      </div>
    `);
    // 默认开始时间为1小时前
    const oneHourAgo = new Date(Date.now() - 3600000);
    const pad = n => String(n).padStart(2,'0');
    document.getElementById('mStart').value = `${oneHourAgo.getFullYear()}-${pad(oneHourAgo.getMonth()+1)}-${pad(oneHourAgo.getDate())}T${pad(oneHourAgo.getHours())}:${pad(oneHourAgo.getMinutes())}`;
  },

  async _saveManual() {
    const type = document.getElementById('mType').value;
    const name = document.getElementById('mName').value.trim();
    const startStr = document.getElementById('mStart').value;
    const min = parseInt(document.getElementById('mMin').value) || 0;
    if (!name || !startStr || !min) { UI.toast('请填写完整','error'); return; }
    const start = new Date(startStr);
    const end = new Date(start.getTime() + min * 60000);
    await DB.save('timers', {
      task_type: type, task_name: name, mode: 'manual',
      start_time: start.toISOString(), end_time: end.toISOString(),
      duration: min * 60000, note: document.getElementById('mNote').value,
      source_type: 'manual',
    });
    UI.closeModal();
    UI.toast('已补录','success');
    this.render();
  },

  async viewDetail(id) {
    const t = await DB.get('timers', id);
    if (!t) return;
    UI.modal('计时详情', `
      <div class="list-item"><div class="list-item__main">
        <div class="list-item__title">${this._typeIcon(t.task_type)} ${t.task_name}</div>
        <div class="list-item__sub">${t.task_type}</div>
      </div></div>
      <table class="w-full text-sm mt-3">
        <tr><td class="text-soft">开始</td><td>${new Date(t.start_time).toLocaleString('zh-CN')}</td></tr>
        <tr><td class="text-soft">结束</td><td>${new Date(t.end_time).toLocaleString('zh-CN')}</td></tr>
        <tr><td class="text-soft">时长</td><td>${this._fmtDur(t.duration)}</td></tr>
        ${t.estimated_min ? `<tr><td class="text-soft">预计</td><td>${t.estimated_min} 分钟</td></tr>` : ''}
        ${t.goal ? `<tr><td class="text-soft">目标</td><td>${t.goal}</td></tr>` : ''}
        ${t.result ? `<tr><td class="text-soft">成果</td><td>${t.result}</td></tr>` : ''}
        ${t.focus_level ? `<tr><td class="text-soft">专注度</td><td>${'⭐'.repeat(t.focus_level)}</td></tr>` : ''}
        ${t.note ? `<tr><td class="text-soft">备注</td><td>${t.note}</td></tr>` : ''}
      </table>
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn btn--accent btn--sm" onclick="TimerModule._deleteRec('${id}')">删除</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  async _deleteRec(id) {
    if (!await UI.confirm('确定删除这条记录吗？删除后会影响相关统计。')) return;
    await DB.hardDelete('timers', id);
    UI.closeModal();
    UI.toast('已删除','success');
    this.render();
  },
};


// === js/modules/reading.js ===
/**
 * 阅读模块
 * 四类分类：在看/待看/已看完/多钟类可看
 */
const ReadingModule = {
  async render() {
    const books = (await DB.list('books')).filter(b => !b.deleted_at);
    const categories = ['在看','待看','已看完','多钟类可看'];

    const html = `
      <div class="page">
        <div class="flex justify-between items-center mb-4">
          <div class="page__title" style="margin:0">📖 阅读模块</div>
          <button class="btn btn--primary btn--sm" onclick="ReadingModule.add()">+ 添加书籍</button>
        </div>

        ${books.length === 0 ? `
          <div class="card">
            ${UI.empty('📚','还没有书籍，点击右上角添加')}
          </div>
        ` : categories.map(cat => {
          const catBooks = books.filter(b => b.category === cat);
          if (catBooks.length === 0) return '';
          return `
            <div class="card mb-4">
              <div class="card-header">
                <div class="card-title">${this._catIcon(cat)} ${cat}</div>
                <span class="badge">${catBooks.length}</span>
              </div>
              <div class="flex flex-col gap-2">
                ${catBooks.map(b => `
                  <div class="list-item">
                    <span class="book-icon">📚</span>
                    <div class="list-item__main" style="cursor:pointer" onclick="ReadingModule.detail('${b.id}')">
                      <div class="list-item__title">${b.title}</div>
                      <div class="list-item__sub">${b.author||'未知作者'} · ${b.platform||'-'}</div>
                    </div>
                    <button class="btn btn--sm btn--ghost" onclick="ReadingModule.moveCategory('${b.id}')">↕</button>
                    <button class="btn btn--sm btn--ghost" onclick="ReadingModule.edit('${b.id}')">✏️</button>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).join('')}

        <!-- 阅读复盘分析 -->
        ${books.filter(b => b.category === '已看完').length >= 3 ? `
          <div class="card">
            <div class="card-title">📊 阅读复盘分析</div>
            <div id="readingAnalysis">加载中...</div>
          </div>
        ` : ''}
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
    if (books.filter(b => b.category === '已看完').length >= 3) {
      this._renderAnalysis(books);
    }
  },

  _catIcon(cat) {
    return '📚';
  },

  async add() {
    this._editForm(null);
  },

  async edit(id) {
    const b = await DB.get('books', id);
    this._editForm(b);
  },

  _editForm(book) {
    const categories = ['在看','待看','已看完','多钟类可看'];
    this._selectedCat = book?.category || '在看';
    UI.modal(book ? '编辑书籍' : '添加书籍', `
      <div class="field">
        <label class="field__label">书名 *</label>
        <input class="input" id="bTitle" value="${book?.title||''}">
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label class="field__label">作者</label>
          <input class="input" id="bAuthor" value="${book?.author||''}">
        </div>
        <div class="field">
          <label class="field__label">类型</label>
          <input class="input" id="bType" placeholder="如：心理学、小说" value="${book?.type||''}">
        </div>
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label class="field__label">电子/实体</label>
          <select class="select" id="bFormat">
            <option ${book?.format==='电子'?'selected':''}>电子</option>
            <option ${book?.format==='实体'?'selected':''}>实体</option>
          </select>
        </div>
        <div class="field">
          <label class="field__label">阅读平台</label>
          <input class="input" id="bPlatform" placeholder="如：微信读书" value="${book?.platform||''}">
        </div>
      </div>
      <div class="field">
        <label class="field__label">分类</label>
        <div class="tag-select" id="bCatSelect">
          ${categories.map(c => `<div class="tag-chip ${(book?.category||'在看')===c?'active':''}" onclick="ReadingModule._selCat(this)">${c}</div>`).join('')}
        </div>
      </div>
      <div class="field">
        <label class="field__label">阅读时间</label>
        <input class="input" type="date" id="bDate" value="${book?.read_date||todayKey()}">
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="ReadingModule._save('${book?.id||''}')">保存</button>
      </div>
    `);
  },

  _selCat(el) {
    el.parentElement.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this._selectedCat = el.textContent.trim();
  },

  async _save(id) {
    const title = document.getElementById('bTitle').value.trim();
    if (!title) { UI.toast('请填写书名','error'); return; }
    const data = {
      title,
      author: document.getElementById('bAuthor').value,
      type: document.getElementById('bType').value,
      format: document.getElementById('bFormat').value,
      platform: document.getElementById('bPlatform').value,
      category: this._selectedCat || '在看',
      read_date: document.getElementById('bDate').value,
    };
    if (id) { data.id = id; }
    await DB.save('books', data);
    UI.closeModal();
    UI.toast('已保存','success');
    this.render();
  },

  async moveCategory(id) {
    const categories = ['在看','待看','已看完','多钟类可看'];
    UI.modal('移动到分类', categories.map(c => `
      <div class="list-item" onclick="ReadingModule._doMove('${id}','${c}')">
        <span style="font-size:20px">${this._catIcon(c)}</span>
        <div class="list-item__main"><div class="list-item__title">${c}</div></div>
      </div>
    `).join(''));
  },

  async _doMove(id, cat) {
    const b = await DB.get('books', id);
    if (b) { b.category = cat; await DB.save('books', b); }
    UI.closeModal();
    UI.toast('已移动','success');
    this.render();
  },

  async detail(id) {
    const b = await DB.get('books', id);
    if (!b) return;
    const notes = (await DB.list('book_notes')).filter(n => !n.deleted_at && n.book_id === id);
    UI.modal(`📖 ${b.title}`, `
      <div class="text-soft text-sm mb-3">${b.author||'未知'} · ${b.type||''} · ${b.format} · ${b.platform||''}</div>
      <div class="card-header">
        <div class="card-title">📝 笔记与摘录</div>
        <button class="btn btn--sm btn--ghost" onclick="ReadingModule.addNote('${id}')">+ 添加</button>
      </div>
      ${notes.length === 0 ? '<p class="text-faint text-sm">还没有笔记</p>' : notes.map(n => `
        <div class="list-item" style="cursor:pointer" onclick="ReadingModule.viewNote('${n.id}')">
          <div class="list-item__main">
            <div class="list-item__title">${n.quote?.slice(0,40)||'笔记'}...</div>
            <div class="list-item__sub">${n.note_type||'摘录'}</div>
          </div>
        </div>
      `).join('')}
      <div class="flex gap-3 mt-4">
        <button class="btn btn--accent btn--sm" onclick="ReadingModule._deleteBook('${id}')">删除书籍</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  async _deleteBook(id) {
    if (!await UI.confirm('删除这本书及其所有笔记？此操作不可撤销。')) return;
    await DB.hardDelete('books', id);
    const notes = (await DB.list('book_notes')).filter(n => n.book_id === id);
    for (const n of notes) await DB.hardDelete('book_notes', n.id);
    UI.closeModal();
    UI.toast('已删除','success');
    this.render();
  },

  async addNote(bookId) {
    UI.closeModal();
    const b = await DB.get('books', bookId);
    UI.modal(`添加笔记 - ${b.title}`, `
      <div class="field">
        <label class="field__label">笔记类型</label>
        <select class="select" id="nType">
          <option value="触动语句">触动语句</option>
          <option value="喜欢的片段">最喜欢的片段/故事</option>
          <option value="思考方向">引发思考的方向</option>
          <option value="核心收获">核心收获</option>
        </select>
      </div>
      <div class="field">
        <label class="field__label">原文摘录</label>
        <textarea class="textarea" id="nQuote" placeholder="摘录原文内容"></textarea>
      </div>
      <div class="field">
        <label class="field__label">我的感受（自选）</label>
        <textarea class="textarea" id="nFeeling" placeholder="可选"></textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="ReadingModule._saveNote('${bookId}')">保存</button>
      </div>
    `);
  },

  async _saveNote(bookId) {
    await DB.save('book_notes', {
      book_id: bookId,
      note_type: document.getElementById('nType').value,
      quote: document.getElementById('nQuote').value,
      feeling: document.getElementById('nFeeling').value,
    });
    UI.closeModal();
    UI.toast('笔记已保存','success');
    this.detail(bookId);
  },

  async viewNote(id) {
    const n = await DB.get('book_notes', id);
    if (!n) return;
    UI.modal('笔记详情', `
      <div class="text-soft text-sm mb-2">${n.note_type}</div>
      <div class="card--blur" style="background:var(--color-bg-alt);padding:12px;border-radius:10px;margin-bottom:12px">
        <div class="text-xs text-faint mb-1">原文摘录</div>
        <div>${n.quote||''}</div>
      </div>
      ${n.feeling ? `
        <div class="card--blur" style="background:rgba(241,148,166,0.06);padding:12px;border-radius:10px">
          <div class="text-xs text-faint mb-1">我的感受</div>
          <div>${n.feeling}</div>
        </div>
      ` : ''}
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn btn--accent btn--sm" onclick="ReadingModule._delNote('${id}','${n.book_id}')">删除</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  async _delNote(id, bookId) {
    if (!await UI.confirm('删除这条笔记？')) return;
    await DB.hardDelete('book_notes', id);
    UI.closeModal();
    UI.toast('已删除','success');
    this.detail(bookId);
  },

  async _renderAnalysis(books) {
    const el = document.getElementById('readingAnalysis');
    if (!el) return;
    const finished = books.filter(b => b.category === '已看完');
    const notes = (await DB.list('book_notes')).filter(n => !n.deleted_at && finished.some(b => b.id === n.book_id));
    // 高频类型
    const typeCount = {};
    finished.forEach(b => { if (b.type) typeCount[b.type] = (typeCount[b.type]||0)+1; });
    // 高频笔记关键词
    const noteTypes = {};
    notes.forEach(n => { noteTypes[n.note_type] = (noteTypes[n.note_type]||0)+1; });
    el.innerHTML = `
      <div class="grid grid-2">
        <div>
          <div class="text-soft text-sm mb-2">📚 已读 ${finished.length} 本</div>
          <div class="text-faint text-xs">类型分布：</div>
          <ul class="text-sm mt-1">
            ${Object.entries(typeCount).sort((a,b)=>b[1]-a[1]).map(([t,c]) => `<li>${t}: ${c} 本</li>`).join('') || '<li class="text-faint">暂无</li>'}
          </ul>
        </div>
        <div>
          <div class="text-soft text-sm mb-2">📝 笔记 ${notes.length} 条</div>
          <div class="text-faint text-xs">笔记类型分布：</div>
          <ul class="text-sm mt-1">
            ${Object.entries(noteTypes).sort((a,b)=>b[1]-a[1]).map(([t,c]) => `<li>${t}: ${c} 条</li>`).join('') || '<li class="text-faint">暂无</li>'}
          </ul>
        </div>
      </div>
      <div class="ai-block mt-3">
        💡 以上分析基于你的真实记录自动统计。随着记录增多，可以观察哪种类型的书更容易引发深度思考。
      </div>
    `;
  },
};

/**
 * 锻炼板块
 * 周一到周日竖向排列打卡
 * 月度曲线图（蓝/紫/红三色）
 */
const WorkoutModule = {
  async render() {
    const all = (await DB.list('workouts')).filter(w => !w.deleted_at);
    const today = todayKey();
    const todayRecs = all.filter(w => w.date === today);

    // 本周记录
    const now = new Date();
    const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay()); weekStart.setHours(0,0,0,0);
    const weekRecs = all.filter(w => new Date(w.date) >= weekStart);

    const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];

    const html = `
      <div class="page">
        <div class="flex justify-between items-center mb-4">
          <div class="page__title" style="margin:0">🏃🏻‍♀️ 锻炼板块</div>
          <button class="btn btn--primary btn--sm" onclick="WorkoutModule.add()">+ 今日打卡</button>
        </div>

        <!-- 今日运动 -->
        <div class="card mb-4">
          <div class="card-title">🌟 今日运动（${today}）</div>
          ${todayRecs.length === 0 ? '<p class="text-faint text-sm">今天还没有运动打卡</p>' : `
            <div class="flex flex-col gap-2">
              ${todayRecs.map(w => `
                <div class="list-item">
                  <span style="font-size:20px">${this._intensityIcon(w.intensity)}</span>
                  <div class="list-item__main">
                    <div class="list-item__title">${w.project} · ${w.duration}分钟</div>
                    <div class="list-item__sub">强度:${w.intensity} · 身体:${'☆'.repeat(w.body_score||3)} · 心理:${'☆'.repeat(w.mind_score||3)}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <!-- 一周打卡（竖向） -->
        <div class="card mb-4">
          <div class="card-title">📅 本周打卡</div>
          <div class="week-checkin">
            ${[1,2,3,4,5,6,0].map(d => {
              const dayRecs = weekRecs.filter(w => new Date(w.date).getDay() === d);
              return `
                <div class="week-checkin__day">
                  <div class="week-checkin__day-label">
                    ${weekdays[d]}
                  </div>
                  <div class="week-checkin__day-items">
                    ${dayRecs.length === 0
                      ? '<span class="text-faint text-xs">未打卡</span>'
                      : dayRecs.map(w => `
                        <div class="week-checkin__item">
                          ${w.project} · ${w.duration}分钟 · 身体${'☆'.repeat(w.body_score||3)}
                        </div>
                      `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- 一周总结 -->
        <div class="card mb-4">
          <div class="card-title">📊 一周总结复盘</div>
          ${this._weekSummary(weekRecs)}
        </div>

        <!-- 月度曲线 -->
        <div class="card mb-4">
          <div class="card-title">📈 本月身体感受曲线</div>
          <div id="monthChart" style="min-height:280px"></div>
          <div class="flex gap-3 mt-3 text-xs">
            <span style="color:#7090B0">● 不佳(1-2☆)</span>
            <span style="color:#8A4E7B">● 平和(3-4☆)</span>
            <span style="color:#DB5A6B">● 极佳(5☆)</span>
          </div>
          <div class="ai-disclaimer">曲线完全依据每日实际记录的☆数量绘制，不可手动修改</div>
        </div>

        <!-- 一月变化观察 -->
        <div class="card">
          <div class="card-title">🔍 一月变化观察</div>
          ${this._monthObservation(all)}
          <div class="ai-disclaimer">此功能仅用于个人自我观察和复盘，不构成医学诊断或心理治疗建议</div>
        </div>
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
    this._renderMonthChart(all);
  },

  _intensityIcon(intensity) {
    if (!intensity) return '🏃';
    if (intensity.includes('低')) return '🚶';
    if (intensity.includes('高')) return '🔥';
    return '🏃';
  },

  _weekSummary(recs) {
    if (recs.length === 0) return '<p class="text-faint text-sm">本周还没有锻炼记录</p>';
    const projectCount = {};
    recs.forEach(w => { projectCount[w.project] = (projectCount[w.project]||0)+1; });
    const bodyAvg = (recs.reduce((s,w)=>s+(w.body_score||3),0)/recs.length).toFixed(1);
    const mindWords = {};
    recs.forEach(w => { if (w.mind_feeling) mindWords[w.mind_feeling] = (mindWords[w.mind_feeling]||0)+1; });
    return `
      <ul class="text-sm" style="line-height:2">
        <li>📊 本周运动频率: <b>${recs.length} 次</b></li>
        <li>🏋️ 类型分布: ${Object.entries(projectCount).map(([p,c])=>`${p}(${c})`).join('、')}</li>
        <li>💪 身体感受平均评分: <b>${bodyAvg} ☆</b></li>
        <li>🧠 心理感受高频词: ${Object.entries(mindWords).sort((a,b)=>b[1]-a[1]).map(([w,c])=>`${w}(${c})`).join('、')||'-'}</li>
      </ul>
    `;
  },

  _monthObservation(all) {
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthRecs = all.filter(w => new Date(w.date) >= monthStart);
    if (monthRecs.length < 2) return '<p class="text-faint text-sm">本月记录不足，继续加油记录吧</p>';
    const bodyScores = monthRecs.map(w => w.body_score||3);
    const trend = bodyScores[bodyScores.length-1] > bodyScores[0] ? '上升' : (bodyScores[bodyScores.length-1] < bodyScores[0] ? '下降' : '稳定');
    const avg = (bodyScores.reduce((a,b)=>a+b,0)/bodyScores.length).toFixed(1);
    return `
      <ul class="text-sm" style="line-height:2">
        <li>📈 本月锻炼: <b>${monthRecs.length} 次</b></li>
        <li>💪 身体感受趋势: <b>${trend}</b>（平均 ${avg} ☆）</li>
        <li>📊 体能状态: ${avg >= 4 ? '整体感受良好' : avg >= 3 ? '整体平稳' : '需要注意休息'}</li>
      </ul>
    `;
  },

  async _renderMonthChart(all) {
    const el = document.getElementById('monthChart');
    if (!el || typeof Chart === 'undefined') return;
    const now = new Date();
    const year = now.getFullYear(); const month = now.getMonth();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    // 每日取最高分（如果一天多次取最高）
    const dailyBest = {};
    all.forEach(w => {
      const d = new Date(w.date);
      if (d.getFullYear() === year && d.getMonth() === month) {
        const day = d.getDate();
        const score = w.body_score || 3;
        if (!dailyBest[day] || score > dailyBest[day]) dailyBest[day] = score;
      }
    });
    const labels = []; const data = []; const colors = [];
    for (let d = 1; d <= daysInMonth; d++) {
      labels.push(`${d}`);
      if (dailyBest[d]) {
        data.push(dailyBest[d]);
        colors.push(dailyBest[d] <= 2 ? '#7090B0' : (dailyBest[d] <= 4 ? '#8A4E7B' : '#DB5A6B'));
      } else {
        data.push(null);
        colors.push('#E0E0E0');
      }
    }
    const canvas = document.createElement('canvas');
    canvas.style.maxHeight = '260px';
    el.innerHTML = '';
    el.appendChild(canvas);
    new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{
        data, borderColor: '#8A4E7B', tension: 0.3,
        fill: false, spanGaps: true,
        pointBackgroundColor: colors, pointRadius: 5, pointHoverRadius: 7,
      }]},
      options: {
        plugins: { legend: { display: false },
          tooltip: { callbacks: { label: (ctx) => {
            const v = ctx.parsed.y;
            if (v == null) return '未记录';
            return `${v} ☆ (${v<=2?'不佳':v<=4?'平和':'极佳'})`;
          }}}
        },
        scales: { y: { min: 0, max: 5, ticks: { stepSize: 1, callback: v => v+'☆' } },
                  x: { title: { display: true, text: '日期' } } },
        maintainAspectRatio: false,
      },
    });
  },

  async add() {
    const today = todayKey();
    UI.modal('今日运动打卡 🏃', `
      <div class="field">
        <label class="field__label">运动项目</label>
        <input class="input" id="wProject" placeholder="如：跑步、瑜伽、跳绳">
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label class="field__label">时长（分钟）</label>
          <input class="input" type="number" id="wDuration" min="1">
        </div>
        <div class="field">
          <label class="field__label">强度</label>
          <select class="select" id="wIntensity">
            <option>低强度</option>
            <option>中强度</option>
            <option>高强度</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field__label">身体感受</label>
        <input class="input" id="wBody" placeholder="如：肌肉酸痛/轻松/紧绷">
      </div>
      <div class="field">
        <label class="field__label">身体感受评分</label>
        <div class="tag-select" id="bodyScore">
          ${[1,2,3,4,5].map(s => `<div class="tag-chip" onclick="WorkoutModule._selScore(this,'body',${s})">${'☆'.repeat(s)}</div>`).join('')}
        </div>
        <div class="field__hint">1-2☆不佳(蓝) · 3-4☆平和(紫) · 5☆极佳(红)</div>
      </div>
      <div class="field">
        <label class="field__label">心理感受</label>
        <input class="input" id="wMind" placeholder="如：释放/疲惫/成就感">
      </div>
      <div class="field">
        <label class="field__label">心理感受评分</label>
        <div class="tag-select" id="mindScore">
          ${[1,2,3,4,5].map(s => `<div class="tag-chip" onclick="WorkoutModule._selScore(this,'mind',${s})">${'☆'.repeat(s)}</div>`).join('')}
        </div>
      </div>
      <div class="field">
        <label class="field__label">日期</label>
        <input class="input" type="date" id="wDate" value="${today}">
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="WorkoutModule._save()">保存打卡</button>
      </div>
    `);
    this._scores = { body: 3, mind: 3 };
  },

  _selScore(el, type, score) {
    el.parentElement.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this._scores[type] = score;
  },

  async _save() {
    const project = document.getElementById('wProject').value.trim();
    if (!project) { UI.toast('请填写运动项目','error'); return; }
    await DB.save('workouts', {
      project,
      duration: parseInt(document.getElementById('wDuration').value) || 0,
      intensity: document.getElementById('wIntensity').value,
      body_feeling: document.getElementById('wBody').value,
      body_score: this._scores.body,
      mind_feeling: document.getElementById('wMind').value,
      mind_score: this._scores.mind,
      date: document.getElementById('wDate').value,
    });
    UI.closeModal();
    UI.toast('打卡成功！','success');
    this.render();
  },
};


// === js/modules/emotion.js ===
/**
 * 情绪天气监测模块
 * 每天默认平和，一天可多次记录，折线图
 */
const EmotionModule = {
  async render() {
    const types = await DB.getSetting('emotion_types') || [];
    const all = (await DB.list('emotions')).filter(e => !e.deleted_at);
    const today = todayKey();
    const todayEmotions = all.filter(e => e.created_at?.startsWith(today));

    const html = `
      <div class="page">
        <div class="flex justify-between items-center mb-4">
          <div class="page__title" style="margin:0">🌤️ 情绪天气监测</div>
          <button class="btn btn--primary btn--sm" onclick="EmotionModule.add()">+ 记录情绪</button>
        </div>

        <!-- 今日情绪天气图 -->
        <div class="card mb-4">
          <div class="card-title">📊 今日情绪天气</div>
          <div id="todayChart" style="min-height:200px"></div>
          ${todayEmotions.length === 0 ? '<p class="text-faint text-xs text-center">系统默认：平和（未记录）— 系统默认，非用户主动确认</p>' : ''}
        </div>

        <!-- 今日记录列表 -->
        <div class="card mb-4">
          <div class="card-title">📝 今日记录</div>
          ${todayEmotions.length === 0 ? UI.empty('🌤️','今天还没有情绪记录，默认平和') : `
            <div class="flex flex-col gap-2">
              ${todayEmotions.sort((a,b)=>a.created_at.localeCompare(b.created_at)).map(e => {
                const t = types.find(x => x.name === e.emotion_type);
                const color = t?.color || '#BBA4D9';
                return `
                  <div class="list-item" style="cursor:pointer;border-left:3px solid ${color}" onclick="EmotionModule.view('${e.id}')">
                    <div class="list-item__main">
                      <div class="list-item__title">
                        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};margin-right:6px"></span>
                        ${e.emotion_type} · 强度 ${e.intensity}/10
                      </div>
                      <div class="list-item__sub">${new Date(e.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} · ${e.event?.slice(0,30)||'无事件'}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>

        <!-- 历史趋势 -->
        <div class="card mb-4">
          <div class="card-title">📈 近7天情绪趋势</div>
          <div id="weekChart" style="min-height:200px"></div>
        </div>

        <!-- 情绪类型筛选 -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">🗂️ 历史记录</div>
            <button class="btn btn--sm btn--ghost" onclick="EmotionModule.showFilter()">🔍 筛选</button>
          </div>
          <div id="historyList"></div>
        </div>
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
    this._renderTodayChart(todayEmotions, types);
    this._renderWeekChart(all, types);
    this._renderHistory(all, types);
  },

  async _renderTodayChart(emotions, types) {
    const el = document.getElementById('todayChart');
    if (!el) return;
    if (emotions.length === 0 || typeof Chart === 'undefined') {
      // 显示默认平和基准线
      el.innerHTML = '<div class="text-center text-faint text-sm" style="padding:40px 0">基准线：平和 🌤️<br><span class="text-xs">系统默认，未主动确认</span></div>';
      return;
    }
    const labels = emotions.map(e => new Date(e.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
    const data = emotions.map(e => {
      const t = types.find(x => x.name === e.emotion_type);
      return t ? t.valence * (e.intensity||5) : 0;
    });
    const colors = emotions.map(e => {
      const t = types.find(x => x.name === e.emotion_type);
      return t?.color || '#BBA4D9';
    });
    const canvas = document.createElement('canvas');
    canvas.style.maxHeight = '200px';
    el.innerHTML = '';
    el.appendChild(canvas);
    new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{
        data, borderColor: '#F194A6', tension: 0.4, fill: true,
        backgroundColor: 'rgba(241,148,166,0.1)',
        pointBackgroundColor: colors, pointRadius: 6,
      }]},
      options: {
        plugins: { legend: { display: false } },
        scales: { y: { title: { display: true, text: '情绪值' } } },
        maintainAspectRatio: false,
      },
    });
  },

  async _renderWeekChart(all, types) {
    const el = document.getElementById('weekChart');
    if (!el || typeof Chart === 'undefined') return;
    const now = new Date();
    const weekStart = new Date(now); weekStart.setDate(now.getDate()-6); weekStart.setHours(0,0,0,0);
    const weekRecs = all.filter(e => new Date(e.created_at) >= weekStart);
    // 按天聚合平均
    const dailyAvg = {};
    weekRecs.forEach(e => {
      const d = e.created_at.slice(0,10);
      const t = types.find(x => x.name === e.emotion_type);
      const v = t ? t.valence * (e.intensity||5) : 0;
      if (!dailyAvg[d]) dailyAvg[d] = [];
      dailyAvg[d].push(v);
    });
    const labels = []; const data = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now); d.setDate(now.getDate()-i);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      labels.push(`${d.getMonth()+1}/${d.getDate()}`);
      if (dailyAvg[key]) {
        data.push(dailyAvg[key].reduce((a,b)=>a+b,0)/dailyAvg[key].length);
      } else {
        data.push(0); // 平和基准
      }
    }
    const canvas = document.createElement('canvas');
    canvas.style.maxHeight = '200px';
    el.innerHTML = '';
    el.appendChild(canvas);
    new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{
        data, borderColor: '#8A4E7B', tension: 0.4, fill: true,
        backgroundColor: 'rgba(138,78,123,0.08)',
      }]},
      options: {
        plugins: { legend: { display: false } },
        scales: { y: { title: { display: true, text: '平均情绪值' } } },
        maintainAspectRatio: false,
      },
    });
  },

  _renderHistory(all, types) {
    const el = document.getElementById('historyList');
    if (!el) return;
    const recent = all.sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0, 20);
    if (recent.length === 0) { el.innerHTML = UI.empty('📝','暂无历史记录'); return; }
    el.innerHTML = recent.map(e => {
      const t = types.find(x => x.name === e.emotion_type);
      const color = t?.color || '#BBA4D9';
      return `
        <div class="list-item" style="cursor:pointer;border-left:3px solid ${color}" onclick="EmotionModule.view('${e.id}')">
          <div class="list-item__main">
            <div class="list-item__title">${e.emotion_type} · ${e.intensity}/10</div>
            <div class="list-item__sub">${e.created_at.slice(0,16).replace('T',' ')} · ${e.event?.slice(0,30)||''}</div>
          </div>
        </div>
      `;
    }).join('');
  },

  quickAdd() { this.add(); },

  async add() {
    const types = await DB.getSetting('emotion_types') || [];
    UI.modal('记录情绪 🌤️', `
      <div class="field">
        <label class="field__label">情绪类型</label>
        <div class="tag-select" id="emoType">
          ${types.map(t => `<div class="tag-chip" style="${t.valence>0?'border-color:#7EC8A0':t.valence<0?'border-color:#E07080':''}" onclick="EmotionModule._selType(this,'${t.name}')">${t.name}</div>`).join('')}
        </div>
      </div>
      <div class="field">
        <label class="field__label">情绪强度（1-10）</label>
        <input class="input" type="range" min="1" max="10" value="5" id="emoIntensity" oninput="document.getElementById('emoIntVal').textContent=this.value">
        <div class="text-center text-2xl" style="color:var(--color-rose)" id="emoIntVal">5</div>
      </div>
      <div class="field">

/**
 * 情绪循环分析模块
 * 只有多条相似记录才提示模式
 */
const EmotionAnalysis = {
  async render() {
    const all = (await DB.list('emotions')).filter(e => !e.deleted_at);
    const types = await DB.getSetting('emotion_types') || [];
    const html = `
      <div class="page">
        <div class="page__title">🧠 情绪循环分析</div>

        <div class="card mb-4">
          <div class="ai-disclaimer" style="font-size:var(--font-size-sm)">
            此功能仅用于个人自我观察和复盘，不构成医学诊断或心理治疗建议。<br>
            AI 不会根据少量记录为你贴标签。只有出现多次相似记录时，才会提示可能存在的模式。
          </div>
        </div>

        ${all.length < 5 ? `
          <div class="card">
            ${UI.empty('📊', `目前有 ${all.length} 条情绪记录，至少需要 5 条才能进行模式分析。继续记录吧～`)}
          </div>
        ` : `
          ${this._analyze(all, types)}
        `}
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
  },

  _analyze(all, types) {
    // 高频情绪
    const emoCount = {};
    all.forEach(e => { emoCount[e.emotion_type] = (emoCount[e.emotion_type]||0)+1; });
    const topEmotions = Object.entries(emoCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

    // 高频触发事件（按 event 关键词简单聚类）
    const eventWords = {};
    all.forEach(e => {
      if (e.event) {
        e.event.split(/[，,。、\s]+/).forEach(w => {
          if (w.length >= 2 && w.length <= 6) eventWords[w] = (eventWords[w]||0)+1;
        });
      }
    });
    const topEvents = Object.entries(eventWords).filter(([w,c]) => c >= 2).sort((a,b)=>b[1]-a[1]).slice(0,8);

    // 时间段分布
    const hourBuckets = { '早晨(6-12)':0, '下午(12-18)':0, '晚上(18-24)':0, '深夜(0-6)':0 };
    all.forEach(e => {
      const h = new Date(e.created_at).getHours();
      if (h >= 6 && h < 12) hourBuckets['早晨(6-12)']++;
      else if (h >= 12 && h < 18) hourBuckets['下午(12-18)']++;
      else if (h >= 18) hourBuckets['晚上(18-24)']++;
      else hourBuckets['深夜(0-6)']++;
    });

    // 常见身体反应
    const bodyCount = {};
    all.forEach(e => { if (e.body_feeling) bodyCount[e.body_feeling] = (bodyCount[e.body_feeling]||0)+1; });
    const topBody = Object.entries(bodyCount).filter(([w,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,5);

    // 常见应对方式
    const reactCount = {};
    all.forEach(e => { if (e.reaction) reactCount[e.reaction] = (reactCount[e.reaction]||0)+1; });
    const topReact = Object.entries(reactCount).filter(([w,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,5);

    return `
      <div class="grid grid-2 mb-4">
        <div class="card">
          <div class="card-title">😊 高频情绪</div>
          <ul class="text-sm">
            ${topEmotions.map(([n,c]) => `<li>${n}: ${c} 次</li>`).join('')}
          </ul>
        </div>
        <div class="card">
          <div class="card-title">⚡ 高频触发事件</div>
          ${topEvents.length === 0 ? '<p class="text-faint text-sm">暂无足够数据</p>' : `
            <ul class="text-sm">${topEvents.map(([w,c]) => `<li>${w}: ${c} 次</li>`).join('')}</ul>
          `}
        </div>
      </div>

      <div class="grid grid-2 mb-4">
        <div class="card">
          <div class="card-title">⏰ 易波动时段</div>
          <ul class="text-sm">${Object.entries(hourBuckets).map(([t,c]) => `<li>${t}: ${c} 次</li>`).join('')}</ul>
        </div>
        <div class="card">
          <div class="card-title">💪 常见身体反应</div>
          ${topBody.length === 0 ? '<p class="text-faint text-sm">暂无足够数据</p>' : `
            <ul class="text-sm">${topBody.map(([w,c]) => `<li>${w}: ${c} 次</li>`).join('')}</ul>
          `}
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-title">🔄 常见应对方式</div>
        ${topReact.length === 0 ? '<p class="text-faint text-sm">暂无足够数据</p>' : `
          <ul class="text-sm">${topReact.map(([w,c]) => `<li>${w}: ${c} 次</li>`).join('')}</ul>
        `}
      </div>

      ${topEvents.length >= 2 ? `
        <div class="card">
          <div class="card-title">🔍 可能存在的重复模式</div>
          <div class="ai-block">
            根据你的记录，"${topEvents[0][0]}" 出现了 ${topEvents[0][1]} 次，是高频触发事件之一。
            ${topBody.length > 0 ? `伴随的身体反应常有：${topBody.map(b=>b[0]).join('、')}。` : ''}
            ${topReact.length > 0 ? `你的常见应对方式包括：${topReact.map(r=>r[0]).join('、')}。` : ''}
            <br><br>
            这是一个可供观察的角度，不代表现实结论。可以继续记录，观察是否存在稳定的"事件—想法—情绪—行为"循环。
          </div>
          <div class="ai-disclaimer">以上分析基于 ${all.length} 条记录的统计规律，不做确定性判断。</div>
        </div>
      ` : ''}
    `;
  },
};

    const real = monthRecs.filter(r => r.record_type === '真实互动' && r.count_as_real !== false);
    const sync = monthRecs.filter(r => r.record_type === '同步性或显化记录');
    const dream = monthRecs.filter(r => r.record_type === '梦境与直觉');
    const growth = monthRecs.filter(r => r.record_type === '感想与成长');
    return `
      <ul class="text-sm" style="line-height:1.8">

        <li>🔮 同步性/显化: ${sync.length}</li>
        <li>🌙 梦境与直觉: ${dream.length}</li>
        <li>🌱 感想与成长: ${growth.length}</li>
      </ul>
      <div class="text-faint text-xs mt-2">后三类默认不计入真实互动</div>
    `;
  },

  _lastInteraction(records) {
    const real = records.filter(r => r.record_type === '真实互动' && r.count_as_real !== false)
      .sort((a,b)=>b.created_at.localeCompare(a.created_at));
    if (real.length === 0) return '<p class="text-faint text-sm">暂无真实互动记录</p>';
    const last = new Date(real[0].created_at);
    const days = Math.floor((Date.now() - last.getTime()) / 86400000);
    return `
      <div class="text-2xl" style="color:var(--color-rose);font-weight:600">${days} 天</div>
      <div class="text-faint text-xs mt-1">${last.toLocaleDateString('zh-CN')}</div>
    `;
  },

  async _renderStatusChart(dailyStatus) {
    const el = document.getElementById('statusChart');
    if (!el || typeof Chart === 'undefined') return;
    const sorted = dailyStatus.sort((a,b)=>a.date.localeCompare(b.date));
    const labels = sorted.map(s => s.date.slice(5));
    const statusMap = { '活跃':3, '平静':2, '偏弱':1 };
    const data = sorted.map(s => statusMap[s.status] || 2);
    const colors = sorted.map(s => s.status==='活跃'?'#7EC8A0':s.status==='偏弱'?'#7090B0':'#BBA4D9');
    const canvas = document.createElement('canvas');
    canvas.style.maxHeight = '200px';
    el.innerHTML = '';
    el.appendChild(canvas);
    new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{

  quickAdd() { this.add(); },

    UI.modal('记录灵魂链接 ✨', `
      <div class="field">
        <label class="field__label">标题</label>
        <input class="input" id="rTitle" placeholder="给这条记录起个名字">
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label class="field__label">对象档案</label>
          <select class="select" id="rProfile">${profiles.map(p=>`<option value="${p.id}" ${p.id===currentProfileId?'selected':''}>${p.name}</option>`).join('')}</select>

        <div class="field">
          <label class="field__label">记录类型</label>

        <div class="text-xs text-faint mb-2">1️⃣ 实际发生（可确认的行为、话语和事件）</div>
        <textarea class="textarea" id="rHappened" placeholder="客观描述发生了什么"></textarea>
      </div>
      <div class="card--blur" style="background:rgba(187,164,217,0.06);padding:12px;border-radius:10px;margin:8px 0">
        <div class="text-xs text-faint mb-2">2️⃣ 我的感受（情绪、身体感受、期待和担忧）</div>
        <textarea class="textarea" id="rFeeling" placeholder="我当时的第一反应、情绪和身体感受"></textarea>
        <input class="input mt-2" id="rEmotion" placeholder="情绪和强度（如：开心 7/10）">

        <div class="text-xs text-faint mb-2">3️⃣ 我的理解（个人联想、象征意义和灵性解读）</div>
        <textarea class="textarea" id="rUnderstanding" placeholder="我的理解和联想"></textarea>
        <div class="text-xs text-faint mt-2">⚠️ 系统不会把"我的理解"表述为已证实的客观事实</div>

      </div>
    `);
    // 默认时间
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    document.getElementById('rTime').value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;

  _onTypeChange() {
    const t = document.getElementById('rType')?.value;
    const field = document.getElementById('methodField');
    if (t === '真实互动') {
      field.style.display = '';
    } else {
      field.style.display = 'none';
    }
    // 非真实互动默认不计入
    const cb = document.getElementById('rCountReal');
    if (cb) cb.checked = (t === '真实互动');

  async _save() {
    const profileId = document.getElementById('rProfile').value;
    const type = document.getElementById('rType').value;
    const timeStr = document.getElementById('rTime').value;
    await DB.save('link_records', {
      profile_id: profileId,
      title: document.getElementById('rTitle').value,
      record_type: type,
      method: document.getElementById('rMethod')?.value || '',
      happened: document.getElementById('rHappened').value,
      feeling: document.getElementById('rFeeling').value,
      emotion: document.getElementById('rEmotion').value,
      need: document.getElementById('rNeed').value,
      understanding: document.getElementById('rUnderstanding').value,
      insight: document.getElementById('rInsight').value,
      tags: document.getElementById('rTags').value.split(',').map(s=>s.trim()).filter(Boolean),
      is_important: document.getElementById('rImportant').checked,
      count_as_real: document.getElementById('rCountReal').checked,
      created_at: timeStr ? new Date(timeStr).toISOString() : nowISO(),
    });
    // 如果有明显情绪变化，询问是否同步到情绪记录
    const emotion = document.getElementById('rEmotion').value;
    UI.closeModal();
    if (emotion) {
      setTimeout(() => {
        UI.modal('同步到情绪记录？', `
          <p class="text-soft mb-4">检测到你记录了情绪变化（${emotion}），是否同步到情绪曲线？</p>
          <div class="flex gap-3" style="justify-content:flex-end">
            <button class="btn" onclick="UI.closeModal()">不同步</button>
            <button class="btn btn--primary" onclick="SoulModule._syncEmotion('${emotion}')">同步</button>
          </div>
        `);
      }, 300);
    }
    UI.toast('记录已保存','success');
    this.render();
  },

  async _syncEmotion(emotionStr) {
    UI.closeModal();
    const parts = emotionStr.split(/\s+/);
    const type = parts[0] || '平和';
    const intensity = parseInt(parts[1]) || 5;
    await DB.save('emotions', {
      emotion_type: type,
      intensity,
      event: '来自灵魂链接记录',
      source_type: 'link_sync',
    });
    UI.toast('已同步到情绪记录','success');
  },

  async view(id) {
    const r = await DB.get('link_records', id);
    if (!r) return;
    UI.modal(r.title || r.record_type, `
      <div class="list-item"><div class="list-item__main">
        <div class="list-item__title">${this._typeIcon(r.record_type)} ${r.record_type}</div>
        <div class="list-item__sub">${r.created_at.slice(0,19).replace('T',' ')} ${r.is_important?'· ⭐重要':''}</div>
      </div></div>
      ${r.method ? `<p class="text-soft text-sm mt-2">互动方式: ${r.method}</p>` : ''}
      ${r.happened ? `<div class="card--blur mt-3" style="background:rgba(241,148,166,0.06);padding:12px;border-radius:10px"><div class="text-xs text-faint mb-1">实际发生</div><div>${r.happened}</div></div>` : ''}
      ${r.feeling ? `<div class="card--blur mt-2" style="background:rgba(187,164,217,0.06);padding:12px;border-radius:10px"><div class="text-xs text-faint mb-1">我的感受</div><div>${r.feeling}</div>${r.emotion?`<div class="text-sm mt-1">${r.emotion}</div>`:''}${r.need?`<div class="text-sm mt-1">需要: ${r.need}</div>`:''}</div>` : ''}
      ${r.understanding ? `<div class="card--blur mt-2" style="background:rgba(138,78,123,0.06);padding:12px;border-radius:10px"><div class="text-xs text-faint mb-1">我的理解（个人联想，非客观事实）</div><div>${r.understanding}</div></div>` : ''}
      ${r.insight ? `<p class="mt-3"><b>感悟:</b> ${r.insight}</p>` : ''}
      ${r.tags?.length ? `<div class="mt-2">${r.tags.map(t=>`<span class="tag-chip" style="font-size:11px;padding:2px 8px">${t}</span>`).join(' ')}</div>` : ''}
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn btn--accent btn--sm" onclick="SoulModule._del('${id}')">删除</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  async _del(id) {
    if (!await UI.confirm('删除这条记录？会影响相关统计。')) return;
    await DB.hardDelete('link_records', id);
    UI.closeModal();
    UI.toast('已删除','success');
    this.render();
  },

    UI.modal('选择对象档案', `
      ${profiles.map(p => `

          <span style="font-size:20px">🌙</span>
          <div class="list-item__main">
            <div class="list-item__title">${p.name}</div>
            <div class="list-item__sub">${p.note||''}</div>
          </div>

      `).join('')}

    `);

    UI.closeModal();
    this.render();

  async addProfile() {
    UI.closeModal();
    UI.modal('新建对象档案', `
      <div class="field">
        <label class="field__label">名称</label>
        <input class="input" id="pName" placeholder="如：另一个昵称">
      </div>
      <div class="field">
        <label class="field__label">备注</label>
        <input class="input" id="pNote">
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">

      <div class="field">
        <label class="field__label">今天你觉得链接状态如何？（手动选择，系统不自动判断）</label>
        <div class="tag-select" id="statusSelect">
          <div class="tag-chip ${existing?.status==='活跃'?'active':''}" onclick="SoulModule._selStatus(this,'活跃')">🌙 活跃</div>
          <div class="tag-chip ${existing?.status==='平静'?'active':''}" onclick="SoulModule._selStatus(this,'平静')">☁️ 平静</div>

          <label class="field__label">情绪状态</label>
          <div class="tag-select" id="emoTags">

        </div>
        <div class="field">
          <label class="field__label">现实环境</label>
          <div class="tag-select" id="envTags">
            ${['工作很多','学习压力大','社交较多','独处时间多','天气影响','旅行或环境变化'].map(v=>`<div class="tag-chip ${existing?.environment?.includes(v)?'active':''}" onclick="this.classList.toggle('active')">${v}</div>`).join('')}

        <label class="field__label">补充说明</label>
        <textarea class="textarea" id="sExtra">${existing?.extra||''}</textarea>

      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="SoulModule._saveDailyStatus('${existing?.id||''}','${currentProfileId}')">保存</button>
      </div>
    `);
    this._selStatusVal = existing?.status || null;
  },

  _selStatus(el, s) {
    el.parentElement.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this._selStatusVal = s;
  },

  _collectTags(containerId) {
    return [...document.querySelectorAll(`#${containerId} .tag-chip.active`)].map(el => el.textContent);
  },

  async _saveDailyStatus(id, profileId) {
    if (!this._selStatusVal) { UI.toast('请选择链接状态','error'); return; }
    const data = {
      profile_id: profileId,
      date: todayKey(),
      status: this._selStatusVal,
      reason: document.getElementById('sReason').value,
      sleep: this._collectTags('sleepTags'),
      body: this._collectTags('bodyTags'),
      emotion_state: this._collectTags('emoTags'),
      environment: this._collectTags('envTags'),
      extra: document.getElementById('sExtra').value,
    };
    if (id) data.id = id;
    await DB.save('link_daily_status', data);

    // 联动：如果偏弱且情绪低落，询问是否同步情绪
    if (this._selStatusVal === '偏弱' && data.emotion_state.includes('低落')) {
      UI.closeModal();
      setTimeout(() => {
        UI.modal('同步到情绪记录？', `
          <p class="text-soft mb-4">今天链接状态偏弱，且情绪低落，是否同步到情绪曲线？</p>
          <div class="flex gap-3" style="justify-content:flex-end">
            <button class="btn" onclick="UI.closeModal()">不同步</button>
            <button class="btn btn--primary" onclick="SoulModule._syncLowEmotion()">同步</button>
          </div>
        `);
      }, 300);
    } else {
      UI.closeModal();
    }
    UI.toast('链接状态已记录','success');
    this.render();
  },

  async _syncLowEmotion() {
    UI.closeModal();
    await DB.save('emotions', {
      emotion_type: '低落',
      intensity: 5,
      event: '链接状态偏弱',
      source_type: 'link_status_sync',
    });
    UI.toast('已同步到情绪记录','success');
  },

  async showFilter() {
    const types = ['真实互动','同步性或显化记录','感想与成长','梦境与直觉','重要纪念'];
    UI.modal('筛选记录', `
      <div class="field">
        <label class="field__label">记录类型</label>
        <select class="select" id="fType"><option value="">全部</option>${types.map(t=>`<option>${t}</option>`).join('')}</select>
      </div>

        <input class="input" type="date" id="fEnd">

        <label class="field__label">关键词</label>
        <input class="input" id="fKeyword">

      </div>
    `);

  async _applyFilter() {
    const type = document.getElementById('fType').value;
    const start = document.getElementById('fStart').value;
    const end = document.getElementById('fEnd').value;
    const kw = document.getElementById('fKeyword').value.trim().toLowerCase();
    UI.closeModal();
    const profiles = (await DB.list('link_profiles')).filter(p => !p.deleted_at);
    const currentProfileId = App.state.settings.current_link_profile || profiles[0]?.id;
    let all = (await DB.list('link_records')).filter(r => !r.deleted_at && r.profile_id === currentProfileId);
    if (type) all = all.filter(r => r.record_type === type);
    if (start) all = all.filter(r => r.created_at >= start);
    if (end) all = all.filter(r => r.created_at <= end + 'T23:59:59');
    if (kw) all = all.filter(r => (r.title||'').toLowerCase().includes(kw) || (r.happened||'').toLowerCase().includes(kw) || (r.feeling||'').toLowerCase().includes(kw));
    UI.modal(`筛选结果（${all.length} 条）`, all.length === 0 ? '<p class="text-faint text-sm">无匹配记录</p>' : `
      <div class="flex flex-col gap-2">
        ${all.sort((a,b)=>b.created_at.localeCompare(a.created_at)).map(r => `
          <div class="list-item" style="cursor:pointer" onclick="UI.closeModal();SoulModule.view('${r.id}')">
            <span style="font-size:20px">${this._typeIcon(r.record_type)}</span>
            <div class="list-item__main">
              <div class="list-item__title">${r.title||r.record_type}</div>
              <div class="list-item__sub">${r.created_at.slice(0,16).replace('T',' ')}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `);
  },

  async monthlyReview() {
    const profiles = (await DB.list('link_profiles')).filter(p => !p.deleted_at);
    const currentProfileId = App.state.settings.current_link_profile || profiles[0]?.id;
    const records = (await DB.list('link_records')).filter(r => !r.deleted_at && r.profile_id === currentProfileId);
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthRecs = records.filter(r => new Date(r.created_at) >= monthStart);
    const real = monthRecs.filter(r => r.record_type === '真实互动' && r.count_as_real !== false);
    const otherActive = monthRecs.filter(r => r.record_type === '真实互动' && r.method === '对方主动联系');
    const myActive = monthRecs.filter(r => r.record_type === '真实互动' && r.method === '我主动联系');
    const methodCount = {};
    real.forEach(r => { methodCount[r.method] = (methodCount[r.method]||0)+1; });
    UI.modal(`${now.getMonth()+1}月链接回顾`, `
      <div class="text-soft text-sm mb-3">基于 ${monthRecs.length} 条记录生成（可编辑）</div>
      <div class="card--blur" style="background:var(--color-bg-alt);padding:14px;border-radius:12px">
        <p class="text-sm"><b>本月真实互动情况：</b>${real.length} 次</p>
        <p class="text-sm mt-2"><b>主要互动方式：</b>${Object.entries(methodCount).map(([m,c])=>`${m}(${c})`).join('、')||'-'}</p>
        <p class="text-sm mt-2"><b>对方主动：</b>${otherActive.length} 次 · <b>我主动：</b>${myActive.length} 次</p>
      </div>
      <div class="ai-block mt-3">
        📝 以上为客观统计。你可以在下方补充你的感受和成长。
      </div>
      <div class="field mt-3">
        <label class="field__label">带来安全感或快乐的事情</label>
        <textarea class="textarea" id="mrJoy"></textarea>
      </div>
      <div class="field">
        <label class="field__label">引发不安、委屈或失落的情境</label>
        <textarea class="textarea" id="mrSad"></textarea>
      </div>
      <div class="field">
        <label class="field__label">反复出现的期待和主题</label>
        <textarea class="textarea" id="mrTheme"></textarea>
      </div>
      <div class="field">
        <label class="field__label">对自身需求和边界的新认识</label>
        <textarea class="textarea" id="mrBoundary"></textarea>
      </div>
      <div class="field">

      </div>
      <div class="field">
        <label class="field__label">下个月值得继续观察的问题</label>
        <textarea class="textarea" id="mrQuestion"></textarea>
