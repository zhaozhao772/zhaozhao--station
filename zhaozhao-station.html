                <div class="week-checkin__day">
                  <div class="week-checkin__day-label">
                    ${weekdays[d]}
                  </div>
                  <div class="week-checkin__day-items">
                    ${dayRecs.length === 0
                      ? '<span class="text-faint text-xs">未打卡</span>'

                        <div class="week-checkin__item">
                          ${w.project} · ${w.duration}分钟 · 身体${'☆'.repeat(w.body_score||3)}

                      `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- 一周总结 -->
        <div class="card mb-4">
          <div class="card-title">📊 一周总结复盘</div>
          ${this._weekSummary(weekRecs)}

        <!-- 月度曲线 -->
        <div class="card mb-4">
          <div class="card-title">📈 本月身体感受曲线</div>

            <span style="color:#7090B0">● 不佳(1-2☆)</span>
            <span style="color:#8A4E7B">● 平和(3-4☆)</span>
            <span style="color:#DB5A6B">● 极佳(5☆)</span>
          </div>
          <div class="ai-disclaimer">曲线完全依据每日实际记录的☆数量绘制，不可手动修改</div>
        </div>

        <!-- 一月变化观察 -->
        <div class="card">
          <div class="card-title">🔍 一月变化观察</div>
          ${this._monthObservation(all)}

        </div>
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
    this._renderMonthChart(all);
  },

  _intensityIcon(intensity) {
    if (!intensity) return '🏃';
    if (intensity.includes('低')) return '🚶';
    if (intensity.includes('高')) return '🔥';
    return '🏃';
  },

  _weekSummary(recs) {
    if (recs.length === 0) return '<p class="text-faint text-sm">本周还没有锻炼记录</p>';
    const projectCount = {};
    recs.forEach(w => { projectCount[w.project] = (projectCount[w.project]||0)+1; });
    const bodyAvg = (recs.reduce((s,w)=>s+(w.body_score||3),0)/recs.length).toFixed(1);
    const mindWords = {};
    recs.forEach(w => { if (w.mind_feeling) mindWords[w.mind_feeling] = (mindWords[w.mind_feeling]||0)+1; });
    return `
      <ul class="text-sm" style="line-height:2">
        <li>📊 本周运动频率: <b>${recs.length} 次</b></li>
        <li>🏋️ 类型分布: ${Object.entries(projectCount).map(([p,c])=>`${p}(${c})`).join('、')}</li>
        <li>💪 身体感受平均评分: <b>${bodyAvg} ☆</b></li>
        <li>🧠 心理感受高频词: ${Object.entries(mindWords).sort((a,b)=>b[1]-a[1]).map(([w,c])=>`${w}(${c})`).join('、')||'-'}</li>
      </ul>
    `;
  },

  _monthObservation(all) {
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthRecs = all.filter(w => new Date(w.date) >= monthStart);
    if (monthRecs.length < 2) return '<p class="text-faint text-sm">本月记录不足，继续加油记录吧</p>';
    const bodyScores = monthRecs.map(w => w.body_score||3);
    const trend = bodyScores[bodyScores.length-1] > bodyScores[0] ? '上升' : (bodyScores[bodyScores.length-1] < bodyScores[0] ? '下降' : '稳定');
    const avg = (bodyScores.reduce((a,b)=>a+b,0)/bodyScores.length).toFixed(1);
    return `
      <ul class="text-sm" style="line-height:2">
        <li>📈 本月锻炼: <b>${monthRecs.length} 次</b></li>
        <li>💪 身体感受趋势: <b>${trend}</b>（平均 ${avg} ☆）</li>
        <li>📊 体能状态: ${avg >= 4 ? '整体感受良好' : avg >= 3 ? '整体平稳' : '需要注意休息'}</li>
      </ul>
    `;
  },

  async _renderMonthChart(all) {
    const el = document.getElementById('monthChart');
    if (!el || typeof Chart === 'undefined') return;
    const now = new Date();
    const year = now.getFullYear(); const month = now.getMonth();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    // 每日取最高分（如果一天多次取最高）
    const dailyBest = {};
    all.forEach(w => {
      const d = new Date(w.date);
      if (d.getFullYear() === year && d.getMonth() === month) {
        const day = d.getDate();
        const score = w.body_score || 3;
        if (!dailyBest[day] || score > dailyBest[day]) dailyBest[day] = score;
      }
    });
    const labels = []; const data = []; const colors = [];
    for (let d = 1; d <= daysInMonth; d++) {
      labels.push(`${d}`);
      if (dailyBest[d]) {
        data.push(dailyBest[d]);
        colors.push(dailyBest[d] <= 2 ? '#7090B0' : (dailyBest[d] <= 4 ? '#8A4E7B' : '#DB5A6B'));
      } else {
        data.push(null);
        colors.push('#E0E0E0');
      }
    }
    const canvas = document.createElement('canvas');
    canvas.style.maxHeight = '260px';
    el.innerHTML = '';
    el.appendChild(canvas);
    new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{
        data, borderColor: '#8A4E7B', tension: 0.3,
        fill: false, spanGaps: true,
        pointBackgroundColor: colors, pointRadius: 5, pointHoverRadius: 7,
      }]},
      options: {
        plugins: { legend: { display: false },
          tooltip: { callbacks: { label: (ctx) => {
            const v = ctx.parsed.y;
            if (v == null) return '未记录';
            return `${v} ☆ (${v<=2?'不佳':v<=4?'平和':'极佳'})`;
          }}}
        },
        scales: { y: { min: 0, max: 5, ticks: { stepSize: 1, callback: v => v+'☆' } },
                  x: { title: { display: true, text: '日期' } } },
        maintainAspectRatio: false,
      },
    });
  },

  async add() {
    const today = todayKey();
    UI.modal('今日运动打卡 🏃', `
      <div class="field">
        <label class="field__label">运动项目</label>
        <input class="input" id="wProject" placeholder="如：跑步、瑜伽、跳绳">
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label class="field__label">时长（分钟）</label>
          <input class="input" type="number" id="wDuration" min="1">
        </div>
        <div class="field">
          <label class="field__label">强度</label>
          <select class="select" id="wIntensity">
            <option>低强度</option>
            <option>中强度</option>
            <option>高强度</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field__label">身体感受</label>
        <input class="input" id="wBody" placeholder="如：肌肉酸痛/轻松/紧绷">
      </div>
      <div class="field">
        <label class="field__label">身体感受评分</label>
        <div class="tag-select" id="bodyScore">
          ${[1,2,3,4,5].map(s => `<div class="tag-chip" onclick="WorkoutModule._selScore(this,'body',${s})">${'☆'.repeat(s)}</div>`).join('')}
        </div>
        <div class="field__hint">1-2☆不佳(蓝) · 3-4☆平和(紫) · 5☆极佳(红)</div>
      </div>
      <div class="field">
        <label class="field__label">心理感受</label>
        <input class="input" id="wMind" placeholder="如：释放/疲惫/成就感">
      </div>
      <div class="field">
        <label class="field__label">心理感受评分</label>
        <div class="tag-select" id="mindScore">
          ${[1,2,3,4,5].map(s => `<div class="tag-chip" onclick="WorkoutModule._selScore(this,'mind',${s})">${'☆'.repeat(s)}</div>`).join('')}
        </div>
      </div>
      <div class="field">
        <label class="field__label">日期</label>
        <input class="input" type="date" id="wDate" value="${today}">
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="WorkoutModule._save()">保存打卡</button>
      </div>
    `);
    this._scores = { body: 3, mind: 3 };
  },

  _selScore(el, type, score) {
    el.parentElement.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this._scores[type] = score;
  },

  async _save() {
    const project = document.getElementById('wProject').value.trim();
    if (!project) { UI.toast('请填写运动项目','error'); return; }
    await DB.save('workouts', {
      project,
      duration: parseInt(document.getElementById('wDuration').value) || 0,
      intensity: document.getElementById('wIntensity').value,
      body_feeling: document.getElementById('wBody').value,
      body_score: this._scores.body,
      mind_feeling: document.getElementById('wMind').value,
      mind_score: this._scores.mind,
      date: document.getElementById('wDate').value,
    });
    UI.closeModal();
    UI.toast('打卡成功！','success');
    this.render();
  },
};

/**
 * 情绪天气监测模块
 * 每天默认平和，一天可多次记录，折线图
 */
const EmotionModule = {
  async render() {
    const types = await DB.getSetting('emotion_types') || [];
    const all = (await DB.list('emotions')).filter(e => !e.deleted_at);
    const today = todayKey();
    const todayEmotions = all.filter(e => e.created_at?.startsWith(today));

    const html = `
      <div class="page">
        <div class="flex justify-between items-center mb-4">
          <div class="page__title" style="margin:0">🌤️ 情绪天气监测</div>
          <button class="btn btn--primary btn--sm" onclick="EmotionModule.add()">+ 记录情绪</button>
        </div>

        <!-- 今日情绪天气图 -->
        <div class="card mb-4">
          <div class="card-title">📊 今日情绪天气</div>
          <div id="todayChart" style="min-height:200px"></div>
          ${todayEmotions.length === 0 ? '<p class="text-faint text-xs text-center">系统默认：平和（未记录）— 系统默认，非用户主动确认</p>' : ''}
        </div>

        <!-- 今日记录列表 -->
        <div class="card mb-4">
          <div class="card-title">📝 今日记录</div>
          ${todayEmotions.length === 0 ? UI.empty('🌤️','今天还没有情绪记录，默认平和') : `
            <div class="flex flex-col gap-2">
              ${todayEmotions.sort((a,b)=>a.created_at.localeCompare(b.created_at)).map(e => {
                const t = types.find(x => x.name === e.emotion_type);
                const color = t?.color || '#BBA4D9';
                return `
                  <div class="list-item" style="cursor:pointer;border-left:3px solid ${color}" onclick="EmotionModule.view('${e.id}')">
                    <div class="list-item__main">
                      <div class="list-item__title">
                        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};margin-right:6px"></span>
                        ${e.emotion_type} · 强度 ${e.intensity}/10
                      </div>
                      <div class="list-item__sub">${new Date(e.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} · ${e.event?.slice(0,30)||'无事件'}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>

        <!-- 历史趋势 -->
        <div class="card mb-4">
          <div class="card-title">📈 近7天情绪趋势</div>
          <div id="weekChart" style="min-height:200px"></div>
        </div>

        <!-- 情绪类型筛选 -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">🗂️ 历史记录</div>
            <button class="btn btn--sm btn--ghost" onclick="EmotionModule.showFilter()">🔍 筛选</button>
          </div>
          <div id="historyList"></div>
        </div>
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
    this._renderTodayChart(todayEmotions, types);
    this._renderWeekChart(all, types);
    this._renderHistory(all, types);
  },

  async _renderTodayChart(emotions, types) {
    const el = document.getElementById('todayChart');
    if (!el) return;
    if (emotions.length === 0 || typeof Chart === 'undefined') {
      // 显示默认平和基准线
      el.innerHTML = '<div class="text-center text-faint text-sm" style="padding:40px 0">基准线：平和 🌤️<br><span class="text-xs">系统默认，未主动确认</span></div>';
      return;
    }
    const labels = emotions.map(e => new Date(e.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
    const data = emotions.map(e => {
      const t = types.find(x => x.name === e.emotion_type);
      return t ? t.valence * (e.intensity||5) : 0;
    });
    const colors = emotions.map(e => {
      const t = types.find(x => x.name === e.emotion_type);
      return t?.color || '#BBA4D9';
    });
    const canvas = document.createElement('canvas');
    canvas.style.maxHeight = '200px';
    el.innerHTML = '';
    el.appendChild(canvas);
    new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{
        data, borderColor: '#F194A6', tension: 0.4, fill: true,
        backgroundColor: 'rgba(241,148,166,0.1)',
        pointBackgroundColor: colors, pointRadius: 6,
      }]},
      options: {
        plugins: { legend: { display: false } },
        scales: { y: { title: { display: true, text: '情绪值' } } },
        maintainAspectRatio: false,
      },
    });
  },

  async _renderWeekChart(all, types) {
    const el = document.getElementById('weekChart');
    if (!el || typeof Chart === 'undefined') return;
    const now = new Date();
    const weekStart = new Date(now); weekStart.setDate(now.getDate()-6); weekStart.setHours(0,0,0,0);
    const weekRecs = all.filter(e => new Date(e.created_at) >= weekStart);
    // 按天聚合平均
    const dailyAvg = {};
    weekRecs.forEach(e => {
      const d = e.created_at.slice(0,10);
      const t = types.find(x => x.name === e.emotion_type);
      const v = t ? t.valence * (e.intensity||5) : 0;
      if (!dailyAvg[d]) dailyAvg[d] = [];
      dailyAvg[d].push(v);
    });
    const labels = []; const data = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now); d.setDate(now.getDate()-i);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      labels.push(`${d.getMonth()+1}/${d.getDate()}`);
      if (dailyAvg[key]) {
        data.push(dailyAvg[key].reduce((a,b)=>a+b,0)/dailyAvg[key].length);
      } else {
        data.push(0); // 平和基准
      }
    }
    const canvas = document.createElement('canvas');
    canvas.style.maxHeight = '200px';
    el.innerHTML = '';
    el.appendChild(canvas);
    new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{
        data, borderColor: '#8A4E7B', tension: 0.4, fill: true,
        backgroundColor: 'rgba(138,78,123,0.08)',
      }]},
      options: {
        plugins: { legend: { display: false } },
        scales: { y: { title: { display: true, text: '平均情绪值' } } },
        maintainAspectRatio: false,
      },
    });
  },

  _renderHistory(all, types) {
    const el = document.getElementById('historyList');
    if (!el) return;
    const recent = all.sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0, 20);
    if (recent.length === 0) { el.innerHTML = UI.empty('📝','暂无历史记录'); return; }
    el.innerHTML = recent.map(e => {
      const t = types.find(x => x.name === e.emotion_type);
      const color = t?.color || '#BBA4D9';
      return `
        <div class="list-item" style="cursor:pointer;border-left:3px solid ${color}" onclick="EmotionModule.view('${e.id}')">
          <div class="list-item__main">
            <div class="list-item__title">${e.emotion_type} · ${e.intensity}/10</div>
            <div class="list-item__sub">${e.created_at.slice(0,16).replace('T',' ')} · ${e.event?.slice(0,30)||''}</div>
          </div>
        </div>
      `;
    }).join('');
  },

  quickAdd() { this.add(); },

  async add() {
    const types = await DB.getSetting('emotion_types') || [];
    UI.modal('记录情绪 🌤️', `
      <div class="field">
        <label class="field__label">情绪类型</label>
        <div class="tag-select" id="emoType">
          ${types.map(t => `<div class="tag-chip" style="${t.valence>0?'border-color:#7EC8A0':t.valence<0?'border-color:#E07080':''}" onclick="EmotionModule._selType(this,'${t.name}')">${t.name}</div>`).join('')}
        </div>
      </div>

        <button class="btn btn--primary" onclick="EmotionModule._save()">保存</button>
      </div>
    `);
    this._selTypeVal = null;
  },

  _selType(el, name) {
    el.parentElement.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this._selTypeVal = name;
  },

  async _save() {
    if (!this._selTypeVal) { UI.toast('请选择情绪类型','error'); return; }
    await DB.save('emotions', {
      emotion_type: this._selTypeVal,
      intensity: parseInt(document.getElementById('emoIntensity').value),
      event: document.getElementById('emoEvent').value,
      who: document.getElementById('emoWho').value,
      body_feeling: document.getElementById('emoBody').value,
      thought: document.getElementById('emoThought').value,
      reaction: document.getElementById('emoReaction').value,
      need: document.getElementById('emoNeed').value,
      duration: document.getElementById('emoDuration').value,
      relieved: document.getElementById('emoRelieved').value,
      extra: document.getElementById('emoExtra').value,
    });
    UI.closeModal();
    UI.toast('情绪已记录','success');
    this.render();
  },

  async view(id) {
    const e = await DB.get('emotions', id);
    if (!e) return;
    const types = await DB.getSetting('emotion_types') || [];
    const t = types.find(x => x.name === e.emotion_type);
    UI.modal('情绪记录详情', `
      <div class="list-item" style="border-left:3px solid ${t?.color||'#BBA4D9'}">

      </div>

  async _applyFilter() {
    const start = document.getElementById('fStart').value;
    const end = document.getElementById('fEnd').value;
    const kw = document.getElementById('fKeyword').value.trim().toLowerCase();
    UI.closeModal();
    let all = (await DB.list('emotions')).filter(e => !e.deleted_at);
    if (start) all = all.filter(e => e.created_at >= start);
    if (end) all = all.filter(e => e.created_at <= end + 'T23:59:59');
    if (kw) all = all.filter(e => (e.event||'').toLowerCase().includes(kw) || (e.thought||'').toLowerCase().includes(kw) || (e.extra||'').toLowerCase().includes(kw));
    const types = await DB.getSetting('emotion_types') || [];
    UI.modal(`筛选结果（${all.length} 条）`, all.length === 0 ? '<p class="text-faint text-sm">无匹配记录</p>' : `

    `);
  },
};

/**
 * 情绪循环分析模块
 * 只有多条相似记录才提示模式
 */
const EmotionAnalysis = {
  async render() {
    const all = (await DB.list('emotions')).filter(e => !e.deleted_at);
    const types = await DB.getSetting('emotion_types') || [];
    const html = `
      <div class="page">
        <div class="page__title">🧠 情绪循环分析</div>

        <div class="card mb-4">
          <div class="ai-disclaimer" style="font-size:var(--font-size-sm)">
            此功能仅用于个人自我观察和复盘，不构成医学诊断或心理治疗建议。<br>
            AI 不会根据少量记录为你贴标签。只有出现多次相似记录时，才会提示可能存在的模式。
          </div>
        </div>

        ${all.length < 5 ? `
          <div class="card">
            ${UI.empty('📊', `目前有 ${all.length} 条情绪记录，至少需要 5 条才能进行模式分析。继续记录吧～`)}
          </div>
        ` : `
          ${this._analyze(all, types)}
        `}
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
  },

  _analyze(all, types) {
    // 高频情绪
    const emoCount = {};
    all.forEach(e => { emoCount[e.emotion_type] = (emoCount[e.emotion_type]||0)+1; });
    const topEmotions = Object.entries(emoCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

    // 高频触发事件（按 event 关键词简单聚类）
    const eventWords = {};
    all.forEach(e => {
      if (e.event) {
        e.event.split(/[，,。、\s]+/).forEach(w => {
          if (w.length >= 2 && w.length <= 6) eventWords[w] = (eventWords[w]||0)+1;
        });
      }
    });
    const topEvents = Object.entries(eventWords).filter(([w,c]) => c >= 2).sort((a,b)=>b[1]-a[1]).slice(0,8);

    // 时间段分布
    const hourBuckets = { '早晨(6-12)':0, '下午(12-18)':0, '晚上(18-24)':0, '深夜(0-6)':0 };
    all.forEach(e => {
      const h = new Date(e.created_at).getHours();
      if (h >= 6 && h < 12) hourBuckets['早晨(6-12)']++;
      else if (h >= 12 && h < 18) hourBuckets['下午(12-18)']++;
      else if (h >= 18) hourBuckets['晚上(18-24)']++;
      else hourBuckets['深夜(0-6)']++;
    });

    // 常见身体反应
    const bodyCount = {};
    all.forEach(e => { if (e.body_feeling) bodyCount[e.body_feeling] = (bodyCount[e.body_feeling]||0)+1; });
    const topBody = Object.entries(bodyCount).filter(([w,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,5);

    // 常见应对方式
    const reactCount = {};
    all.forEach(e => { if (e.reaction) reactCount[e.reaction] = (reactCount[e.reaction]||0)+1; });
    const topReact = Object.entries(reactCount).filter(([w,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,5);

    return `
      <div class="grid grid-2 mb-4">
        <div class="card">
          <div class="card-title">😊 高频情绪</div>
          <ul class="text-sm">
            ${topEmotions.map(([n,c]) => `<li>${n}: ${c} 次</li>`).join('')}
          </ul>
        </div>
        <div class="card">
          <div class="card-title">⚡ 高频触发事件</div>
          ${topEvents.length === 0 ? '<p class="text-faint text-sm">暂无足够数据</p>' : `
            <ul class="text-sm">${topEvents.map(([w,c]) => `<li>${w}: ${c} 次</li>`).join('')}</ul>
          `}
        </div>
      </div>

      <div class="grid grid-2 mb-4">
        <div class="card">
          <div class="card-title">⏰ 易波动时段</div>
          <ul class="text-sm">${Object.entries(hourBuckets).map(([t,c]) => `<li>${t}: ${c} 次</li>`).join('')}</ul>
        </div>
        <div class="card">
          <div class="card-title">💪 常见身体反应</div>
          ${topBody.length === 0 ? '<p class="text-faint text-sm">暂无足够数据</p>' : `
            <ul class="text-sm">${topBody.map(([w,c]) => `<li>${w}: ${c} 次</li>`).join('')}</ul>
          `}
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-title">🔄 常见应对方式</div>
        ${topReact.length === 0 ? '<p class="text-faint text-sm">暂无足够数据</p>' : `
          <ul class="text-sm">${topReact.map(([w,c]) => `<li>${w}: ${c} 次</li>`).join('')}</ul>
        `}
      </div>

      ${topEvents.length >= 2 ? `
        <div class="card">
          <div class="card-title">🔍 可能存在的重复模式</div>
          <div class="ai-block">
            根据你的记录，"${topEvents[0][0]}" 出现了 ${topEvents[0][1]} 次，是高频触发事件之一。
            ${topBody.length > 0 ? `伴随的身体反应常有：${topBody.map(b=>b[0]).join('、')}。` : ''}
            ${topReact.length > 0 ? `你的常见应对方式包括：${topReact.map(r=>r[0]).join('、')}。` : ''}
            <br><br>
            这是一个可供观察的角度，不代表现实结论。可以继续记录，观察是否存在稳定的"事件—想法—情绪—行为"循环。
          </div>
          <div class="ai-disclaimer">以上分析基于 ${all.length} 条记录的统计规律，不做确定性判断。</div>
        </div>
      ` : ''}
    `;
  },
};

  },

  _typeIcon(t) {
    return { '真实互动':'💬','同步性或显化记录':'🔮','感想与成长':'🌱','梦境与直觉':'🌙','重要纪念':'💝' }[t] || '✨';
  },

  _monthStats(records) {
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthRecs = records.filter(r => new Date(r.created_at) >= monthStart);
    const real = monthRecs.filter(r => r.record_type === '真实互动' && r.count_as_real !== false);
    const sync = monthRecs.filter(r => r.record_type === '同步性或显化记录');
    const dream = monthRecs.filter(r => r.record_type === '梦境与直觉');
    const growth = monthRecs.filter(r => r.record_type === '感想与成长');
    return `
      <ul class="text-sm" style="line-height:1.8">
        <li>💬 真实互动: <b>${real.length}</b></li>
        <li>🔮 同步性/显化: ${sync.length}</li>
        <li>🌙 梦境与直觉: ${dream.length}</li>
        <li>🌱 感想与成长: ${growth.length}</li>
      </ul>
      <div class="text-faint text-xs mt-2">后三类默认不计入真实互动</div>
    `;
  },

  _lastInteraction(records) {
    const real = records.filter(r => r.record_type === '真实互动' && r.count_as_real !== false)
      .sort((a,b)=>b.created_at.localeCompare(a.created_at));
    if (real.length === 0) return '<p class="text-faint text-sm">暂无真实互动记录</p>';
    const last = new Date(real[0].created_at);
    const days = Math.floor((Date.now() - last.getTime()) / 86400000);
    return `
      <div class="text-2xl" style="color:var(--color-rose);font-weight:600">${days} 天</div>
      <div class="text-faint text-xs mt-1">${last.toLocaleDateString('zh-CN')}</div>
    `;
  },

  async _renderStatusChart(dailyStatus) {
    const el = document.getElementById('statusChart');
    if (!el || typeof Chart === 'undefined') return;
    const sorted = dailyStatus.sort((a,b)=>a.date.localeCompare(b.date));
    const labels = sorted.map(s => s.date.slice(5));
    const statusMap = { '活跃':3, '平静':2, '偏弱':1 };
    const data = sorted.map(s => statusMap[s.status] || 2);
    const colors = sorted.map(s => s.status==='活跃'?'#7EC8A0':s.status==='偏弱'?'#7090B0':'#BBA4D9');
    const canvas = document.createElement('canvas');
    canvas.style.maxHeight = '200px';
    el.innerHTML = '';
    el.appendChild(canvas);
    new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{
        data, borderColor: '#BBA4D9', tension: 0.4, fill: true,
        backgroundColor: 'rgba(187,164,217,0.1)',
        pointBackgroundColor: colors, pointRadius: 6,
      }]},
      options: {
        plugins: { legend: { display: false },
          tooltip: { callbacks: { label: ctx => sorted[ctx.dataIndex].status } }
        },
        scales: { y: { min: 0, max: 4, ticks: { callback: v => ({3:'活跃',2:'平静',1:'偏弱'})[v]||'' } } },
        maintainAspectRatio: false,
      },
    });

        <textarea class="textarea mt-2" id="rNeed" placeholder="我真正期待或需要的是什么"></textarea>
      </div>
      <div class="card--blur" style="background:rgba(138,78,123,0.06);padding:12px;border-radius:10px;margin:8px 0">
        <div class="text-xs text-faint mb-2">3️⃣ 我的理解（个人联想、象征意义和灵性解读）</div>
        <textarea class="textarea" id="rUnderstanding" placeholder="我的理解和联想"></textarea>
        <div class="text-xs text-faint mt-2">⚠️ 系统不会把"我的理解"表述为已证实的客观事实</div>
      </div>

      <div class="field">
        <label class="field__label">得到的感悟</label>
        <textarea class="textarea" id="rInsight"></textarea>
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label class="field__label">自定义标签</label>
          <input class="input" id="rTags" placeholder="逗号分隔">
        </div>
        <div class="field">
          <label class="field__label">日期时间</label>
          <input class="input" type="datetime-local" id="rTime">
        </div>
      </div>
      <div class="flex gap-3">
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="rImportant"> 设为重要记录</label>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="rCountReal" checked> 计入真实互动统计</label>
      </div>
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="SoulModule._save()">保存</button>
      </div>
    `);
    // 默认时间
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    document.getElementById('rTime').value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
    this._onTypeChange();
  },

  _onTypeChange() {
    const t = document.getElementById('rType')?.value;
    const field = document.getElementById('methodField');
    if (t === '真实互动') {
      field.style.display = '';
    } else {
      field.style.display = 'none';
    }
    // 非真实互动默认不计入
    const cb = document.getElementById('rCountReal');
    if (cb) cb.checked = (t === '真实互动');
  },

  async _save() {
    const profileId = document.getElementById('rProfile').value;
    const type = document.getElementById('rType').value;
    const timeStr = document.getElementById('rTime').value;
    await DB.save('link_records', {
      profile_id: profileId,
      title: document.getElementById('rTitle').value,
      record_type: type,
      method: document.getElementById('rMethod')?.value || '',
      happened: document.getElementById('rHappened').value,
      feeling: document.getElementById('rFeeling').value,
      emotion: document.getElementById('rEmotion').value,
      need: document.getElementById('rNeed').value,
      understanding: document.getElementById('rUnderstanding').value,
      insight: document.getElementById('rInsight').value,
      tags: document.getElementById('rTags').value.split(',').map(s=>s.trim()).filter(Boolean),
      is_important: document.getElementById('rImportant').checked,
      count_as_real: document.getElementById('rCountReal').checked,
      created_at: timeStr ? new Date(timeStr).toISOString() : nowISO(),
    });
    // 如果有明显情绪变化，询问是否同步到情绪记录
    const emotion = document.getElementById('rEmotion').value;
    UI.closeModal();
    if (emotion) {
      setTimeout(() => {
        UI.modal('同步到情绪记录？', `
          <p class="text-soft mb-4">检测到你记录了情绪变化（${emotion}），是否同步到情绪曲线？</p>
          <div class="flex gap-3" style="justify-content:flex-end">
            <button class="btn" onclick="UI.closeModal()">不同步</button>
            <button class="btn btn--primary" onclick="SoulModule._syncEmotion('${emotion}')">同步</button>
          </div>
        `);
      }, 300);
    }
    UI.toast('记录已保存','success');
    this.render();
  },

  async _syncEmotion(emotionStr) {
    UI.closeModal();
    const parts = emotionStr.split(/\s+/);
    const type = parts[0] || '平和';
    const intensity = parseInt(parts[1]) || 5;
    await DB.save('emotions', {
      emotion_type: type,
      intensity,
      event: '来自灵魂链接记录',
      source_type: 'link_sync',
    });
    UI.toast('已同步到情绪记录','success');
  },

  async view(id) {
    const r = await DB.get('link_records', id);
    if (!r) return;
    UI.modal(r.title || r.record_type, `
      <div class="list-item"><div class="list-item__main">
        <div class="list-item__title">${this._typeIcon(r.record_type)} ${r.record_type}</div>
        <div class="list-item__sub">${r.created_at.slice(0,19).replace('T',' ')} ${r.is_important?'· ⭐重要':''}</div>
      </div></div>
      ${r.method ? `<p class="text-soft text-sm mt-2">互动方式: ${r.method}</p>` : ''}
      ${r.happened ? `<div class="card--blur mt-3" style="background:rgba(241,148,166,0.06);padding:12px;border-radius:10px"><div class="text-xs text-faint mb-1">实际发生</div><div>${r.happened}</div></div>` : ''}
      ${r.feeling ? `<div class="card--blur mt-2" style="background:rgba(187,164,217,0.06);padding:12px;border-radius:10px"><div class="text-xs text-faint mb-1">我的感受</div><div>${r.feeling}</div>${r.emotion?`<div class="text-sm mt-1">${r.emotion}</div>`:''}${r.need?`<div class="text-sm mt-1">需要: ${r.need}</div>`:''}</div>` : ''}
      ${r.understanding ? `<div class="card--blur mt-2" style="background:rgba(138,78,123,0.06);padding:12px;border-radius:10px"><div class="text-xs text-faint mb-1">我的理解（个人联想，非客观事实）</div><div>${r.understanding}</div></div>` : ''}
      ${r.insight ? `<p class="mt-3"><b>感悟:</b> ${r.insight}</p>` : ''}
      ${r.tags?.length ? `<div class="mt-2">${r.tags.map(t=>`<span class="tag-chip" style="font-size:11px;padding:2px 8px">${t}</span>`).join(' ')}</div>` : ''}
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn btn--accent btn--sm" onclick="SoulModule._del('${id}')">删除</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  async _del(id) {
    if (!await UI.confirm('删除这条记录？会影响相关统计。')) return;
    await DB.hardDelete('link_records', id);
    UI.closeModal();
    UI.toast('已删除','success');
    this.render();
  },

  async switchProfile() {
    const profiles = (await DB.list('link_profiles')).filter(p => !p.deleted_at);
    UI.modal('选择对象档案', `
      ${profiles.map(p => `
        <div class="list-item" style="cursor:pointer" onclick="SoulModule._setProfile('${p.id}')">
          <span style="font-size:20px">🌙</span>
          <div class="list-item__main">
            <div class="list-item__title">${p.name}</div>
            <div class="list-item__sub">${p.note||''}</div>
          </div>
        </div>
      `).join('')}
      <button class="btn btn--ghost btn--block mt-2" onclick="SoulModule.addProfile()">+ 新建档案</button>
    `);
  },

  async _setProfile(id) {
    await DB.setSetting('current_link_profile', id);
    App.state.settings.current_link_profile = id;
    UI.closeModal();
    this.render();
  },

  async addProfile() {
    UI.closeModal();
    UI.modal('新建对象档案', `
      <div class="field">
        <label class="field__label">名称</label>
        <input class="input" id="pName" placeholder="如：另一个昵称">
      </div>
      <div class="field">
        <label class="field__label">备注</label>
        <input class="input" id="pNote">
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="SoulModule._saveProfile()">创建</button>
      </div>
    `);
  },

  async _saveProfile() {
    const name = document.getElementById('pName').value.trim();
    if (!name) { UI.toast('请输入名称','error'); return; }
    const p = await DB.save('link_profiles', { name, note: document.getElementById('pNote').value });
    await DB.setSetting('current_link_profile', p.id);
    App.state.settings.current_link_profile = p.id;
    UI.closeModal();
    UI.toast('已创建并切换','success');
    this.render();
  },

  // ============ 每日链接状态 ============
  async addDailyStatus() {
    const profiles = (await DB.list('link_profiles')).filter(p => !p.deleted_at);
    const currentProfileId = App.state.settings.current_link_profile || profiles[0]?.id;
    const existing = (await DB.list('link_daily_status')).find(s => s.profile_id === currentProfileId && s.date === todayKey());
    UI.modal('🔮 今日链接状态', `
      <div class="field">
        <label class="field__label">今天你觉得链接状态如何？（手动选择，系统不自动判断）</label>
        <div class="tag-select" id="statusSelect">
          <div class="tag-chip ${existing?.status==='活跃'?'active':''}" onclick="SoulModule._selStatus(this,'活跃')">🌙 活跃</div>
          <div class="tag-chip ${existing?.status==='平静'?'active':''}" onclick="SoulModule._selStatus(this,'平静')">☁️ 平静</div>
          <div class="tag-chip ${existing?.status==='偏弱'?'active':''}" onclick="SoulModule._selStatus(this,'偏弱')">🌫️ 偏弱</div>
        </div>
      </div>
      <div class="field">
        <label class="field__label">为什么认为是这个状态？</label>
        <textarea class="textarea" id="sReason" placeholder="记录观察依据：实际互动次数、是否有同步事件、身体状态等">${existing?.reason||''}</textarea>
      </div>
      <div class="card--blur" style="background:var(--color-bg-alt);padding:14px;border-radius:12px;margin:12px 0">
        <div class="font-bold text-sm mb-2">📋 今日现实状态（多选）</div>
        <div class="field">
          <label class="field__label">睡眠状态</label>
          <div class="tag-select" id="sleepTags">
            ${['睡眠充足','正常','熬夜','睡眠不足'].map(v=>`<div class="tag-chip ${existing?.sleep?.includes(v)?'active':''}" onclick="this.classList.toggle('active')">${v}</div>`).join('')}
          </div>
        </div>
        <div class="field">
          <label class="field__label">身体状态</label>
          <div class="tag-select" id="bodyTags">
            ${['精力充沛','普通','疲惫','生病','生理期','身体不适'].map(v=>`<div class="tag-chip ${existing?.body?.includes(v)?'active':''}" onclick="this.classList.toggle('active')">${v}</div>`).join('')}
          </div>
        </div>
        <div class="field">
          <label class="field__label">情绪状态</label>
          <div class="tag-select" id="emoTags">
            ${['开心','平静','焦虑','压力大','委屈','低落'].map(v=>`<div class="tag-chip ${existing?.emotion_state?.includes(v)?'active':''}" onclick="this.classList.toggle('active')">${v}</div>`).join('')}
          </div>
        </div>
        <div class="field">
          <label class="field__label">现实环境</label>
          <div class="tag-select" id="envTags">
            ${['工作很多','学习压力大','社交较多','独处时间多','天气影响','旅行或环境变化'].map(v=>`<div class="tag-chip ${existing?.environment?.includes(v)?'active':''}" onclick="this.classList.toggle('active')">${v}</div>`).join('')}
          </div>
        </div>
      </div>
      <div class="field">
        <label class="field__label">补充说明</label>
        <textarea class="textarea" id="sExtra">${existing?.extra||''}</textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="SoulModule._saveDailyStatus('${existing?.id||''}','${currentProfileId}')">保存</button>
      </div>
    `);
    this._selStatusVal = existing?.status || null;
  },

  _selStatus(el, s) {
    el.parentElement.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this._selStatusVal = s;
  },

  _collectTags(containerId) {
    return [...document.querySelectorAll(`#${containerId} .tag-chip.active`)].map(el => el.textContent);
  },

  async _saveDailyStatus(id, profileId) {
    if (!this._selStatusVal) { UI.toast('请选择链接状态','error'); return; }
    const data = {
      profile_id: profileId,
      date: todayKey(),
      status: this._selStatusVal,
      reason: document.getElementById('sReason').value,
      sleep: this._collectTags('sleepTags'),
      body: this._collectTags('bodyTags'),
      emotion_state: this._collectTags('emoTags'),
      environment: this._collectTags('envTags'),
      extra: document.getElementById('sExtra').value,
    };
    if (id) data.id = id;
    await DB.save('link_daily_status', data);

    // 联动：如果偏弱且情绪低落，询问是否同步情绪
    if (this._selStatusVal === '偏弱' && data.emotion_state.includes('低落')) {
      UI.closeModal();
      setTimeout(() => {
        UI.modal('同步到情绪记录？', `
          <p class="text-soft mb-4">今天链接状态偏弱，且情绪低落，是否同步到情绪曲线？</p>
          <div class="flex gap-3" style="justify-content:flex-end">
            <button class="btn" onclick="UI.closeModal()">不同步</button>
            <button class="btn btn--primary" onclick="SoulModule._syncLowEmotion()">同步</button>
          </div>
        `);
      }, 300);
    } else {
      UI.closeModal();
    }
    UI.toast('链接状态已记录','success');
    this.render();
  },

  async _syncLowEmotion() {
    UI.closeModal();
    await DB.save('emotions', {
      emotion_type: '低落',
      intensity: 5,
      event: '链接状态偏弱',
      source_type: 'link_status_sync',
    });
    UI.toast('已同步到情绪记录','success');
  },

  async showFilter() {
    const types = ['真实互动','同步性或显化记录','感想与成长','梦境与直觉','重要纪念'];
    UI.modal('筛选记录', `
      <div class="field">
        <label class="field__label">记录类型</label>
        <select class="select" id="fType"><option value="">全部</option>${types.map(t=>`<option>${t}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label class="field__label">开始日期</label>
        <input class="input" type="date" id="fStart">
      </div>
      <div class="field">
        <label class="field__label">结束日期</label>
        <input class="input" type="date" id="fEnd">
      </div>
      <div class="field">
        <label class="field__label">关键词</label>
        <input class="input" id="fKeyword">
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="SoulModule._applyFilter()">筛选</button>
      </div>
    `);
  },

  async _applyFilter() {
    const type = document.getElementById('fType').value;
    const start = document.getElementById('fStart').value;
    const end = document.getElementById('fEnd').value;
    const kw = document.getElementById('fKeyword').value.trim().toLowerCase();
    UI.closeModal();
    const profiles = (await DB.list('link_profiles')).filter(p => !p.deleted_at);
    const currentProfileId = App.state.settings.current_link_profile || profiles[0]?.id;
    let all = (await DB.list('link_records')).filter(r => !r.deleted_at && r.profile_id === currentProfileId);
    if (type) all = all.filter(r => r.record_type === type);
    if (start) all = all.filter(r => r.created_at >= start);
    if (end) all = all.filter(r => r.created_at <= end + 'T23:59:59');
    if (kw) all = all.filter(r => (r.title||'').toLowerCase().includes(kw) || (r.happened||'').toLowerCase().includes(kw) || (r.feeling||'').toLowerCase().includes(kw));
    UI.modal(`筛选结果（${all.length} 条）`, all.length === 0 ? '<p class="text-faint text-sm">无匹配记录</p>' : `
      <div class="flex flex-col gap-2">
        ${all.sort((a,b)=>b.created_at.localeCompare(a.created_at)).map(r => `
          <div class="list-item" style="cursor:pointer" onclick="UI.closeModal();SoulModule.view('${r.id}')">
            <span style="font-size:20px">${this._typeIcon(r.record_type)}</span>
            <div class="list-item__main">
              <div class="list-item__title">${r.title||r.record_type}</div>
              <div class="list-item__sub">${r.created_at.slice(0,16).replace('T',' ')}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `);
  },

  async monthlyReview() {
    const profiles = (await DB.list('link_profiles')).filter(p => !p.deleted_at);
    const currentProfileId = App.state.settings.current_link_profile || profiles[0]?.id;
    const records = (await DB.list('link_records')).filter(r => !r.deleted_at && r.profile_id === currentProfileId);
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthRecs = records.filter(r => new Date(r.created_at) >= monthStart);
    const real = monthRecs.filter(r => r.record_type === '真实互动' && r.count_as_real !== false);
    const otherActive = monthRecs.filter(r => r.record_type === '真实互动' && r.method === '对方主动联系');
    const myActive = monthRecs.filter(r => r.record_type === '真实互动' && r.method === '我主动联系');
    const methodCount = {};
    real.forEach(r => { methodCount[r.method] = (methodCount[r.method]||0)+1; });
    UI.modal(`${now.getMonth()+1}月链接回顾`, `
      <div class="text-soft text-sm mb-3">基于 ${monthRecs.length} 条记录生成（可编辑）</div>
      <div class="card--blur" style="background:var(--color-bg-alt);padding:14px;border-radius:12px">
        <p class="text-sm"><b>本月真实互动情况：</b>${real.length} 次</p>
        <p class="text-sm mt-2"><b>主要互动方式：</b>${Object.entries(methodCount).map(([m,c])=>`${m}(${c})`).join('、')||'-'}</p>
        <p class="text-sm mt-2"><b>对方主动：</b>${otherActive.length} 次 · <b>我主动：</b>${myActive.length} 次</p>
      </div>
      <div class="ai-block mt-3">
        📝 以上为客观统计。你可以在下方补充你的感受和成长。
      </div>
      <div class="field mt-3">
        <label class="field__label">带来安全感或快乐的事情</label>
        <textarea class="textarea" id="mrJoy"></textarea>
      </div>
      <div class="field">
        <label class="field__label">引发不安、委屈或失落的情境</label>
        <textarea class="textarea" id="mrSad"></textarea>
      </div>
      <div class="field">
        <label class="field__label">反复出现的期待和主题</label>
        <textarea class="textarea" id="mrTheme"></textarea>
      </div>
      <div class="field">
        <label class="field__label">对自身需求和边界的新认识</label>
        <textarea class="textarea" id="mrBoundary"></textarea>
      </div>
      <div class="field">
        <label class="field__label">本月获得的成长</label>
        <textarea class="textarea" id="mrGrowth"></textarea>
      </div>
      <div class="field">
        <label class="field__label">下个月值得继续观察的问题</label>
        <textarea class="textarea" id="mrQuestion"></textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="SoulModule._saveReview()">保存回顾</button>
      </div>
    `);
  },

  async _saveReview() {
    const now = new Date();
    await DB.save('reviews', {
      type: 'link_monthly',
      date: todayKey(),
      month: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`,
      content: {
        joy: document.getElementById('mrJoy').value,
        sad: document.getElementById('mrSad').value,
        theme: document.getElementById('mrTheme').value,
        boundary: document.getElementById('mrBoundary').value,
        growth: document.getElementById('mrGrowth').value,
        question: document.getElementById('mrQuestion').value,
      },
    });
    UI.closeModal();
    UI.toast('月度回顾已保存','success');
  },
};

/**
 * 链接星图模块
 * 愿望记录 → 现实观察 → 情绪体验 → 后续复盘
 */
const StarMapModule = {
  async render() {
    const profiles = (await DB.list('link_profiles')).filter(p => !p.deleted_at);
    const currentProfileId = App.state.settings.current_link_profile || profiles[0]?.id;
    const wishes = (await DB.list('link_wishes')).filter(w => !w.deleted_at && w.profile_id === currentProfileId);
    const treasures = (await DB.list('link_treasures')).filter(t => !t.deleted_at && t.profile_id === currentProfileId);

    const html = `
      <div class="page">
        <div class="flex justify-between items-center mb-4">
          <div class="page__title" style="margin:0">🌟 链接星图</div>
          <button class="btn btn--primary btn--sm" onclick="StarMapModule.addWish()">+ 新增一颗星星</button>
        </div>

        <div class="ai-disclaimer mb-4">
          链接星图不是预测未来，也不是判断愿望一定会实现。<br>
          它帮助你保存曾经对链接产生过的愿望，并观察哪些最终在现实中出现。
        </div>

        <!-- 私人星空 -->
        <div class="starfield mb-4" id="starfield">
          ${wishes.length === 0
            ? '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#BBA4D9"><div style="font-size:40px">✨</div><p>点击右上角，许下你的第一颗星星</p></div>'
            : wishes.map(w => this._renderStar(w)).join('')}
        </div>

        <!-- 统计 -->
        <div class="grid grid-3 mb-4">
          <div class="card text-center">
            <div class="text-2xl" style="color:var(--color-wisteria);font-weight:600">${wishes.filter(w=>w.status==='等待中'||w.status==='等待观察').length}</div>
            <div class="text-faint text-xs">等待中</div>
          </div>
          <div class="card text-center">
            <div class="text-2xl" style="color:var(--color-rose);font-weight:600">${wishes.filter(w=>w.status==='已实现'||w.status==='出现部分对应事件').length}</div>
            <div class="text-faint text-xs">已实现/部分</div>
          </div>
          <div class="card text-center">
            <div class="text-2xl" style="color:var(--color-accent);font-weight:600">${treasures.length}</div>
            <div class="text-faint text-xs">宝物袋</div>
          </div>
        </div>

        <!-- 星星日记 -->
        <div class="card mb-4">
          <div class="card-title">📔 星星日记</div>
          <p class="text-faint text-sm mb-2">今天有没有什么事情让我想到某颗星星？（轻量，可选）</p>
          <button class="btn btn--sm btn--ghost" onclick="StarMapModule.addStarDiary()">写一句</button>
        </div>

        <!-- 宝物袋 -->
        <div class="card">
          <div class="card-title">🪄 宝物袋</div>
          ${treasures.length === 0 ? '<p class="text-faint text-sm">还没有已摘下的星星。实现的愿望会收藏在这里。</p>' : `
            <div class="flex flex-col gap-2">
              ${treasures.map(t => `
                <div class="list-item" style="cursor:pointer" onclick="StarMapModule.viewTreasure('${t.id}')">
                  <span style="font-size:20px">✨</span>
                  <div class="list-item__main">
                    <div class="list-item__title">${t.wish_title}</div>
                    <div class="list-item__sub">实现于 ${t.achieved_date||'-'}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
  },

  _renderStar(w) {
    // 随机位置但固定（基于 id hash）
    const seed = w.id.split('').reduce((s,c)=>s+c.charCodeAt(0),0);
    const x = (seed % 80) + 8;
    const y = ((seed * 7) % 75) + 10;
    const cls = w.status === '已实现' ? 'star-node--achieved' : (w.status === '出现部分对应事件' ? 'star-node--partial' : '');
    const size = w.importance >= 4 ? 28 : (w.importance >= 2 ? 22 : 18);
    return `
      <div class="star-node ${cls}" style="left:${x}%;top:${y}%" onclick="StarMapModule.viewWish('${w.id}')">
        <div class="star-node__glow" style="width:${size}px;height:${size}px"></div>
      </div>
    `;
  },

  async addWish() {
    const profiles = (await DB.list('link_profiles')).filter(p => !p.deleted_at);
    const currentProfileId = App.state.settings.current_link_profile || profiles[0]?.id;
    const categories = ['🌙 日常小显化','💌 互动愿望','🌱 关系成长愿望','✨ 内在成长愿望'];
    const statuses = ['⭐ 等待中','⭐ 等待观察','🌱 出现部分对应事件','✨ 已实现','🍃 暂未发生','🪐 不再期待'];
    UI.modal('新增一颗星星 ✨', `
      <div class="field">
        <label class="field__label">愿望标题</label>
        <input class="input" id="wTitle" placeholder="例如：希望收到一条特别的消息">
      </div>
      <div class="field">
        <label class="field__label">愿望详细描述</label>
        <textarea class="textarea" id="wDesc" placeholder="我为什么想体验 / 对我的意义 / 期待的感觉 / 脑海中的画面"></textarea>
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label class="field__label">分类</label>
          <select class="select" id="wCat">${categories.map(c=>`<option>${c}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label class="field__label">重要程度（1-5）</label>
          <input class="input" type="number" min="1" max="5" value="3" id="wImportance">
        </div>
      </div>
      <div class="field">
        <label class="field__label">状态</label>
        <select class="select" id="wStatus">${statuses.map(s=>`<option ${s.includes('等待中')?'selected':''}>${s}</option>`).join('')}</select>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="StarMapModule._saveWish('${currentProfileId}')">许下星星</button>
      </div>
    `);
  },

  async _saveWish(profileId) {
    const title = document.getElementById('wTitle').value.trim();
    if (!title) { UI.toast('请填写愿望标题','error'); return; }
    await DB.save('link_wishes', {
      profile_id: profileId,
      title,
      description: document.getElementById('wDesc').value,
      category: document.getElementById('wCat').value,
      importance: parseInt(document.getElementById('wImportance').value) || 3,
      status: document.getElementById('wStatus').value,
    });
    UI.closeModal();
    UI.toast('星星已许下 ✨','success');
    this.render();
  },

  async viewWish(id) {
    const w = await DB.get('link_wishes', id);
    if (!w) return;
    const events = (await DB.list('link_wish_events')).filter(e => !e.deleted_at && e.wish_id === id);
    UI.modal(`✨ ${w.title}`, `
      <div class="text-soft text-sm mb-2">${w.category} · ${w.status}</div>
      ${w.description ? `<p class="mb-3">${w.description}</p>` : ''}
      <div class="text-faint text-xs">创建于 ${w.created_at.slice(0,10)} · 重要度 ${'⭐'.repeat(w.importance)}</div>

      <div class="card-header mt-4">
        <div class="card-title">📋 后续事件</div>
        <button class="btn btn--sm btn--ghost" onclick="StarMapModule._closeAndAddEvent('${id}')">+ 添加</button>
      </div>
      ${events.length === 0 ? '<p class="text-faint text-sm">暂无后续事件记录</p>' : events.map(e => `
        <div class="list-item" style="cursor:pointer" onclick="StarMapModule.viewEvent('${e.id}','${id}')">
          <div class="list-item__main">
            <div class="list-item__title">${e.what_happened?.slice(0,40)||'事件'}</div>
            <div class="list-item__sub">${e.date||'-'}</div>
          </div>
        </div>
      `).join('')}

      <div class="field mt-4">
        <label class="field__label">修改状态</label>
        <select class="select" id="wNewStatus" onchange="StarMapModule._updateStatus('${id}')">
          ${['⭐ 等待中','⭐ 等待观察','🌱 出现部分对应事件','✨ 已实现','🍃 暂未发生','🪐 不再期待'].map(s=>`<option ${s===w.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>

      <div class="flex gap-3 mt-2" style="justify-content:flex-end">
        ${w.status === '已实现' ? `<button class="btn btn--rose btn--sm" onclick="StarMapModule._pickStar('${id}')">⭐ 摘下这颗星</button>` : ''}
        <button class="btn btn--accent btn--sm" onclick="StarMapModule._delWish('${id}')">删除</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  _closeAndAddEvent(wishId) {
    UI.closeModal();
    setTimeout(() => this.addEvent(wishId), 200);
  },

  async addEvent(wishId) {
    UI.modal('添加后续事件', `
      <div class="field">
        <label class="field__label">日期</label>
        <input class="input" type="date" id="eDate" value="${todayKey()}">
      </div>
      <div class="card--blur" style="background:rgba(241,148,166,0.06);padding:12px;border-radius:10px;margin:8px 0">
        <div class="text-xs text-faint mb-1">实际发生了什么</div>
        <textarea class="textarea" id="eHappened"></textarea>
      </div>
      <div class="card--blur" style="background:rgba(187,164,217,0.06);padding:12px;border-radius:10px;margin:8px 0">
        <div class="text-xs text-faint mb-1">我的感受</div>
        <textarea class="textarea" id="eFeeling"></textarea>
      </div>
      <div class="card--blur" style="background:rgba(138,78,123,0.06);padding:12px;border-radius:10px;margin:8px 0">
        <div class="text-xs text-faint mb-1">我的理解（是否与愿望有关）</div>
        <textarea class="textarea" id="eRelated" placeholder="我个人的理解，不自动判定为愿望实现"></textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="StarMapModule._saveEvent('${wishId}')">保存</button>
      </div>
    `);
  },

  async _saveEvent(wishId) {
    await DB.save('link_wish_events', {
      wish_id: wishId,
      date: document.getElementById('eDate').value,
      what_happened: document.getElementById('eHappened').value,
      feeling: document.getElementById('eFeeling').value,
      related: document.getElementById('eRelated').value,
    });
    UI.closeModal();
    UI.toast('事件已记录','success');
    this.viewWish(wishId);
  },

  async viewEvent(id, wishId) {
    const e = await DB.get('link_wish_events', id);
    if (!e) return;
    UI.modal('后续事件详情', `
      <p class="text-soft text-sm mb-2">${e.date}</p>
      <div class="card--blur" style="background:rgba(241,148,166,0.06);padding:12px;border-radius:10px;margin-bottom:8px"><div class="text-xs text-faint">实际发生</div><div>${e.what_happened}</div></div>
      <div class="card--blur" style="background:rgba(187,164,217,0.06);padding:12px;border-radius:10px;margin-bottom:8px"><div class="text-xs text-faint">我的感受</div><div>${e.feeling}</div></div>
      <div class="card--blur" style="background:rgba(138,78,123,0.06);padding:12px;border-radius:10px"><div class="text-xs text-faint">我的理解</div><div>${e.related}</div></div>
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn btn--accent btn--sm" onclick="StarMapModule._delEvent('${id}','${wishId}')">删除</button>
        <button class="btn btn--sm" onclick="UI.closeModal();StarMapModule.viewWish('${wishId}')">返回</button>
      </div>
    `);
  },

  async _delEvent(id, wishId) {
    if (!await UI.confirm('删除这条事件记录？')) return;
    await DB.hardDelete('link_wish_events', id);
    UI.closeModal();
    this.viewWish(wishId);
  },

  async _updateStatus(id) {
    const w = await DB.get('link_wishes', id);
    if (w) {
      w.status = document.getElementById('wNewStatus').value;
      await DB.save('link_wishes', w);
      UI.toast('状态已更新','success');
    }
  },

  async _pickStar(id) {
    const w = await DB.get('link_wishes', id);
    if (!w) return;
    if (!await UI.confirm('摘下这颗星？它将从天空消失，进入宝物袋。')) return;
    const profiles = (await DB.list('link_profiles')).filter(p => !p.deleted_at);
    await DB.save('link_treasures', {
      profile_id: w.profile_id,
      wish_id: id,
      wish_title: w.title,
      wish_description: w.description,
      created_date: w.created_at.slice(0,10),
      achieved_date: todayKey(),
    });
    // 从星图移除（软删除）
    w.status = '已实现';
    w.picked = true;
    await DB.save('link_wishes', w);
    UI.closeModal();
    UI.toast('星星已摘下，收入宝物袋 ✨','success');
    this.render();
  },

  async viewTreasure(id) {
    const t = await DB.get('link_treasures', id);
    if (!t) return;
    const events = (await DB.list('link_wish_events')).filter(e => !e.deleted_at && e.wish_id === t.wish_id);
    UI.modal(`✨ ${t.wish_title}`, `
      <p class="text-soft text-sm">许愿于 ${t.created_date} · 实现于 ${t.achieved_date}</p>
      ${t.wish_description ? `<p class="mt-2">${t.wish_description}</p>` : ''}
      <div class="card-header mt-4"><div class="card-title">相关记录</div></div>
      ${events.length === 0 ? '<p class="text-faint text-sm">无后续事件</p>' : events.map(e => `
        <div class="list-item"><div class="list-item__main">
          <div class="list-item__title">${e.what_happened?.slice(0,40)}</div>
          <div class="list-item__sub">${e.date} · ${e.feeling?.slice(0,30)||''}</div>
        </div></div>
      `).join('')}
      <div class="field mt-3">
        <label class="field__label">我的感悟</label>
        <textarea class="textarea" id="tInsight" placeholder="现在回头看有什么变化">${t.insight||''}</textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn btn--primary btn--sm" onclick="StarMapModule._saveInsight('${id}')">保存感悟</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  async _saveInsight(id) {
    const t = await DB.get('link_treasures', id);
    if (t) { t.insight = document.getElementById('tInsight').value; await DB.save('link_treasures', t); }
    UI.closeModal();
    UI.toast('感悟已保存','success');
  },

  async addStarDiary() {
    UI.modal('📔 星星日记', `
      <div class="field">
        <label class="field__label">今天有没有什么事情让我想到某颗星星？</label>
        <textarea class="textarea" id="dContent" placeholder="轻量记录，可选"></textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="StarMapModule._saveDiary()">保存</button>
      </div>
    `);
  },

  async _saveDiary() {
    await DB.save('reviews', {
      type: 'star_diary',
      date: todayKey(),
      content: document.getElementById('dContent').value,
    });
    UI.closeModal();
    UI.toast('日记已保存','success');
  },

  async _delWish(id) {
    if (!await UI.confirm('删除这颗星星及其所有后续事件？')) return;
    await DB.hardDelete('link_wishes', id);
    const events = (await DB.list('link_wish_events')).filter(e => e.wish_id === id);
    for (const e of events) await DB.hardDelete('link_wish_events', e.id);
    UI.closeModal();
    UI.toast('已删除','success');
    this.render();
  },
};


// === js/modules/cards.js ===
/**
 * 字卡传讯与自我探索系统
 * 象征性工具，不代表现实人物信息
 */
const CardsModule = {
  async render() {
    if (!App.state.settings.enable_cards) {
      document.getElementById('pageContent').innerHTML = `<div class="page"><div class="card">${UI.empty('💌','字卡功能未开启，可在设置中开启')}</div></div>`;
      return;
    }
    const decks = (await DB.list('card_decks')).filter(d => !d.deleted_at);
    const draws = (await DB.list('card_draws')).filter(d => !d.deleted_at);
    const html = `
      <div class="page">
        <div class="flex justify-between items-center mb-4">
          <div class="page__title" style="margin:0">💌 字卡传讯</div>
          <div class="flex gap-2">
            <button class="btn btn--sm" onclick="CardsModule.manageDecks()">卡组管理</button>
            <button class="btn btn--primary btn--sm" onclick="CardsModule.draw()">抽取字卡</button>
          </div>
        </div>

        <div class="ai-disclaimer mb-4">
          字卡传讯用于仪式感记录、创意书写、情绪投射和自我探索。<br>
          抽取结果 <b>不代表对方真实发送的信息</b>，不承诺事件发生。
        </div>

        <!-- 卡组列表 -->
        <div class="card mb-4">
          <div class="card-title">📚 我的卡组</div>
          ${decks.length === 0 ? `
            <p class="text-faint text-sm mb-3">还没有卡组，系统已为你预设一个</p>
            <button class="btn btn--sm" onclick="CardsModule._initDefault()">初始化预设卡组</button>
          ` : `
            <div class="flex flex-col gap-2">
              ${decks.map(d => {
                const items = (window._cardItems || []).filter(i => i.deck_id === d.id);
                return `
                  <div class="list-item" style="cursor:pointer" onclick="CardsModule.viewDeck('${d.id}')">
                    <span style="font-size:20px">🎴</span>
                    <div class="list-item__main">
                      <div class="list-item__title">${d.name}</div>
                      <div class="list-item__sub">${d.description||''}</div>
                    </div>
                    <span class="badge">${items.length}</span>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>

        <!-- 抽卡统计 -->
        ${draws.length > 0 ? `
          <div class="card mb-4">
            <div class="card-title">📊 字卡统计</div>
            ${this._stats(draws)}
          </div>
        ` : ''}

        <!-- 最近抽卡 -->
        <div class="card">
          <div class="card-title">🌟 最近抽卡</div>
          ${draws.length === 0 ? UI.empty('💌','还没有抽卡记录') : `
            <div class="flex flex-col gap-2">
              ${draws.sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,10).map(d => `
                <div class="list-item" style="cursor:pointer" onclick="CardsModule.viewDraw('${d.id}')">
                  <span style="font-size:20px">💌</span>
                  <div class="list-item__main">
                    <div class="list-item__title">${d.cards?.map(c=>c.word).join(' · ')||'-'}</div>
                    <div class="list-item__sub">${d.created_at.slice(0,16).replace('T',' ')}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      </div>
    `;
    // 加载所有卡项
    window._cardItems = (await DB.list('card_items')).filter(i => !i.deleted_at);
    document.getElementById('pageContent').innerHTML = html;
  },

  _stats(draws) {
    const now = new Date();
    const weekStart = new Date(now); weekStart.setDate(now.getDate()-7);
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const yearStart = new Date(now.getFullYear(), 0, 1);
    const weekDraws = draws.filter(d => new Date(d.created_at) >= weekStart);
    const monthDraws = draws.filter(d => new Date(d.created_at) >= monthStart);
    const yearDraws = draws.filter(d => new Date(d.created_at) >= yearStart);
    // 高频字卡
    const cardCount = {};
    draws.forEach(d => {
      (d.cards||[]).forEach(c => { cardCount[c.word] = (cardCount[c.word]||0)+1; });
    });
    const top = Object.entries(cardCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
    return `
      <div class="grid grid-3 mb-3">
        <div class="health-item"><div class="health-item__label">本周</div><div class="health-item__value">${weekDraws.length}</div></div>
        <div class="health-item"><div class="health-item__label">本月</div><div class="health-item__value">${monthDraws.length}</div></div>
        <div class="health-item"><div class="health-item__label">本年</div><div class="health-item__value">${yearDraws.length}</div></div>
      </div>
      ${top.length > 0 ? `
        <div class="text-faint text-xs">高频字卡:</div>
        <ul class="text-sm">${top.map(([w,c]) => `<li>${w}: ${c} 次</li>`).join('')}</ul>
        <div class="ai-disclaimer">统计结果只描述记录规律，不把抽卡频率解释成外部信号</div>
      ` : ''}
    `;
  },

  async _initDefault() {
    const defaultDeck = await DB.save('card_decks', {
      name: '今日链接讯息',
      description: '用于每日自我探索的通用字卡',
      allow_repeat: false,
    });
    const words = ['温柔','勇气','等待','倾听','放下','拥抱','信任','流动','安静','绽放','回归','守护','呼吸','自由','光亮','耐心'];
    for (const w of words) {
      await DB.save('card_items', {
        deck_id: defaultDeck.id,
        word: w,
        interpretation: `这张卡可能让你联想到关于「${w}」的内在需要。这是一个可供探索的角度。`,
      });
    }
    UI.toast('预设卡组已创建','success');
    this.render();
  },

  async draw() {
    const decks = (await DB.list('card_decks')).filter(d => !d.deleted_at);
    if (decks.length === 0) { UI.toast('请先创建卡组','error'); return; }
    const profiles = (await DB.list('link_profiles')).filter(p => !p.deleted_at);
    UI.modal('抽取字卡 💌', `
      <div class="field">
        <label class="field__label">选择卡组</label>
        <select class="select" id="dDeck">${decks.map(d=>`<option value="${d.id}">${d.name}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label class="field__label">抽卡数量</label>
        <select class="select" id="dCount">
          <option value="1">单张</option>
          <option value="3">三张</option>
          <option value="5">五张</option>
        </select>
      </div>
      <div class="field">
        <label class="field__label">当前问题（可选）</label>
        <input class="input" id="dQuestion" placeholder="想探索的问题">
      </div>
      <div class="field">
        <label class="field__label">当前情绪（可选）</label>
        <input class="input" id="dEmotion">
      </div>
      <div class="field">
        <label class="field__label">选择对象档案（可选）</label>
        <select class="select" id="dProfile">
          <option value="">不关联</option>
          ${profiles.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
        </select>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="CardsModule._doDraw()">抽取 ✨</button>
      </div>
    `);
  },

  async _doDraw() {
    const deckId = document.getElementById('dDeck').value;
    const count = parseInt(document.getElementById('dCount').value);
    const question = document.getElementById('dQuestion').value;
    const emotion = document.getElementById('dEmotion').value;
    const profileId = document.getElementById('dProfile').value;
    const items = (await DB.list('card_items')).filter(i => !i.deleted_at && i.deck_id === deckId);
    if (items.length === 0) { UI.toast('该卡组没有字卡','error'); return; }
    // 随机抽取
    const shuffled = [...items].sort(() => Math.random() - 0.5);
    const drawn = shuffled.slice(0, Math.min(count, items.length));
    const record = await DB.save('card_draws', {
      deck_id: deckId,
      cards: drawn.map(c => ({ word: c.word, interpretation: c.interpretation })),
      question, emotion, profile_id: profileId || null,
    });
    UI.closeModal();
    this._showDrawResult(record, drawn);
  },

  _showDrawResult(record, drawn) {
    UI.modal('抽卡结果 ✨', `
      <div class="text-center" style="padding:20px 0">
        ${drawn.map((c,i) => `
          <div style="display:inline-block;margin:8px;padding:20px;background:linear-gradient(135deg,var(--color-rose-soft),var(--color-wisteria));border-radius:16px;min-width:120px;box-shadow:var(--shadow-md)">
            <div style="font-size:28px">💌</div>
            <div style="font-size:22px;color:var(--color-primary);font-weight:600;margin-top:8px">${c.word}</div>
            <div class="text-xs text-soft mt-2" style="max-width:160px">${c.interpretation||''}</div>
          </div>
        `).join('')}
      </div>
      <div class="ai-block">
        ${drawn.length > 1
          ? `这些字卡放在一起，可能形成一个主题供你探索。`
          : `这张卡可能让你联想到……`}
        你可以借此观察自己现在的期待与需要。这是一个可供探索的角度，不代表现实结论。
        <div class="ai-disclaimer">AI 生成的象征性/创意文本，仅供自我探索与娱乐，不代表任何现实人物的真实想法、承诺或信息</div>
      </div>
      <div class="field mt-3">
        <label class="field__label">我的第一感受</label>
        <textarea class="textarea" id="rFirstFeel"></textarea>
      </div>
      <div class="field">
        <label class="field__label">我联想到的事情</label>
        <textarea class="textarea" id="rAssociate"></textarea>
      </div>
      <div class="field">
        <label class="field__label">这张卡对我的个人意义</label>
        <textarea class="textarea" id="rMeaning"></textarea>
      </div>
      <div class="field">
        <label class="field__label">可以采取的现实行动</label>
        <textarea class="textarea" id="rAction"></textarea>
      </div>
      <div class="flex flex-wrap gap-3">
        <label class="text-sm"><input type="checkbox" id="rFav"> 收藏</label>
        <label class="text-sm"><input type="checkbox" id="rTimeline"> 加入灵魂链接时间线</label>
        <label class="text-sm"><input type="checkbox" id="rSyncEmo"> 同步到情绪记录</label>
      </div>
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">不保存</button>
        <button class="btn btn--primary" onclick="CardsModule._saveDrawResult('${record.id}')">保存记录</button>
      </div>
    `);
  },

  async _saveDrawResult(id) {
    const d = await DB.get('card_draws', id);
    if (d) {
      d.first_feeling = document.getElementById('rFirstFeel').value;
      d.association = document.getElementById('rAssociate').value;
      d.meaning = document.getElementById('rMeaning').value;
      d.action = document.getElementById('rAction').value;
      d.favorited = document.getElementById('rFav').checked;
      d.add_to_timeline = document.getElementById('rTimeline').checked;
      d.sync_emotion = document.getElementById('rSyncEmo').checked;
      await DB.save('card_draws', d);
      // 同步到灵魂链接时间线
      if (d.add_to_timeline && d.profile_id) {
        await DB.save('link_records', {
          profile_id: d.profile_id,
          title: `字卡抽取: ${d.cards.map(c=>c.word).join('·')}`,
          record_type: '感想与成长',
          happened: '字卡记录（标记）',
          feeling: d.first_feeling,
          understanding: d.meaning,
          tags: ['字卡记录'],
          count_as_real: false,  // 字卡不计入真实互动
          source_type: 'card_draw',
        });
      }
      if (d.sync_emotion && d.first_feeling) {
        await DB.save('emotions', {
          emotion_type: '平和',
          intensity: 5,
          event: `字卡抽取后的感受: ${d.first_feeling.slice(0,50)}`,
          source_type: 'card_sync',
        });
      }
    }
    UI.closeModal();
    UI.toast('抽卡记录已保存','success');
    this.render();
  },

  quickDraw() { this.draw(); },

  async viewDraw(id) {
    const d = await DB.get('card_draws', id);
    if (!d) return;
    UI.modal('抽卡记录', `
      <div class="text-center mb-3">
        ${d.cards.map(c => `<div style="display:inline-block;margin:4px;padding:12px 16px;background:var(--color-rose-soft);border-radius:12px;color:var(--color-primary);font-weight:600">${c.word}</div>`).join('')}
      </div>
      ${d.question ? `<p class="text-soft text-sm">问题: ${d.question}</p>` : ''}
      ${d.emotion ? `<p class="text-soft text-sm">当时情绪: ${d.emotion}</p>` : ''}
      ${d.first_feeling ? `<div class="mt-2"><b>第一感受:</b> ${d.first_feeling}</div>` : ''}
      ${d.association ? `<div class="mt-1"><b>联想:</b> ${d.association}</div>` : ''}
      ${d.meaning ? `<div class="mt-1"><b>个人意义:</b> ${d.meaning}</div>` : ''}
      ${d.action ? `<div class="mt-1"><b>现实行动:</b> ${d.action}</div>` : ''}
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn btn--accent btn--sm" onclick="CardsModule._delDraw('${id}')">删除</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  async _delDraw(id) {
    if (!await UI.confirm('删除这条抽卡记录？')) return;
    await DB.hardDelete('card_draws', id);
    UI.closeModal();
    UI.toast('已删除','success');
    this.render();
  },

  async manageDecks() {
    const decks = (await DB.list('card_decks')).filter(d => !d.deleted_at);
    UI.modal('卡组管理', `
      ${decks.map(d => `
        <div class="list-item" onclick="CardsModule.viewDeck('${d.id}')">
          <span style="font-size:20px">🎴</span>
          <div class="list-item__main">
            <div class="list-item__title">${d.name}</div>
            <div class="list-item__sub">${d.description||''}</div>
          </div>
        </div>
      `).join('')}
      <button class="btn btn--ghost btn--block mt-2" onclick="CardsModule.addDeck()">+ 新建卡组</button>
    `);
  },

  async addDeck() {
    UI.closeModal();
    UI.modal('新建卡组', `
      <div class="field">
        <label class="field__label">卡组名称</label>
        <input class="input" id="deckName" placeholder="如：情绪觉察">
      </div>
      <div class="field">
        <label class="field__label">描述</label>
        <input class="input" id="deckDesc">
      </div>
      <div class="field">
        <label class="field__label">字卡（每行一个词）</label>
        <textarea class="textarea" id="deckWords" placeholder="温柔&#10;勇气&#10;等待"></textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="CardsModule._saveDeck()">创建</button>
      </div>
    `);
  },

  async _saveDeck() {
    const name = document.getElementById('deckName').value.trim();
    if (!name) { UI.toast('请输入名称','error'); return; }
    const deck = await DB.save('card_decks', {
      name,
      description: document.getElementById('deckDesc').value,
      allow_repeat: false,
    });
    const words = document.getElementById('deckWords').value.split('\n').map(s=>s.trim()).filter(Boolean);
    for (const w of words) {
      await DB.save('card_items', { deck_id: deck.id, word: w, interpretation: '' });
    }
    UI.closeModal();
    UI.toast('卡组已创建','success');
    this.render();
  },

  async viewDeck(id) {
    const deck = await DB.get('card_decks', id);
    const items = (await DB.list('card_items')).filter(i => !i.deleted_at && i.deck_id === id);
    UI.modal(`${deck.name}`, `
      <p class="text-soft text-sm mb-3">${deck.description||''}</p>
      <div class="flex flex-wrap gap-2 mb-3">
        ${items.map(i => `<span class="tag-chip" style="padding:8px 14px">${i.word}</span>`).join('')}
      </div>
      <button class="btn btn--primary btn--sm" onclick="UI.closeModal();CardsModule.draw()">用此卡组抽卡</button>
    `);
  },
};
