/**
 * 链接星图模块
 * 愿望记录 → 现实观察 → 情绪体验 → 后续复盘
 */
const StarMapModule = {
  async render() {
    const profiles = (await DB.list('link_profiles')).filter(p => !p.deleted_at);
    const currentProfileId = App.state.settings.current_link_profile || profiles[0]?.id;
    const wishes = (await DB.list('link_wishes')).filter(w => !w.deleted_at && w.profile_id === currentProfileId);
    const treasures = (await DB.list('link_treasures')).filter(t => !t.deleted_at && t.profile_id === currentProfileId);

    const html = `
      <div class="page">
        <div class="flex justify-between items-center mb-4">
          <div class="page__title" style="margin:0">🌟 链接星图</div>
          <button class="btn btn--primary btn--sm" onclick="StarMapModule.addWish()">+ 新增一颗星星</button>
        </div>

        <div class="ai-disclaimer mb-4">
          链接星图不是预测未来，也不是判断愿望一定会实现。<br>
          它帮助你保存曾经对链接产生过的愿望，并观察哪些最终在现实中出现。
        </div>

        <!-- 私人星空 -->
        <div class="starfield mb-4" id="starfield">
          ${wishes.length === 0
            ? '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#BBA4D9"><div style="font-size:40px">✨</div><p>点击右上角，许下你的第一颗星星</p></div>'
            : wishes.map(w => this._renderStar(w)).join('')}
        </div>

        <!-- 统计 -->
        <div class="grid grid-3 mb-4">
          <div class="card text-center">
            <div class="text-2xl" style="color:var(--color-wisteria);font-weight:600">${wishes.filter(w=>w.status==='等待中'||w.status==='等待观察').length}</div>
            <div class="text-faint text-xs">等待中</div>
          </div>
          <div class="card text-center">
            <div class="text-2xl" style="color:var(--color-rose);font-weight:600">${wishes.filter(w=>w.status==='已实现'||w.status==='出现部分对应事件').length}</div>
            <div class="text-faint text-xs">已实现/部分</div>
          </div>
          <div class="card text-center">
            <div class="text-2xl" style="color:var(--color-accent);font-weight:600">${treasures.length}</div>
            <div class="text-faint text-xs">宝物袋</div>
          </div>
        </div>

        <!-- 星星日记 -->
        <div class="card mb-4">
          <div class="card-title">📔 星星日记</div>
          <p class="text-faint text-sm mb-2">今天有没有什么事情让我想到某颗星星？（轻量，可选）</p>
          <button class="btn btn--sm btn--ghost" onclick="StarMapModule.addStarDiary()">写一句</button>
        </div>

        <!-- 宝物袋 -->
        <div class="card">
          <div class="card-title">🪄 宝物袋</div>
          ${treasures.length === 0 ? '<p class="text-faint text-sm">还没有已摘下的星星。实现的愿望会收藏在这里。</p>' : `
            <div class="flex flex-col gap-2">
              ${treasures.map(t => `
                <div class="list-item" style="cursor:pointer" onclick="StarMapModule.viewTreasure('${t.id}')">
                  <span style="font-size:20px">✨</span>
                  <div class="list-item__main">
                    <div class="list-item__title">${t.wish_title}</div>
                    <div class="list-item__sub">实现于 ${t.achieved_date||'-'}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
  },

  _renderStar(w) {
    // 随机位置但固定（基于 id hash）
    const seed = w.id.split('').reduce((s,c)=>s+c.charCodeAt(0),0);
    const x = (seed % 80) + 8;
    const y = ((seed * 7) % 75) + 10;
    const cls = w.status === '已实现' ? 'star-node--achieved' : (w.status === '出现部分对应事件' ? 'star-node--partial' : '');
    const size = w.importance >= 4 ? 28 : (w.importance >= 2 ? 22 : 18);
    return `
      <div class="star-node ${cls}" style="left:${x}%;top:${y}%" onclick="StarMapModule.viewWish('${w.id}')">
        <div class="star-node__glow" style="width:${size}px;height:${size}px"></div>
      </div>
    `;
  },

  async addWish() {
    const profiles = (await DB.list('link_profiles')).filter(p => !p.deleted_at);
    const currentProfileId = App.state.settings.current_link_profile || profiles[0]?.id;
    const categories = ['🌙 日常小显化','💌 互动愿望','🌱 关系成长愿望','✨ 内在成长愿望'];
    const statuses = ['⭐ 等待中','⭐ 等待观察','🌱 出现部分对应事件','✨ 已实现','🍃 暂未发生','🪐 不再期待'];
    UI.modal('新增一颗星星 ✨', `
      <div class="field">
        <label class="field__label">愿望标题</label>
        <input class="input" id="wTitle" placeholder="例如：希望收到一条特别的消息">
      </div>
      <div class="field">
        <label class="field__label">愿望详细描述</label>
        <textarea class="textarea" id="wDesc" placeholder="我为什么想体验 / 对我的意义 / 期待的感觉 / 脑海中的画面"></textarea>
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label class="field__label">分类</label>
          <select class="select" id="wCat">${categories.map(c=>`<option>${c}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label class="field__label">重要程度（1-5）</label>
          <input class="input" type="number" min="1" max="5" value="3" id="wImportance">
        </div>
      </div>
      <div class="field">
        <label class="field__label">状态</label>
        <select class="select" id="wStatus">${statuses.map(s=>`<option ${s.includes('等待中')?'selected':''}>${s}</option>`).join('')}</select>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="StarMapModule._saveWish('${currentProfileId}')">许下星星</button>
      </div>
    `);
  },

  async _saveWish(profileId) {
    const title = document.getElementById('wTitle').value.trim();
    if (!title) { UI.toast('请填写愿望标题','error'); return; }
    await DB.save('link_wishes', {
      profile_id: profileId,
      title,
      description: document.getElementById('wDesc').value,
      category: document.getElementById('wCat').value,
      importance: parseInt(document.getElementById('wImportance').value) || 3,
      status: document.getElementById('wStatus').value,
    });
    UI.closeModal();
    UI.toast('星星已许下 ✨','success');
    this.render();
  },

  async viewWish(id) {
    const w = await DB.get('link_wishes', id);
    if (!w) return;
    const events = (await DB.list('link_wish_events')).filter(e => !e.deleted_at && e.wish_id === id);
    UI.modal(`✨ ${w.title}`, `
      <div class="text-soft text-sm mb-2">${w.category} · ${w.status}</div>
      ${w.description ? `<p class="mb-3">${w.description}</p>` : ''}
      <div class="text-faint text-xs">创建于 ${w.created_at.slice(0,10)} · 重要度 ${'⭐'.repeat(w.importance)}</div>

      <div class="card-header mt-4">
        <div class="card-title">📋 后续事件</div>
        <button class="btn btn--sm btn--ghost" onclick="StarMapModule._closeAndAddEvent('${id}')">+ 添加</button>
      </div>
      ${events.length === 0 ? '<p class="text-faint text-sm">暂无后续事件记录</p>' : events.map(e => `
        <div class="list-item" style="cursor:pointer" onclick="StarMapModule.viewEvent('${e.id}','${id}')">
          <div class="list-item__main">
            <div class="list-item__title">${e.what_happened?.slice(0,40)||'事件'}</div>
            <div class="list-item__sub">${e.date||'-'}</div>
          </div>
        </div>
      `).join('')}

      <div class="field mt-4">
        <label class="field__label">修改状态</label>
        <select class="select" id="wNewStatus" onchange="StarMapModule._updateStatus('${id}')">
          ${['⭐ 等待中','⭐ 等待观察','🌱 出现部分对应事件','✨ 已实现','🍃 暂未发生','🪐 不再期待'].map(s=>`<option ${s===w.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>

      <div class="flex gap-3 mt-2" style="justify-content:flex-end">
        ${w.status === '已实现' ? `<button class="btn btn--rose btn--sm" onclick="StarMapModule._pickStar('${id}')">⭐ 摘下这颗星</button>` : ''}
        <button class="btn btn--accent btn--sm" onclick="StarMapModule._delWish('${id}')">删除</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  _closeAndAddEvent(wishId) {
    UI.closeModal();
    setTimeout(() => this.addEvent(wishId), 200);
  },

  async addEvent(wishId) {
    UI.modal('添加后续事件', `
      <div class="field">
        <label class="field__label">日期</label>
        <input class="input" type="date" id="eDate" value="${todayKey()}">
      </div>
      <div class="card--blur" style="background:rgba(241,148,166,0.06);padding:12px;border-radius:10px;margin:8px 0">
        <div class="text-xs text-faint mb-1">实际发生了什么</div>
        <textarea class="textarea" id="eHappened"></textarea>
      </div>
      <div class="card--blur" style="background:rgba(187,164,217,0.06);padding:12px;border-radius:10px;margin:8px 0">
        <div class="text-xs text-faint mb-1">我的感受</div>
        <textarea class="textarea" id="eFeeling"></textarea>
      </div>
      <div class="card--blur" style="background:rgba(138,78,123,0.06);padding:12px;border-radius:10px;margin:8px 0">
        <div class="text-xs text-faint mb-1">我的理解（是否与愿望有关）</div>
        <textarea class="textarea" id="eRelated" placeholder="我个人的理解，不自动判定为愿望实现"></textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="StarMapModule._saveEvent('${wishId}')">保存</button>
      </div>
    `);
  },

  async _saveEvent(wishId) {
    await DB.save('link_wish_events', {
      wish_id: wishId,
      date: document.getElementById('eDate').value,
      what_happened: document.getElementById('eHappened').value,
      feeling: document.getElementById('eFeeling').value,
      related: document.getElementById('eRelated').value,
    });
    UI.closeModal();
    UI.toast('事件已记录','success');
    this.viewWish(wishId);
  },

  async viewEvent(id, wishId) {
    const e = await DB.get('link_wish_events', id);
    if (!e) return;
    UI.modal('后续事件详情', `
      <p class="text-soft text-sm mb-2">${e.date}</p>
      <div class="card--blur" style="background:rgba(241,148,166,0.06);padding:12px;border-radius:10px;margin-bottom:8px"><div class="text-xs text-faint">实际发生</div><div>${e.what_happened}</div></div>
      <div class="card--blur" style="background:rgba(187,164,217,0.06);padding:12px;border-radius:10px;margin-bottom:8px"><div class="text-xs text-faint">我的感受</div><div>${e.feeling}</div></div>
      <div class="card--blur" style="background:rgba(138,78,123,0.06);padding:12px;border-radius:10px"><div class="text-xs text-faint">我的理解</div><div>${e.related}</div></div>
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn btn--accent btn--sm" onclick="StarMapModule._delEvent('${id}','${wishId}')">删除</button>
        <button class="btn btn--sm" onclick="UI.closeModal();StarMapModule.viewWish('${wishId}')">返回</button>
      </div>
    `);
  },

  async _delEvent(id, wishId) {
    if (!await UI.confirm('删除这条事件记录？')) return;
    await DB.hardDelete('link_wish_events', id);
    UI.closeModal();
    this.viewWish(wishId);
  },

  async _updateStatus(id) {
    const w = await DB.get('link_wishes', id);
    if (w) {
      w.status = document.getElementById('wNewStatus').value;
      await DB.save('link_wishes', w);
      UI.toast('状态已更新','success');
    }
  },

  async _pickStar(id) {
    const w = await DB.get('link_wishes', id);
    if (!w) return;
    if (!await UI.confirm('摘下这颗星？它将从天空消失，进入宝物袋。')) return;
    const profiles = (await DB.list('link_profiles')).filter(p => !p.deleted_at);
    await DB.save('link_treasures', {
      profile_id: w.profile_id,
      wish_id: id,
      wish_title: w.title,
      wish_description: w.description,
      created_date: w.created_at.slice(0,10),
      achieved_date: todayKey(),
    });
    // 从星图移除（软删除）
    w.status = '已实现';
    w.picked = true;
    await DB.save('link_wishes', w);
    UI.closeModal();
    UI.toast('星星已摘下，收入宝物袋 ✨','success');
    this.render();
  },

  async viewTreasure(id) {
    const t = await DB.get('link_treasures', id);
    if (!t) return;
    const events = (await DB.list('link_wish_events')).filter(e => !e.deleted_at && e.wish_id === t.wish_id);
    UI.modal(`✨ ${t.wish_title}`, `
      <p class="text-soft text-sm">许愿于 ${t.created_date} · 实现于 ${t.achieved_date}</p>
      ${t.wish_description ? `<p class="mt-2">${t.wish_description}</p>` : ''}
      <div class="card-header mt-4"><div class="card-title">相关记录</div></div>
      ${events.length === 0 ? '<p class="text-faint text-sm">无后续事件</p>' : events.map(e => `
        <div class="list-item"><div class="list-item__main">
          <div class="list-item__title">${e.what_happened?.slice(0,40)}</div>
          <div class="list-item__sub">${e.date} · ${e.feeling?.slice(0,30)||''}</div>
        </div></div>
      `).join('')}
      <div class="field mt-3">
        <label class="field__label">我的感悟</label>
        <textarea class="textarea" id="tInsight" placeholder="现在回头看有什么变化">${t.insight||''}</textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn btn--primary btn--sm" onclick="StarMapModule._saveInsight('${id}')">保存感悟</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  async _saveInsight(id) {
    const t = await DB.get('link_treasures', id);
    if (t) { t.insight = document.getElementById('tInsight').value; await DB.save('link_treasures', t); }
    UI.closeModal();
    UI.toast('感悟已保存','success');
  },

  async addStarDiary() {
    UI.modal('📔 星星日记', `
      <div class="field">
        <label class="field__label">今天有没有什么事情让我想到某颗星星？</label>
        <textarea class="textarea" id="dContent" placeholder="轻量记录，可选"></textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="StarMapModule._saveDiary()">保存</button>
      </div>
    `);
  },

  async _saveDiary() {
    await DB.save('reviews', {
      type: 'star_diary',
      date: todayKey(),
      content: document.getElementById('dContent').value,
    });
    UI.closeModal();
    UI.toast('日记已保存','success');
  },

  async _delWish(id) {
    if (!await UI.confirm('删除这颗星星及其所有后续事件？')) return;
    await DB.hardDelete('link_wishes', id);
    const events = (await DB.list('link_wish_events')).filter(e => e.wish_id === id);
    for (const e of events) await DB.hardDelete('link_wish_events', e.id);
    UI.closeModal();
    UI.toast('已删除','success');
    this.render();
  },
};


// === js/modules/cards.js ===
/**
 * 字卡传讯与自我探索系统
 * 象征性工具，不代表现实人物信息
 */
const CardsModule = {
  async render() {
    if (!App.state.settings.enable_cards) {
      document.getElementById('pageContent').innerHTML = `<div class="page"><div class="card">${UI.empty('💌','字卡功能未开启，可在设置中开启')}</div></div>`;
      return;
    }
    const decks = (await DB.list('card_decks')).filter(d => !d.deleted_at);
    const draws = (await DB.list('card_draws')).filter(d => !d.deleted_at);
    const html = `
      <div class="page">
        <div class="flex justify-between items-center mb-4">
          <div class="page__title" style="margin:0">💌 字卡传讯</div>
          <div class="flex gap-2">
            <button class="btn btn--sm" onclick="CardsModule.manageDecks()">卡组管理</button>
            <button class="btn btn--primary btn--sm" onclick="CardsModule.draw()">抽取字卡</button>
          </div>
        </div>

        <div class="ai-disclaimer mb-4">
          字卡传讯用于仪式感记录、创意书写、情绪投射和自我探索。<br>
          抽取结果 <b>不代表对方真实发送的信息</b>，不承诺事件发生。
        </div>

        <!-- 卡组列表 -->
        <div class="card mb-4">
          <div class="card-title">📚 我的卡组</div>
          ${decks.length === 0 ? `
            <p class="text-faint text-sm mb-3">还没有卡组，系统已为你预设一个</p>
            <button class="btn btn--sm" onclick="CardsModule._initDefault()">初始化预设卡组</button>
          ` : `
            <div class="flex flex-col gap-2">
              ${decks.map(d => {
                const items = (window._cardItems || []).filter(i => i.deck_id === d.id);
                return `
                  <div class="list-item" style="cursor:pointer" onclick="CardsModule.viewDeck('${d.id}')">
                    <span style="font-size:20px">🎴</span>
                    <div class="list-item__main">
                      <div class="list-item__title">${d.name}</div>
                      <div class="list-item__sub">${d.description||''}</div>
                    </div>
                    <span class="badge">${items.length}</span>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>

        <!-- 抽卡统计 -->
        ${draws.length > 0 ? `
          <div class="card mb-4">
            <div class="card-title">📊 字卡统计</div>
            ${this._stats(draws)}
          </div>
        ` : ''}

        <!-- 最近抽卡 -->
        <div class="card">
          <div class="card-title">🌟 最近抽卡</div>
          ${draws.length === 0 ? UI.empty('💌','还没有抽卡记录') : `
            <div class="flex flex-col gap-2">
              ${draws.sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,10).map(d => `
                <div class="list-item" style="cursor:pointer" onclick="CardsModule.viewDraw('${d.id}')">
                  <span style="font-size:20px">💌</span>
                  <div class="list-item__main">
                    <div class="list-item__title">${d.cards?.map(c=>c.word).join(' · ')||'-'}</div>
                    <div class="list-item__sub">${d.created_at.slice(0,16).replace('T',' ')}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      </div>
    `;
    // 加载所有卡项
    window._cardItems = (await DB.list('card_items')).filter(i => !i.deleted_at);
    document.getElementById('pageContent').innerHTML = html;
  },

  _stats(draws) {
    const now = new Date();
    const weekStart = new Date(now); weekStart.setDate(now.getDate()-7);
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const yearStart = new Date(now.getFullYear(), 0, 1);
    const weekDraws = draws.filter(d => new Date(d.created_at) >= weekStart);
    const monthDraws = draws.filter(d => new Date(d.created_at) >= monthStart);
    const yearDraws = draws.filter(d => new Date(d.created_at) >= yearStart);
    // 高频字卡
    const cardCount = {};
    draws.forEach(d => {
      (d.cards||[]).forEach(c => { cardCount[c.word] = (cardCount[c.word]||0)+1; });
    });
    const top = Object.entries(cardCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
    return `
      <div class="grid grid-3 mb-3">
        <div class="health-item"><div class="health-item__label">本周</div><div class="health-item__value">${weekDraws.length}</div></div>
        <div class="health-item"><div class="health-item__label">本月</div><div class="health-item__value">${monthDraws.length}</div></div>
        <div class="health-item"><div class="health-item__label">本年</div><div class="health-item__value">${yearDraws.length}</div></div>
      </div>
      ${top.length > 0 ? `
        <div class="text-faint text-xs">高频字卡:</div>
        <ul class="text-sm">${top.map(([w,c]) => `<li>${w}: ${c} 次</li>`).join('')}</ul>
        <div class="ai-disclaimer">统计结果只描述记录规律，不把抽卡频率解释成外部信号</div>
      ` : ''}
    `;
  },

  async _initDefault() {
    const defaultDeck = await DB.save('card_decks', {
      name: '今日链接讯息',
      description: '用于每日自我探索的通用字卡',
      allow_repeat: false,
    });
    const words = ['温柔','勇气','等待','倾听','放下','拥抱','信任','流动','安静','绽放','回归','守护','呼吸','自由','光亮','耐心'];
    for (const w of words) {
      await DB.save('card_items', {
        deck_id: defaultDeck.id,
        word: w,
        interpretation: `这张卡可能让你联想到关于「${w}」的内在需要。这是一个可供探索的角度。`,
      });
    }
    UI.toast('预设卡组已创建','success');
    this.render();
  },

  async draw() {
    const decks = (await DB.list('card_decks')).filter(d => !d.deleted_at);
    if (decks.length === 0) { UI.toast('请先创建卡组','error'); return; }
    const profiles = (await DB.list('link_profiles')).filter(p => !p.deleted_at);
    UI.modal('抽取字卡 💌', `
      <div class="field">
        <label class="field__label">选择卡组</label>
        <select class="select" id="dDeck">${decks.map(d=>`<option value="${d.id}">${d.name}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label class="field__label">抽卡数量</label>
        <select class="select" id="dCount">
          <option value="1">单张</option>
          <option value="3">三张</option>
          <option value="5">五张</option>
        </select>
      </div>
      <div class="field">
        <label class="field__label">当前问题（可选）</label>
        <input class="input" id="dQuestion" placeholder="想探索的问题">
      </div>
      <div class="field">
        <label class="field__label">当前情绪（可选）</label>
        <input class="input" id="dEmotion">
      </div>
      <div class="field">
        <label class="field__label">选择对象档案（可选）</label>
        <select class="select" id="dProfile">
          <option value="">不关联</option>
          ${profiles.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
        </select>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="CardsModule._doDraw()">抽取 ✨</button>
      </div>
    `);
  },

  async _doDraw() {
    const deckId = document.getElementById('dDeck').value;
    const count = parseInt(document.getElementById('dCount').value);
    const question = document.getElementById('dQuestion').value;
    const emotion = document.getElementById('dEmotion').value;
    const profileId = document.getElementById('dProfile').value;
    const items = (await DB.list('card_items')).filter(i => !i.deleted_at && i.deck_id === deckId);
    if (items.length === 0) { UI.toast('该卡组没有字卡','error'); return; }
    // 随机抽取
    const shuffled = [...items].sort(() => Math.random() - 0.5);
    const drawn = shuffled.slice(0, Math.min(count, items.length));
    const record = await DB.save('card_draws', {
      deck_id: deckId,
      cards: drawn.map(c => ({ word: c.word, interpretation: c.interpretation })),
      question, emotion, profile_id: profileId || null,
    });
    UI.closeModal();
    this._showDrawResult(record, drawn);
  },

  _showDrawResult(record, drawn) {
    UI.modal('抽卡结果 ✨', `
      <div class="text-center" style="padding:20px 0">
        ${drawn.map((c,i) => `
          <div style="display:inline-block;margin:8px;padding:20px;background:linear-gradient(135deg,var(--color-rose-soft),var(--color-wisteria));border-radius:16px;min-width:120px;box-shadow:var(--shadow-md)">
            <div style="font-size:28px">💌</div>
            <div style="font-size:22px;color:var(--color-primary);font-weight:600;margin-top:8px">${c.word}</div>
            <div class="text-xs text-soft mt-2" style="max-width:160px">${c.interpretation||''}</div>
          </div>
        `).join('')}
      </div>
      <div class="ai-block">
        ${drawn.length > 1
          ? `这些字卡放在一起，可能形成一个主题供你探索。`
          : `这张卡可能让你联想到……`}
        你可以借此观察自己现在的期待与需要。这是一个可供探索的角度，不代表现实结论。
        <div class="ai-disclaimer">AI 生成的象征性/创意文本，仅供自我探索与娱乐，不代表任何现实人物的真实想法、承诺或信息</div>
      </div>
      <div class="field mt-3">
        <label class="field__label">我的第一感受</label>
        <textarea class="textarea" id="rFirstFeel"></textarea>
      </div>
      <div class="field">
        <label class="field__label">我联想到的事情</label>
        <textarea class="textarea" id="rAssociate"></textarea>
      </div>
      <div class="field">
        <label class="field__label">这张卡对我的个人意义</label>
        <textarea class="textarea" id="rMeaning"></textarea>
      </div>
      <div class="field">
        <label class="field__label">可以采取的现实行动</label>
        <textarea class="textarea" id="rAction"></textarea>
      </div>
      <div class="flex flex-wrap gap-3">
        <label class="text-sm"><input type="checkbox" id="rFav"> 收藏</label>
        <label class="text-sm"><input type="checkbox" id="rTimeline"> 加入灵魂链接时间线</label>
        <label class="text-sm"><input type="checkbox" id="rSyncEmo"> 同步到情绪记录</label>
      </div>
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">不保存</button>
        <button class="btn btn--primary" onclick="CardsModule._saveDrawResult('${record.id}')">保存记录</button>
      </div>
    `);
  },

  async _saveDrawResult(id) {
    const d = await DB.get('card_draws', id);
    if (d) {
      d.first_feeling = document.getElementById('rFirstFeel').value;
      d.association = document.getElementById('rAssociate').value;
      d.meaning = document.getElementById('rMeaning').value;
      d.action = document.getElementById('rAction').value;
      d.favorited = document.getElementById('rFav').checked;
      d.add_to_timeline = document.getElementById('rTimeline').checked;
      d.sync_emotion = document.getElementById('rSyncEmo').checked;
      await DB.save('card_draws', d);
      // 同步到灵魂链接时间线
      if (d.add_to_timeline && d.profile_id) {
        await DB.save('link_records', {
          profile_id: d.profile_id,
          title: `字卡抽取: ${d.cards.map(c=>c.word).join('·')}`,
          record_type: '感想与成长',
          happened: '字卡记录（标记）',
          feeling: d.first_feeling,
          understanding: d.meaning,
          tags: ['字卡记录'],
          count_as_real: false,  // 字卡不计入真实互动
          source_type: 'card_draw',
        });
      }
      if (d.sync_emotion && d.first_feeling) {
        await DB.save('emotions', {
          emotion_type: '平和',
          intensity: 5,
          event: `字卡抽取后的感受: ${d.first_feeling.slice(0,50)}`,
          source_type: 'card_sync',
        });
      }
    }
    UI.closeModal();
    UI.toast('抽卡记录已保存','success');
    this.render();
  },

  quickDraw() { this.draw(); },

  async viewDraw(id) {
    const d = await DB.get('card_draws', id);
    if (!d) return;
    UI.modal('抽卡记录', `
      <div class="text-center mb-3">
        ${d.cards.map(c => `<div style="display:inline-block;margin:4px;padding:12px 16px;background:var(--color-rose-soft);border-radius:12px;color:var(--color-primary);font-weight:600">${c.word}</div>`).join('')}
      </div>
      ${d.question ? `<p class="text-soft text-sm">问题: ${d.question}</p>` : ''}
      ${d.emotion ? `<p class="text-soft text-sm">当时情绪: ${d.emotion}</p>` : ''}
      ${d.first_feeling ? `<div class="mt-2"><b>第一感受:</b> ${d.first_feeling}</div>` : ''}
      ${d.association ? `<div class="mt-1"><b>联想:</b> ${d.association}</div>` : ''}
      ${d.meaning ? `<div class="mt-1"><b>个人意义:</b> ${d.meaning}</div>` : ''}
      ${d.action ? `<div class="mt-1"><b>现实行动:</b> ${d.action}</div>` : ''}
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn btn--accent btn--sm" onclick="CardsModule._delDraw('${id}')">删除</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  async _delDraw(id) {
    if (!await UI.confirm('删除这条抽卡记录？')) return;
    await DB.hardDelete('card_draws', id);
    UI.closeModal();
    UI.toast('已删除','success');
    this.render();
  },

  async manageDecks() {
    const decks = (await DB.list('card_decks')).filter(d => !d.deleted_at);
    UI.modal('卡组管理', `
      ${decks.map(d => `
        <div class="list-item" onclick="CardsModule.viewDeck('${d.id}')">
          <span style="font-size:20px">🎴</span>
          <div class="list-item__main">
            <div class="list-item__title">${d.name}</div>
            <div class="list-item__sub">${d.description||''}</div>
          </div>
        </div>
      `).join('')}
      <button class="btn btn--ghost btn--block mt-2" onclick="CardsModule.addDeck()">+ 新建卡组</button>
    `);
  },

  async addDeck() {
    UI.closeModal();
    UI.modal('新建卡组', `
      <div class="field">
        <label class="field__label">卡组名称</label>
        <input class="input" id="deckName" placeholder="如：情绪觉察">
      </div>
      <div class="field">
        <label class="field__label">描述</label>
        <input class="input" id="deckDesc">
      </div>
      <div class="field">
        <label class="field__label">字卡（每行一个词）</label>
        <textarea class="textarea" id="deckWords" placeholder="温柔&#10;勇气&#10;等待"></textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="CardsModule._saveDeck()">创建</button>
      </div>
    `);
  },

  async _saveDeck() {
    const name = document.getElementById('deckName').value.trim();
    if (!name) { UI.toast('请输入名称','error'); return; }
    const deck = await DB.save('card_decks', {
      name,
      description: document.getElementById('deckDesc').value,
      allow_repeat: false,
    });
    const words = document.getElementById('deckWords').value.split('\n').map(s=>s.trim()).filter(Boolean);
    for (const w of words) {
      await DB.save('card_items', { deck_id: deck.id, word: w, interpretation: '' });
    }
    UI.closeModal();
    UI.toast('卡组已创建','success');
    this.render();
  },

  async viewDeck(id) {
    const deck = await DB.get('card_decks', id);
    const items = (await DB.list('card_items')).filter(i => !i.deleted_at && i.deck_id === id);
    UI.modal(`${deck.name}`, `
      <p class="text-soft text-sm mb-3">${deck.description||''}</p>
      <div class="flex flex-wrap gap-2 mb-3">
        ${items.map(i => `<span class="tag-chip" style="padding:8px 14px">${i.word}</span>`).join('')}
      </div>
      <button class="btn btn--primary btn--sm" onclick="UI.closeModal();CardsModule.draw()">用此卡组抽卡</button>
    `);
  },
};

/**
 * 项目与内容管理模块
 */
const ProjectsModule = {
  async render() {
    const projects = (await DB.list('projects')).filter(p => !p.deleted_at);
    const stages = ['灵感','待规划','进行中','待检查','已完成','已复盘'];
    const html = `
      <div class="page">
        <div class="flex justify-between items-center mb-4">
          <div class="page__title" style="margin:0">🎬 项目与内容管理</div>
          <button class="btn btn--primary btn--sm" onclick="ProjectsModule.add()">+ 新建项目</button>
        </div>

        ${projects.length === 0 ? `<div class="card">${UI.empty('🎬','还没有项目')}</div>` : `
          <div class="flex gap-2 mb-4 flex-wrap">
            ${stages.map(s => {
              const count = projects.filter(p => p.stage === s).length;
              return `<span class="tag-chip" style="padding:6px 12px">${s}(${count})</span>`;
            }).join('')}
          </div>
          <div class="flex flex-col gap-3">
            ${projects.sort((a,b)=>(b.priority||'').localeCompare(a.priority||'')).map(p => `
              <div class="card" style="cursor:pointer" onclick="ProjectsModule.view('${p.id}')">
                <div class="flex items-center gap-3">
                  <span style="font-size:24px">${this._stageIcon(p.stage)}</span>
                  <div class="flex-1">
                    <div class="font-bold">${p.name}</div>
                    <div class="text-faint text-xs">${p.type||''} · ${p.stage} · ${p.priority||'普通'}</div>
                  </div>
                  ${p.deadline ? `<span class="badge" style="background:var(--color-wisteria)">截止 ${p.deadline}</span>` : ''}
                </div>
                ${p.goal ? `<p class="text-soft text-sm mt-2">${p.goal}</p>` : ''}
              </div>
            `).join('')}
          </div>
        `}
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
  },

  _stageIcon(s) {
    return { '灵感':'💡','待规划':'📋','进行中':'🔨','待检查':'🔍','已完成':'✅','已复盘':'📝' }[s] || '🎬';
  },

  async add() {
    const stages = ['灵感','待规划','进行中','待检查','已完成','已复盘'];
    UI.modal('新建项目', `
      <div class="field"><label class="field__label">项目名称 *</label><input class="input" id="pName"></div>
      <div class="grid grid-2">
        <div class="field"><label class="field__label">类型</label><input class="input" id="pType" placeholder="如：内容创作"></div>
        <div class="field"><label class="field__label">优先级</label><select class="select" id="pPrio"><option>普通</option><option>重要</option><option>紧急</option></select></div>
      </div>
      <div class="grid grid-2">
        <div class="field"><label class="field__label">开始日期</label><input class="input" type="date" id="pStart" value="${todayKey()}"></div>
        <div class="field"><label class="field__label">截止日期</label><input class="input" type="date" id="pDeadline"></div>
      </div>
      <div class="field"><label class="field__label">当前阶段</label><select class="select" id="pStage">${stages.map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div class="field"><label class="field__label">目标</label><textarea class="textarea" id="pGoal"></textarea></div>
      <div class="flex gap-3" style="justify-content:flex-end"><button class="btn" onclick="UI.closeModal()">取消</button><button class="btn btn--primary" onclick="ProjectsModule._save()">创建</button></div>
    `);
  },

  async _save() {
    const name = document.getElementById('pName').value.trim();
    if (!name) { UI.toast('请输入名称','error'); return; }
    await DB.save('projects', {
      name, type: document.getElementById('pType').value,
      priority: document.getElementById('pPrio').value,
      start_date: document.getElementById('pStart').value,
      deadline: document.getElementById('pDeadline').value,
      stage: document.getElementById('pStage').value,
      goal: document.getElementById('pGoal').value,
    });
    UI.closeModal();
    UI.toast('项目已创建','success');
    this.render();
  },

  async view(id) {
    const p = await DB.get('projects', id);
    if (!p) return;
    const subtasks = (await DB.list('project_tasks')).filter(t => !t.deleted_at && t.project_id === id);
    UI.modal(p.name, `
      <div class="text-soft text-sm mb-3">${p.type||''} · ${p.stage} · ${p.priority||''}</div>
      ${p.goal ? `<p class="mb-3"><b>目标:</b> ${p.goal}</p>` : ''}
      ${p.start_date||p.deadline ? `<p class="text-sm mb-3">${p.start_date||'?'} → ${p.deadline||'?'}</p>` : ''}
      <div class="card-header"><div class="card-title">子任务</div><button class="btn btn--sm btn--ghost" onclick="ProjectsModule._addSubtask('${id}')">+</button></div>
      ${subtasks.length === 0 ? '<p class="text-faint text-sm">无子任务</p>' : subtasks.map(t => `
        <div class="list-item">
          <input type="checkbox" ${t.done?'checked':''} onchange="ProjectsModule._toggleSub('${t.id}')">
          <div class="list-item__main"><div class="list-item__title" style="${t.done?'text-decoration:line-through;opacity:0.5':''}">${t.title}</div></div>
        </div>
      `).join('')}
      <div class="field mt-3"><label class="field__label">复盘总结</label><textarea class="textarea" id="pReview" placeholder="完成后填写">${p.review||''}</textarea></div>
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn btn--accent btn--sm" onclick="ProjectsModule._del('${id}')">删除</button>
        <button class="btn btn--primary btn--sm" onclick="ProjectsModule._saveReview('${id}')">保存复盘</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  async _addSubtask(pid) {
    const name = prompt('子任务名称：');
    if (!name) return;
    await DB.save('project_tasks', { project_id: pid, title: name, done: false });
    UI.closeModal();
    this.view(pid);
  },

  async _toggleSub(id) {
    const t = await DB.get('project_tasks', id);
    if (t) { t.done = !t.done; await DB.save('project_tasks', t); }
  },

  async _saveReview(id) {
    const p = await DB.get('projects', id);
    if (p) { p.review = document.getElementById('pReview').value; p.stage = '已复盘'; await DB.save('projects', p); }
    UI.closeModal();
    UI.toast('复盘已保存','success');
    this.render();
  },

  async _del(id) {
    if (!await UI.confirm('删除这个项目？')) return;
    await DB.hardDelete('projects', id);
    const subs = (await DB.list('project_tasks')).filter(t => t.project_id === id);
    for (const s of subs) await DB.hardDelete('project_tasks', s.id);
    UI.closeModal();
    UI.toast('已删除','success');
    this.render();
  },
};

      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
    this._renderHeatmap(timers, emotions, workouts, linkRecords);
    this._renderTrend(timers, emotions, workouts);
    this._renderPie(timers);
  },

  _fmtDur(ms) {
    const m = Math.floor(ms/60000);
    if (m < 60) return `${m}分`;
    return `${Math.floor(m/60)}时${m%60}分`;
  },

  _renderHeatmap(timers, emotions, workouts, links) {
    const el = document.getElementById('heatmap');
    if (!el) return;
    const days = [];
    const now = new Date();
    for (let i = 29; i >= 0; i--) {
      const d = new Date(now); d.setDate(now.getDate()-i);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const count = timers.filter(t=>t.start_time?.startsWith(key)).length
                  + emotions.filter(e=>e.created_at?.startsWith(key)).length
                  + workouts.filter(w=>w.date===key).length
                  + links.filter(l=>l.created_at?.startsWith(key)).length;
      days.push({ key, count, label: `${d.getMonth()+1}/${d.getDate()}` });
    }
    el.innerHTML = `
      <div style="display:flex;gap:3px;min-width:600px">
        ${days.map(d => {
          const intensity = Math.min(d.count, 5);
          const bg = d.count === 0 ? 'var(--color-divider)' : `rgba(241,148,166,${0.2+intensity*0.16})`;
          return `<div title="${d.label}: ${d.count} 条" style="width:18px;height:18px;border-radius:4px;background:${bg};flex-shrink:0"></div>`;
        }).join('')}
      </div>
      <div class="text-faint text-xs mt-2">颜色越深表示当天活动越多</div>
    `;
  },

  _renderTrend(timers, emotions, workouts) {
    const el = document.getElementById('trendChart');
    if (!el || typeof Chart === 'undefined') return;
    const now = new Date();
    const labels = []; const timerData = []; const emoData = []; const workData = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const next = new Date(now.getFullYear(), now.getMonth()-i+1, 1);
      labels.push(`${d.getMonth()+1}月`);
      timerData.push(timers.filter(t => { const td = new Date(t.start_time); return td >= d && td < next; }).reduce((s,t)=>s+Math.round((t.duration||0)/60000),0));
      emoData.push(emotions.filter(e => { const ed = new Date(e.created_at); return ed >= d && ed < next; }).length);
      workData.push(workouts.filter(w => { const wd = new Date(w.date); return wd >= d && wd < next; }).length);
    }
    const canvas = document.createElement('canvas');
    canvas.style.maxHeight = '240px';
    el.innerHTML = '';
    el.appendChild(canvas);
    new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [
        { label: '专注(分)', data: timerData, borderColor: '#8A4E7B', tension: 0.3 },
        { label: '情绪(次)', data: emoData, borderColor: '#F194A6', tension: 0.3 },
        { label: '锻炼(次)', data: workData, borderColor: '#BBA4D9', tension: 0.3 },
      ]},
      options: { maintainAspectRatio: false },
    });
  },

  _renderPie(timers) {
    const el = document.getElementById('pieChart');
    if (!el || typeof Chart === 'undefined' || timers.length === 0) {
      el.innerHTML = '<p class="text-faint text-sm text-center">暂无数据</p>';
      return;
    }
    const byType = {};
    timers.forEach(t => { byType[t.task_type] = (byType[t.task_type]||0) + Math.round((t.duration||0)/60000); });
    const canvas = document.createElement('canvas');
    canvas.style.maxHeight = '240px';
    el.innerHTML = '';
    el.appendChild(canvas);
    new Chart(canvas, {
      type: 'doughnut',
      data: { labels: Object.keys(byType), datasets: [{ data: Object.values(byType), backgroundColor: ['#F194A6','#8A4E7B','#BBA4D9','#DB5A6B','#7EC8A0','#F5B97A'] }] },
      options: { maintainAspectRatio: false },
    });
  },
};

/**
 * 每日复盘与设置模块
 */
const ReviewModule = {
  async render() {
    const reviews = (await DB.list('reviews')).filter(r => !r.deleted_at && r.type !== 'link_monthly' && r.type !== 'star_diary');
    const today = todayKey();
    const todayReview = reviews.find(r => r.date === today);
    const recent = reviews.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);

    const html = `
      <div class="page">
        <div class="flex justify-between items-center mb-4">
          <div class="page__title" style="margin:0">🌙 每日复盘</div>
          <button class="btn btn--primary btn--sm" onclick="ReviewModule.startToday()">${todayReview?'编辑今日':'开始复盘'}</button>
        </div>

        ${todayReview ? `
          <div class="card mb-4">
            <div class="card-title">📝 今日复盘（${today}）</div>
            ${this._renderReviewContent(todayReview)}
          </div>
        ` : `
          <div class="card mb-4">
            ${UI.empty('🌙','今天还没有复盘')}
            <button class="btn btn--primary mt-2" onclick="ReviewModule.startToday()">开始每日复盘</button>
          </div>
        `}

        <div class="card">
          <div class="card-title">📜 历史复盘</div>
          ${recent.length === 0 ? '<p class="text-faint text-sm">暂无历史复盘</p>' : `
            <div class="flex flex-col gap-2">
              ${recent.map(r => `
                <div class="list-item" style="cursor:pointer" onclick="ReviewModule.view('${r.id}')">
                  <div class="list-item__main">
                    <div class="list-item__title">${r.date}</div>
                    <div class="list-item__sub">${r.content?.top3?.[0] || r.content?.summary?.slice(0,40) || ''}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <div class="card mt-4">
          <div class="card-title">⚙️ 快捷设置</div>
          <div class="flex flex-wrap gap-2">
            <button class="btn btn--sm" onclick="App.navigate('settings')">全部设置</button>
            <button class="btn btn--sm" onclick="ReviewModule.exportData()">导出数据</button>
            <button class="btn btn--sm" onclick="ReviewModule.importData()">导入数据</button>
            <button class="btn btn--sm" onclick="ReviewModule.dataHealth()">数据健康检查</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
  },

  _renderReviewContent(r) {
    const c = r.content || {};
    return `
      ${c.summary ? `<p class="mb-2"><b>今天完成了什么：</b> ${c.summary}</p>` : ''}
      ${c.difficulty ? `<p class="mb-2"><b>遇到的困难：</b> ${c.difficulty}</p>` : ''}
      ${c.emotion ? `<p class="mb-2"><b>重要情绪变化：</b> ${c.emotion}</p>` : ''}
      ${c.top3 ? `<p class="mb-2"><b>明天最重要的三件事：</b><br>${c.top3.map((t,i)=>`${i+1}. ${t}`).join('<br>')}</p>` : ''}
      ${c.is_ai_generated ? '<div class="ai-badge">AI 草稿</div>' : ''}
    `;
  },

  async startToday() {
    const today = todayKey();
    let review = (await DB.list('reviews')).find(r => !r.deleted_at && r.date === today && r.type !== 'link_monthly' && r.type !== 'star_diary');
    // 自动生成草稿
    if (!review) {
      const draft = await this._generateDraft();
      review = await DB.save('reviews', { date: today, type: 'daily', content: draft, is_ai_generated: true });
    }
    const c = review.content || {};
    UI.modal(`每日复盘 - ${today}`, `
      <div class="ai-block mb-3">
        💡 已根据今日记录生成草稿（标注为 AI 生成），你可以自由编辑。草稿内容不会伪装成你的原话。
      </div>
      <div class="field"><label class="field__label">今天完成了什么</label><textarea class="textarea" id="rSummary">${c.summary||''}</textarea></div>
      <div class="field"><label class="field__label">今天在不同事项上用了多久</label><textarea class="textarea" id="rTime">${c.time||''}</textarea></div>
      <div class="field"><label class="field__label">今天最满意的事情</label><textarea class="textarea" id="rBest">${c.best||''}</textarea></div>
      <div class="field"><label class="field__label">今天遇到的困难</label><textarea class="textarea" id="rDiff">${c.difficulty||''}</textarea></div>
      <div class="field"><label class="field__label">今天的重要情绪变化</label><textarea class="textarea" id="rEmo">${c.emotion||''}</textarea></div>
      <div class="field"><label class="field__label">明天最重要的三件事</label>
        <input class="input mb-2" id="rTop1" placeholder="1." value="${c.top3?.[0]||''}">
        <input class="input mb-2" id="rTop2" placeholder="2." value="${c.top3?.[1]||''}">
        <input class="input" id="rTop3" placeholder="3." value="${c.top3?.[2]||''}">
      </div>
      <div class="field"><label class="field__label">自由写作</label><textarea class="textarea" id="rFree">${c.free||''}</textarea></div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="ReviewModule._saveReview('${review.id}')">保存复盘</button>
      </div>
    `);
  },

  async _generateDraft() {
    const today = todayKey();
    const timers = (await DB.list('timers')).filter(t => !t.deleted_at && t.start_time?.startsWith(today));
    const emotions = (await DB.list('emotions')).filter(e => !e.deleted_at && e.created_at?.startsWith(today));
    const workouts = (await DB.list('workouts')).filter(w => !w.deleted_at && w.date === today);
    const tasks = (await DB.list('tasks')).filter(t => !t.deleted_at && t.date === today && t.completed);
    let timeSummary = '';
    if (timers.length > 0) {
      const byType = {};
      timers.forEach(t => { byType[t.task_type] = (byType[t.task_type]||0) + Math.round((t.duration||0)/60000); });
      timeSummary = Object.entries(byType).map(([t,m])=>`${t}: ${m}分钟`).join('，');
    }
    let emoSummary = '';
    if (emotions.length > 0) {
      emoSummary = emotions.map(e=>`${e.emotion_type}(${e.intensity})`).join('，');
    }
    return {
      summary: tasks.length > 0 ? `完成了 ${tasks.length} 个任务：${tasks.map(t=>t.title).join('、')}` : '',
      time: timeSummary,
      best: '',
      difficulty: '',
      emotion: emoSummary,
      top3: ['','',''],
      free: '',
      workout_done: workouts.length > 0,
      read_done: timers.some(t => t.task_type === '阅读'),
      has_link: (await DB.list('link_records')).some(r => !r.deleted_at && r.created_at?.startsWith(today)),
    };
  },

  async _saveReview(id) {
    const r = await DB.get('reviews', id);
    if (r) {
      r.content = {
        summary: document.getElementById('rSummary').value,
        time: document.getElementById('rTime').value,
        best: document.getElementById('rBest').value,
        difficulty: document.getElementById('rDiff').value,
        emotion: document.getElementById('rEmo').value,
        top3: [document.getElementById('rTop1').value, document.getElementById('rTop2').value, document.getElementById('rTop3').value].filter(Boolean),
        free: document.getElementById('rFree').value,
      };
      r.is_ai_generated = false;  // 用户编辑后标记为非AI
      await DB.save('reviews', r);
    }
    UI.closeModal();
    UI.toast('复盘已保存','success');
    this.render();
  },

  async view(id) {
    const r = await DB.get('reviews', id);
    if (!r) return;
    UI.modal(`复盘 - ${r.date}`, this._renderReviewContent(r) + `
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn btn--accent btn--sm" onclick="ReviewModule._del('${id}')">删除</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  async _del(id) {
    if (!await UI.confirm('删除这条复盘？')) return;
    await DB.hardDelete('reviews', id);
    UI.closeModal();
    UI.toast('已删除','success');
    this.render();
  },

  exportData() { SettingsModule.exportData(); },
  importData() { SettingsModule.importData(); },
  dataHealth() { SettingsModule.dataHealth(); },
};

    const idx = hidden.indexOf(id);
    if (idx >= 0) hidden.splice(idx, 1);
    else hidden.push(id);
    await DB.setSetting('hidden_modules', hidden);
    App.state.settings.hidden_modules = hidden;
    App.renderShell();
    this.render();

              <div class="list-item__sub">${b.reason} · ${b.record_count} 条</div>
            </div>
            <button class="btn btn--sm btn--accent" onclick="SettingsModule._restore('${b.id}')">恢复</button>
          </div>
        `).join('')}
      </div>
    `);
  },

  async _restore(id) {
    if (!await UI.confirm('恢复备份会覆盖当前数据（恢复前会自动再备份一次）。确认恢复？')) return;
    await DB.restoreBackup(id);
    UI.closeModal();
    UI.toast('已恢复，正在重新加载…','success');
    setTimeout(() => location.reload(), 1000);
  },

  async exportData() {
    const json = await DB.exportJSON();
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `zhaozhao-backup-${todayKey()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    UI.toast('已导出','success');
  },

  async importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!await UI.confirm('导入数据将合并到当前数据库。建议先导出当前备份。继续？')) return;
      const text = await file.text();
      try {
        const count = await DB.importJSON(text, 'merge');
        UI.toast(`已导入 ${count} 条记录`,'success');
        setTimeout(() => location.reload(), 1000);
      } catch(err) {
        UI.toast('导入失败：'+err.message,'error');
      }
    };
    input.click();
  },

  async _exportCSV() {
    const stores = ['timers','emotions','workouts','link_records','books'];
    UI.modal('导出 CSV', `
      <p class="text-soft text-sm mb-3">选择要导出的数据表：</p>
      <div class="flex flex-col gap-2">
        ${stores.map(s => `
          <div class="list-item" style="cursor:pointer" onclick="SettingsModule._doExportCSV('${s}')">
            <div class="list-item__main"><div class="list-item__title">${s}</div></div>
            <span>导出 →</span>
          </div>
        `).join('')}
      </div>
    `);
  },

  async _doExportCSV(store) {
    const csv = await DB.exportCSV(store);
    if (!csv) { UI.toast('该表无数据','info'); return; }
    const blob = new Blob(['\ufeff'+csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${store}-${todayKey()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    UI.closeModal();
    UI.toast('已导出','success');
  },

  async _requestPersistent() {
    const ok = await DB.requestPersistent();
    if (ok) UI.toast('永久存储已授权','success');
    else UI.toast('授权失败，请手动在浏览器设置中允许','error');
    this.render();
  },

  dataHealth() { this.render(); },
};

/**

 */
const RemindersModule = {
  async render() {
    const reminders = (await DB.list('reminders')).filter(r => !r.deleted_at);
    const pending = reminders.filter(r => !r.completed);
    const completed = reminders.filter(r => r.completed);
    const html = `
      <div class="page">
        <div class="flex justify-between items-center mb-4">
          <div class="page__title" style="margin:0">🔔 提醒中心</div>
          <button class="btn btn--primary btn--sm" onclick="RemindersModule.add()">+ 新建提醒</button>
        </div>

        <div class="card mb-4">
          <div class="card-title">⏰ 待处理 (${pending.length})</div>
          ${pending.length === 0 ? UI.empty('✅','没有待处理提醒') : `
            <div class="flex flex-col gap-2">
              ${pending.sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(r => `
                <div class="list-item">
                  <span style="font-size:20px">${this._icon(r.category)}</span>
                  <div class="list-item__main">
                    <div class="list-item__title">${r.title}</div>
                    <div class="list-item__sub">${r.time?.replace('T',' ')||''} ${r.repeat?'· '+r.repeat:''} ${r.advance_min?'· 提前'+r.advance_min+'分':''}</div>
                  </div>
                  <button class="btn btn--sm btn--ghost" onclick="RemindersModule._done('${r.id}')">✓</button>
                  <button class="btn btn--sm btn--ghost" onclick="RemindersModule._del('${r.id}')">×</button>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        ${completed.length > 0 ? `
          <div class="card">
            <div class="card-title">✅ 已完成 (${completed.length})</div>
            <div class="flex flex-col gap-2">
              ${completed.slice(0,10).map(r => `
                <div class="list-item" style="opacity:0.5">
                  <div class="list-item__main">
                    <div class="list-item__title" style="text-decoration:line-through">${r.title}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
  },

  _icon(cat) {
    return { '工作':'💼','学习':'📚','截止日期':'⏰','休息':'☕','情绪':'🌤️','复盘':'🌙','纪念日':'💝','角色消息':'💬' }[cat] || '🔔';
  },

  async add() {
    UI.modal('新建提醒', `
      <div class="field"><label class="field__label">标题</label><input class="input" id="remTitle"></div>
      <div class="grid grid-2">
        <div class="field"><label class="field__label">类别</label><select class="select" id="remCat">
          <option>工作</option><option>学习</option><option>截止日期</option><option>休息</option>
          <option>情绪</option><option>复盘</option><option>纪念日</option><option>角色消息</option>
        </select></div>
        <div class="field"><label class="field__label">时间</label><input class="input" type="datetime-local" id="remTime"></div>
      </div>
      <div class="grid grid-2">
        <div class="field"><label class="field__label">提前提醒（分钟）</label><input class="input" type="number" id="remAdvance" value="0"></div>
        <div class="field"><label class="field__label">重复</label><select class="select" id="remRepeat">
          <option value="">不重复</option><option>每天</option><option>每周</option><option>每月</option>
        </select></div>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="RemindersModule._save()">保存</button>
      </div>
    `);
  },

  async _save() {
    const title = document.getElementById('remTitle').value.trim();
    if (!title) { UI.toast('请输入标题','error'); return; }
    await DB.save('reminders', {
      title, category: document.getElementById('remCat').value,
      time: document.getElementById('remTime').value,
      advance_min: parseInt(document.getElementById('remAdvance').value)||0,
      repeat: document.getElementById('remRepeat').value,
      completed: false,
    });
    UI.closeModal();
    UI.toast('提醒已创建','success');
    this.render();
  },

  async _done(id) {
    const r = await DB.get('reminders', id);
    if (r) { r.completed = true; r.completed_at = nowISO(); await DB.save('reminders', r); }
    this.render();
  },

  async _del(id) {
    if (!await UI.confirm('删除这条提醒？')) return;
    await DB.hardDelete('reminders', id);
    this.render();
  },

  async checkAll() {
    const reminders = (await DB.list('reminders')).filter(r => !r.deleted_at && !r.completed);
    const now = Date.now();
    for (const r of reminders) {
      if (!r.time) continue;
      const t = new Date(r.time).getTime();
      const advance = (r.advance_min||0) * 60000;
      if (t - advance <= now && t + 3600000 > now) {
        // 在提醒窗口内
        if (!r.notified) {
          UI.toast(`🔔 ${r.title}`, 'info', 5000);
          r.notified = true;
          await DB.save('reminders', r);
        }
      }
    }
    // 定期检查
    if (!this._checkTimer) {
      this._checkTimer = setInterval(() => this.checkAll(), 60000);
    }
  },
};

  // ============ 资料库 ============
  async showLibrary() {

                </div>
                <button class="btn btn--sm btn--ghost" onclick="AIChatModule._editResource('${r.id}')">编辑</button>
                <button class="btn btn--sm btn--ghost" onclick="AIChatModule._exportResource('${r.id}')">导出</button>
                <button class="btn btn--sm btn--ghost" onclick="AIChatModule._delResource('${r.id}')">×</button>
              </div>
            `).join('')}
          </div>
        `;
      }).join('')}
    `);
  },

  async _addResource(kind, kindName, editId) {
    const fields = this._getResourceFields(kind);
    const editing = editId ? await DB.get('ai_resources', editId) : null;
    const existingData = editing?.data || {};
    const existingName = editing?.name || '';

    // 世界书特殊处理：元信息表单 + 条目列表
    if (kind === 'lorebook') {
      this._showLorebookEditor(editId, existingData, existingName);
      return;
    }

    // 按分组渲染
    const groups = {};
    fields.forEach(f => {
      const g = f.group || '默认';
      if (!groups[g]) groups[g] = [];
      groups[g].push(f);
    });

    const fieldsHtml = Object.entries(groups).map(([groupName, groupFields]) => `
      <div class="field-group">
        <div class="field-group__title">${groupName}</div>
        ${groupFields.map(f => {
          const val = existingData[f.key] || '';
          const valAttr = val ? `data-existing="${this._escapeAttr(val)}"` : '';
          if (f.type === 'select') {
            return `<div class="field">
              <label class="field__label">${f.label}${f.required?' <span style="color:var(--color-accent)">*</span>':''}</label>
              <select class="select" id="rf_${f.key}" ${valAttr}>
                <option value="">请选择</option>
                ${(f.options||[]).map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
              </select>
              ${f.hint?`<div class="field__hint">${f.hint}</div>`:''}
            </div>`;
          }
          if (f.type === 'textarea') {
            return `<div class="field">
              <label class="field__label">${f.label}${f.required?' <span style="color:var(--color-accent)">*</span>':''}</label>
              <textarea class="textarea" id="rf_${f.key}" placeholder="${f.hint||''}" ${valAttr}>${this._escapeHtml(val)}</textarea>
            </div>`;
          }
          return `<div class="field">
            <label class="field__label">${f.label}${f.required?' <span style="color:var(--color-accent)">*</span>':''}</label>
            <input class="input" id="rf_${f.key}" placeholder="${f.hint||''}" value="${this._escapeAttr(val)}">
          </div>`;
        }).join('')}
      </div>
    `).join('');

    UI.modal(`${kindName} - ${editing?'编辑':'文字新建'}`, `
      <p class="text-soft text-sm mb-3">逐项填写，缺项留空，不编造。确认后转为统一 JSON。</p>
      ${fieldsHtml}
      <div class="field"><label class="field__label">资源名称</label><input class="input" id="rf_name" value="${this._escapeAttr(existingName)}" placeholder="给这个资料起个名字"></div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="AIChatModule._saveResource('${kind}', ${editId?`'${editId}'`:'null'})">保存</button>

    `);
  },

  async _editResource(id) {
    const r = await DB.get('ai_resources', id);
    if (!r) return;
    const kindNames = { character:'对方角色卡', persona:'我的角色卡', preset:'预设', lorebook:'世界书', longMemory:'手工长记忆' };
    this._addResource(r.kind, kindNames[r.kind] || r.kind, id);
  },

  _escapeAttr(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  },

  // ============ 世界书条目管理 ============
  _showLorebookEditor(editId, existingData, existingName) {
    const entries = existingData.entries || [];
    const desc = existingData.description || '';
    const defaultPos = existingData.default_insert_position || 'system';

    window._tempLorebookEntries = JSON.parse(JSON.stringify(entries));

    UI.modal(`世界书 - ${editId?'编辑':'文字新建'}`, `
      <div class="field">
        <label class="field__label">资源名称</label>
        <input class="input" id="rf_name" value="${this._escapeAttr(existingName)}" placeholder="给这本世界书起个名字">
      </div>
      <div class="field">
        <label class="field__label">世界书描述</label>
        <textarea class="textarea" id="rf_description" placeholder="这本世界书的整体说明">${this._escapeHtml(desc)}</textarea>
      </div>
      <div class="field">
        <label class="field__label">默认插入位置</label>
        <select class="select" id="rf_default_insert_position">
          <option value="system" ${defaultPos==='system'?'selected':''}>system（系统提示中）</option>
          <option value="before_last" ${defaultPos==='before_last'?'selected':''}>before_last（最后一条消息前）</option>
          <option value="after_last" ${defaultPos==='after_last'?'selected':''}>after_last（最后一条消息后）</option>
        </select>
      </div>

      <div class="field-group mt-4">
        <div class="field-group__title flex justify-between items-center">
          <span>条目列表 (${entries.length})</span>
          <button class="btn btn--sm btn--ghost" onclick="AIChatModule._addLorebookEntry()">+ 添加条目</button>
        </div>
        <div id="lorebookEntriesList" class="lorebook-entries">
          ${entries.length === 0 ? '<p class="text-faint text-xs">还没有条目，点击「添加条目」创建</p>' : ''}
        </div>
      </div>

      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="AIChatModule._saveLorebook(${editId?`'${editId}'`:'null'})">保存</button>
      </div>
    `);

    // 渲染已有条目
    this._renderLorebookEntries();
  },

  _renderLorebookEntries() {
    const container = document.getElementById('lorebookEntriesList');
    if (!container) return;
    const entries = window._tempLorebookEntries || [];
    if (entries.length === 0) {
      container.innerHTML = '<p class="text-faint text-xs">还没有条目，点击「添加条目」创建</p>';
      return;
    }
    container.innerHTML = entries.map((e, i) => `
      <div class="card--blur" style="padding:10px;margin-bottom:8px">
        <div class="flex justify-between items-center mb-1">
          <div class="font-bold text-sm">${e.entry_title || '未命名条目'}</div>
          <div class="flex gap-1">
            <button class="btn btn--sm btn--ghost" onclick="AIChatModule._editLorebookEntry(${i})">编辑</button>
            <button class="btn btn--sm btn--ghost" onclick="AIChatModule._delLorebookEntry(${i})">×</button>
          </div>

  _addLorebookEntry() {
    window._tempLorebookEntries = window._tempLorebookEntries || [];
    window._tempLorebookEntries.push({
      entry_title: '', entry_content: '', trigger_type: '关键词触发（keyword）',
      keywords: '', priority: '10', insert_position: 'system', enabled: '启用',
      applicable_characters: '', world_rules: '', locations: '', organizations: '',
      character_relations: '', historical_events: '',
    });
    this._editLorebookEntry(window._tempLorebookEntries.length - 1);
  },

  _editLorebookEntry(idx) {
    const entry = window._tempLorebookEntries[idx];
    if (!entry) return;
    const fields = this._lorebookEntrySchema;
    UI.modal(`编辑条目 ${idx+1}`, `
      ${fields.map(f => {
        const val = entry[f.key] || '';
        if (f.type === 'select') {
          return `<div class="field"><label class="field__label">${f.label}</label>
            <select class="select" id="lbe_${f.key}">
              <option value="">请选择</option>
              ${(f.options||[]).map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
            </select>${f.hint?`<div class="field__hint">${f.hint}</div>`:''}</div>`;
        }
        if (f.type === 'textarea') {
          return `<div class="field"><label class="field__label">${f.label}</label>
            <textarea class="textarea" id="lbe_${f.key}" placeholder="${f.hint||''}">${this._escapeHtml(val)}</textarea></div>`;
        }
        return `<div class="field"><label class="field__label">${f.label}</label>
          <input class="input" id="lbe_${f.key}" value="${this._escapeAttr(val)}" placeholder="${f.hint||''}"></div>`;
      }).join('')}
      <div class="flex gap-3 mt-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="AIChatModule._saveLorebookEntry(${idx})">保存条目</button>
      </div>
    `);
  },

  _saveLorebookEntry(idx) {
    const fields = this._lorebookEntrySchema;
    const entry = {};
    fields.forEach(f => {
      const el = document.getElementById(`lbe_${f.key}`);
      if (el && el.value.trim()) entry[f.key] = el.value.trim();
    });
    window._tempLorebookEntries[idx] = entry;
    UI.closeModal();
    this._renderLorebookEntries();
  },

  _delLorebookEntry(idx) {
    window._tempLorebookEntries.splice(idx, 1);
    this._renderLorebookEntries();
  },

    return this._schemas[kind] || [{ key: 'name_field', label: '姓名/昵称', type: 'input' }];

  async _saveResource(kind, editId) {
    const name = document.getElementById('rf_name').value.trim() || `${kind}-${Date.now()}`;
    const fields = this._getResourceFields(kind);
    const data = {};
    fields.forEach(f => {
      const el = document.getElementById(`rf_${f.key}`);
      if (el && el.value.trim()) data[f.key] = el.value.trim();
    });
    const resource = {
      $schema: 'workbuddy-ai-resource-v1',
      kind,
      name,
      version: 1,
      data,
      source: {
        type: 'manual-text',
        originalText: JSON.stringify(data, null, 2),
        createdAt: nowISO(),
      },
    };
    if (editId) resource.id = editId;
    await DB.save('ai_resources', resource);
    UI.closeModal();
    UI.toast('资料已保存','success');
    this.showLibrary();
  },

  async _importResource(kind) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      try {
        const parsed = JSON.parse(text);
        // 兼容多种格式
        const resource = {
          $schema: 'workbuddy-ai-8resource-v1',
          kind,
          name: parsed.name || parsed.data?.name || file.name,
          version: 1,
          data: parsed.data || parsed,
          source: {
            type: 'imported-json',
            originalText: text,
            createdAt: nowISO(),
          },
        };
        await DB.save('ai_resources', resource);
        UI.toast('已导入','success');
        this.showLibrary();
      } catch(err) {
        UI.toast('导入失败：'+err.message,'error');
      }
    };
    input.click();
  },

  async _exportResource(id) {
    const r = await DB.get('ai_resources', id);
    if (!r) return;
    const blob = new Blob([JSON.stringify(r, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${r.name}.json`;
    a.click();
    URL.revokeObjectURL(url);
    UI.toast('已导出','success');
  },

  async _delResource(id) {
    if (!await UI.confirm('删除这个资料？')) return;
    await DB.hardDelete('ai_resources', id);
    this.showLibrary();
  },

  async _encryptKey(key) {
    // 简单的 Web Crypto 加密（AES-GCM）
    try {
      const enc = new TextEncoder();
      const data = enc.encode(key);
      // 使用固定派生密钥（仅为 obfuscation，非真正安全）
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode('zhaozhao-station-key'), 'PBKDF2', false, ['deriveKey']);
      const cryptoKey = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: enc.encode('salt-zhaozhao'), iterations: 10000, hash: 'SHA-256' },
        keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt']
      );
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, data);
      return btoa(String.fromCharCode(...iv, ...new Uint8Array(encrypted)));
    } catch(e) {
      return btoa(key);  // fallback
    }
  },

  async _decryptKey(encStr) {
    try {
      const raw = atob(encStr);
      const bytes = new Uint8Array([...raw].map(c=>c.charCodeAt(0)));
      const iv = bytes.slice(0, 12);
      const data = bytes.slice(12);
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode('zhaozhao-station-key'), 'PBKDF2', false, ['deriveKey']);
      const cryptoKey = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: enc.encode('salt-zhaozhao'), iterations: 10000, hash: 'SHA-256' },
        keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, cryptoKey, data);
      return new TextDecoder().decode(decrypted);
    } catch(e) {
      return atob(encStr);
    }
  },

  // ============ 多供应商 API 调用（含流式）============
  async _callAPI(conn, messages, apiKey, opts = {}) {
    if (opts.stream) {
      return this._callAPIStream(conn, messages, apiKey, opts);
    }
    const provider = conn.provider;
    const base = conn.base_url;
    const model = conn.model;

    if (provider === 'anthropic') {
      const sysMsg = messages.find(m => m.role === 'system');
      const userMsgs = messages.filter(m => m.role !== 'system');
      const resp = await fetch(`${base}/v1/messages`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json; charset=utf-8',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model, max_tokens: conn.max_tokens||2048, temperature: conn.temperature||0.8,
          system: sysMsg?.content || '',
          messages: userMsgs.map(m => ({ role: m.role, content: m.content })),
        }),
      });
      if (!resp.ok) throw new Error(this._explainError(resp.status, await resp.text()));
      const data = await resp.json();
      return data.content?.[0]?.text || '';
    }

    if (provider === 'gemini') {
      const contents = messages.filter(m => m.role !== 'system').map(m => ({
        role: m.role === 'assistant' ? 'model' : 'user',
        parts: [{ text: m.content }],
      }));
      const sysMsg = messages.find(m => m.role === 'system');
      const url = `${base}/v1beta/models/${model}:generateContent?key=${apiKey}`;
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify({
          contents,
          systemInstruction: sysMsg ? { parts: [{ text: sysMsg.content }] } : undefined,
          generationConfig: { temperature: conn.temperature||0.8, maxOutputTokens: conn.max_tokens||2048 },
        }),
      });
      if (!resp.ok) throw new Error(this._explainError(resp.status, await resp.text()));
      const data = await resp.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    }

    // OpenAI-compatible
    const resp = await fetch(`${base}/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json; charset=utf-8',
        'Authorization': `Bearer ${apiKey}`,
      },
      body: JSON.stringify({
        model, messages, temperature: conn.temperature||0.8, max_tokens: conn.max_tokens||2048,
        stream: false,
      }),
    });
    if (!resp.ok) throw new Error(this._explainError(resp.status, await resp.text()));
    const data = await resp.json();
    return data.choices?.[0]?.message?.content || '';
  },

  // ============ 流式 API ============
  async _callAPIStream(conn, messages, apiKey, opts = {}) {
    const { onChunk, onDone, onError } = opts;
    this._abortController = new AbortController();
    const signal = this._abortController.signal;
    try {
      if (conn.provider === 'anthropic') {
        return await this._streamAnthropic(conn, messages, apiKey, signal, opts);
      }
      if (conn.provider === 'gemini') {
        return await this._streamGemini(conn, messages, apiKey, signal, opts);
      }
      return await this._streamOpenAI(conn, messages, apiKey, signal, opts);
    } catch (err) {
      if (err.name === 'AbortError') {
        if (onDone) onDone(opts._accumulated || '');
        return opts._accumulated || '';
      }
      if (onError) onError(err);
      throw err;
    } finally {
      this._abortController = null;
    }
  },

  async _streamOpenAI(conn, messages, apiKey, signal, opts) {
    const { onChunk, onDone } = opts;
    const resp = await fetch(`${conn.base_url}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({ model: conn.model, messages, temperature: conn.temperature||0.8, max_tokens: conn.max_tokens||2048, stream: true }),
      signal,
    });
    if (!resp.ok) throw new Error(this._explainError(resp.status, await resp.text()));
    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '', fullText = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith('data: ')) continue;
        const data = trimmed.slice(6);
        if (data === '[DONE]') continue;
        try {
          const parsed = JSON.parse(data);
          const delta = parsed.choices?.[0]?.delta?.content || '';
          if (delta) {
            fullText += delta;
            opts._accumulated = fullText;
            if (onChunk) onChunk(delta, fullText);
          }
        } catch (e) { /* ignore */ }
      }
    }
    if (onDone) onDone(fullText);
    return fullText;
  },

  async _streamAnthropic(conn, messages, apiKey, signal, opts) {
    const { onChunk, onDone } = opts;
    const sysMsg = messages.find(m => m.role === 'system');
    const userMsgs = messages.filter(m => m.role !== 'system');
    const resp = await fetch(`${conn.base_url}/v1/messages`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json; charset=utf-8',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: conn.model, max_tokens: conn.max_tokens||2048, temperature: conn.temperature||0.8,
        system: sysMsg?.content || '',
        messages: userMsgs.map(m => ({ role: m.role, content: m.content })),
        stream: true,
      }),
      signal,
    });
    if (!resp.ok) throw new Error(this._explainError(resp.status, await resp.text()));
    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '', fullText = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data: ')) continue;
        try {
          const parsed = JSON.parse(trimmed.slice(6));
          if (parsed.type === 'content_block_delta' && parsed.delta?.text) {
            fullText += parsed.delta.text;
            opts._accumulated = fullText;
            if (onChunk) onChunk(parsed.delta.text, fullText);
          }
        } catch (e) { /* ignore */ }
      }
    }
    if (onDone) onDone(fullText);
    return fullText;
  },

  async _streamGemini(conn, messages, apiKey, signal, opts) {
    const { onChunk, onDone } = opts;
    const contents = messages.filter(m => m.role !== 'system').map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }],
    }));
    const sysMsg = messages.find(m => m.role === 'system');
    const url = `${conn.base_url}/v1beta/models/${conn.model}:streamGenerateContent?key=${apiKey}&alt=sse`;
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify({
        contents,
        systemInstruction: sysMsg ? { parts: [{ text: sysMsg.content }] } : undefined,
        generationConfig: { temperature: conn.temperature||0.8, maxOutputTokens: conn.max_tokens||2048 },
      }),
      signal,
    });
    if (!resp.ok) throw new Error(this._explainError(resp.status, await resp.text()));
    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '', fullText = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data: ')) continue;
        try {
          const parsed = JSON.parse(trimmed.slice(6));
          const text = parsed.candidates?.[0]?.content?.parts?.[0]?.text || '';
          if (text) {
            fullText += text;
            opts._accumulated = fullText;
            if (onChunk) onChunk(text, fullText);
          }
        } catch (e) { /* ignore */ }
      }
    }
    if (onDone) onDone(fullText);
    return fullText;
  },

  _stopGeneration() {
    if (this._abortController) {
      this._abortController.abort();
      UI.toast('已停止生成', 'info', 1500);
    }
  },

  _explainError(status, err) {
    const map = {
      401: 'API Key 无效或未授权（401）',
      403: '访问被禁止（403），可能需要配置 Relay',
      404: '接口地址或模型不存在（404）',
      405: '请求方法不允许（405）',
      429: '请求过多或额度不足（429）',
    };
    let msg = map[status] || `HTTP ${status}`;
    if (err.includes('CORS') || err.includes('Failed to fetch')) {
      msg += '。可能是浏览器 CORS 限制，需配置安全后端 Relay。';
    }
    return msg;
  },

  // 删除对话（二次确认 + 软删除，连同其下所有消息）
  async _confirmDelConv(convId, title) {
    // 第一次确认
    const ok1 = await UI.confirm(
      `确定要删除对话「${title}」吗？<br><br>将同时删除该对话下的所有消息。此操作不可撤销。`,
      { title: '删除对话', okText: '继续删除' }
    );
    if (!ok1) return;

    // 第二次确认（防止误操作）
    const ok2 = await UI.confirm(
      `再次确认：真的要永久删除「${title}」吗？<br><br>建议先到「设置 → 数据备份」导出 JSON 备份。`,
      { title: '最后确认', okText: '确认删除' }
    );
    if (!ok2) return;

    // 执行删除：软删除对话 + 硬删除其下消息
    const conv = await DB.get('ai_conversations', convId);
    if (conv) {
      conv.deleted_at = nowISO();
      await DB.save('ai_conversations', conv);
    }
    const msgs = (await DB.list('ai_messages')).filter(m => !m.deleted_at && m.conversation_id === convId);
    for (const m of msgs) {
      await DB.hardDelete('ai_messages', m.id);
    }
    // 删除书签中对应该对话的引用
    const bks = (await DB.list('bookmarks')).filter(b => b.conversation_id === convId);
    for (const b of bks) await DB.hardDelete('bookmarks', b.id);

    await DB.log('ai_conversation_deleted', { id: convId, title, message_count: msgs.length });
    UI.toast(`已删除「${title}」（${msgs.length} 条消息）`, 'success');
    this.render();
  },
