/* ============================================================
   昭昭专属个人站 - 样式系统
   粉色 Ins 风 · 温柔浪漫 · 圆角卡片 · 磨砂质感
   ============================================================ */

/* ============ 主题变量 ============ */
:root {
  /* 主色 - 浅色模式 */
  --color-bg: #F8F5F0;          /* 梨花白 */
  --color-bg-alt: #FBF7F3;
  --color-surface: #FFFFFF;
  --color-surface-blur: rgba(255,255,255,0.72);
  --color-primary: #8A4E7B;     /* 雾感紫调豆沙 */
  --color-primary-soft: #B68AA8;
  --color-rose: #F194A6;        /* 玫瑰粉 */
  --color-rose-soft: #F8C5CE;
  --color-accent: #DB5A6B;      /* 海棠红 */
  --color-wisteria: #BBA4D9;    /* 紫藤 */
  --color-text: #4A3B45;
  --color-text-soft: #8B7A85;
  --color-text-faint: #B5A8B0;
  --color-border: #EDE4E8;
  --color-divider: #F0E8EC;
  --color-success: #7EC8A0;
  --color-warning: #F5B97A;
  --color-danger: #E07080;
  --color-info: #8AB8D8;

  /* 间距与圆角 */
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --shadow-sm: 0 2px 8px rgba(138,78,123,0.06);
  --shadow-md: 0 4px 16px rgba(138,78,123,0.10);
  --shadow-lg: 0 8px 32px rgba(138,78,123,0.14);

  /* 字体 */
  --font-main: '楷体', 'KaiTi', 'STKaiti', 'Noto Serif SC', serif;
  --font-size-base: 16px;  /* 三号字体偏大 */
  --font-size-sm: 14px;
  --font-size-xs: 12px;
  --font-size-lg: 18px;
  --font-size-xl: 22px;
  --font-size-2xl: 28px;

  /* 布局 */
  --nav-width: 220px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* 柔和深色模式 */
[data-theme="dark"] {
  --color-bg: #2A2330;
  --color-bg-alt: #322A3B;
  --color-surface: #3A3142;
  --color-surface-blur: rgba(58,49,66,0.78);
  --color-primary: #C99AC0;
  --color-primary-soft: #9E6E96;
  --color-rose: #E8A0AC;
  --color-rose-soft: #6A4555;
  --color-accent: #E07080;
  --color-wisteria: #C9B0E8;
  --color-text: #EDE0E8;
  --color-text-soft: #B5A8B8;
  --color-text-faint: #807088;
  --color-border: #4A4055;
  --color-divider: #423850;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.28);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.36);
}

/* 界面密度 - 紧凑 */
[data-density="compact"] {
  --radius-md: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 4px rgba(138,78,123,0.05);
}

/* ============ 基础重置 ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: var(--font-size-base); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font-main);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
  font-size: var(--font-size-base);
}

/* 背景装饰 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(241,148,166,0.08), transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(187,164,217,0.08), transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(138,78,123,0.03), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--color-primary); text-decoration: none; }
ul, ol { list-style: none; }

/* ============ 布局 ============ */
.app-shell {
  display: flex;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* 左侧导航 - 桌面端 */
.side-nav {
  width: var(--nav-width);
  background: var(--color-surface-blur);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--color-border);
  padding: calc(20px + var(--safe-top)) 14px 20px;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  overflow-y: auto;
  z-index: 100;
  transition: transform 0.3s ease;
}

.side-nav__brand {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px 18px;
  border-bottom: 1px solid var(--color-divider);
  margin-bottom: 14px;
}
.side-nav__brand-icon { font-size: 28px; }
.side-nav__brand-name { font-size: var(--font-size-lg); font-weight: 600; color: var(--color-primary); }
.side-nav__brand-sub { font-size: var(--font-size-xs); color: var(--color-text-faint); display: block; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 11px 14px;
  border-radius: var(--radius-md);
  color: var(--color-text-soft);
  font-size: var(--font-size-base);
  margin-bottom: 4px;
  transition: all 0.2s;
  text-align: left;
}
.nav-item:hover { background: var(--color-divider); color: var(--color-text); }
.nav-item.active {
  background: linear-gradient(135deg, var(--color-rose-soft), var(--color-wisteria));
  color: var(--color-primary);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}
.nav-item__icon { font-size: 20px; flex-shrink: 0; }
.nav-item__label { flex: 1; }

.main-area {
  flex: 1;
  margin-left: var(--nav-width);
  padding: calc(24px + var(--safe-top)) 28px calc(28px + var(--safe-bottom));
  min-width: 0;
}

/* ============ 手机端底部导航 ============ */
.bottom-nav { display: none; }

@media (max-width: 768px) {
  .side-nav { display: none; }
  .main-area {
    margin-left: 0;
    padding: calc(16px + var(--safe-top)) 14px calc(90px + var(--safe-bottom));
  }
  .bottom-nav {
    display: flex;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--color-surface-blur);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--color-border);
    padding: 8px 4px calc(8px + var(--safe-bottom));
    z-index: 100;
    justify-content: space-around;
  }
  .bottom-nav__item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 8px;
    border-radius: var(--radius-md);
    color: var(--color-text-faint);
    font-size: var(--font-size-xs);
    flex: 1;
    max-width: 72px;
  }
  .bottom-nav__item.active { color: var(--color-primary); }
  .bottom-nav__item__icon { font-size: 22px; }
}

/* ============ 卡片 ============ */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--color-border);
}
.card--blur {
  background: var(--color-surface-blur);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.card-title { font-size: var(--font-size-lg); font-weight: 600; color: var(--color-primary); display: flex; align-items: center; gap: 8px; }

/* ============ 按钮 ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 20px;
  border-radius: var(--radius-md);
  font-size: var(--font-size-base);
  background: var(--color-surface);
  color: var(--color-text);
  border: 1px solid var(--color-border);
  transition: all 0.2s;
  min-height: 42px;
}
.btn:hover { background: var(--color-divider); }
.btn:active { transform: scale(0.97); }
.btn--primary { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
.btn--primary:hover { background: var(--color-primary-soft); }
.btn--rose { background: var(--color-rose); color: #fff; border-color: var(--color-rose); }
.btn--accent { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--color-primary); }
.btn--sm { padding: 6px 14px; min-height: 34px; font-size: var(--font-size-sm); }
.btn--lg { padding: 14px 28px; min-height: 50px; font-size: var(--font-size-lg); }
.btn--block { width: 100%; }
.btn--icon { padding: 10px; min-width: 42px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============ 表单 ============ */
.input, .textarea, .select {
  width: 100%;
  padding: 11px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  background: var(--color-bg-alt);
  font-size: var(--font-size-base);
  transition: border-color 0.2s;
  min-height: 42px;
}
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--color-rose);
  background: var(--color-surface);
}
.textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
.field { margin-bottom: 14px; }
.field__label { display: block; font-size: var(--font-size-sm); color: var(--color-text-soft); margin-bottom: 6px; font-weight: 500; }
.field__hint { font-size: var(--font-size-xs); color: var(--color-text-faint); margin-top: 4px; }

/* 复选/标签选择 */
.tag-select { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-chip {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--color-border);
  background: var(--color-bg-alt);
  font-size: var(--font-size-sm);
  cursor: pointer;
  transition: all 0.2s;
}
.tag-chip.active {
  background: var(--color-rose-soft);
  border-color: var(--color-rose);
  color: var(--color-primary);
}

/* ============ 工具类 ============ */
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; }
.flex-wrap { flex-wrap: wrap; }
.flex-1 { flex: 1; }
.text-center { text-align: center; }
.text-soft { color: var(--color-text-soft); }
.text-faint { color: var(--color-text-faint); }
.text-sm { font-size: var(--font-size-sm); }
.text-xs { font-size: var(--font-size-xs); }
.text-lg { font-size: var(--font-size-lg); }
.text-xl { font-size: var(--font-size-xl); }
.text-2xl { font-size: var(--font-size-2xl); }
.font-bold { font-weight: 600; }
.mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; } .mb-6 { margin-bottom: 24px; }
.mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mt-6 { margin-top: 24px; }
.hidden { display: none !important; }
.w-full { width: 100%; }

/* ============ 页面容器 ============ */
.page { animation: fadeIn 0.3s ease; }
.page__title {
  font-size: var(--font-size-xl);
  color: var(--color-primary);
  margin-bottom: 18px;
  display: flex; align-items: center; gap: 10px;
}
.page__subtitle { font-size: var(--font-size-sm); color: var(--color-text-soft); margin-bottom: 20px; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ 装饰元素 ============ */
.deco-butterfly, .deco-heart, .deco-moon, .deco-star {
  position: fixed;
  pointer-events: none;
  opacity: 0.15;
  z-index: 0;
  font-size: 24px;
  animation: float 8s ease-in-out infinite;
}
.deco-heart { top: 12%; right: 8%; animation-delay: 0s; }
.deco-butterfly { top: 30%; left: 4%; animation-delay: 2s; }
.deco-moon { bottom: 18%; right: 5%; animation-delay: 4s; }
.deco-star { top: 55%; right: 12%; animation-delay: 1s; }

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-16px) rotate(8deg); }
}

/* ============ 空状态 ============ */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--color-text-faint);
}
.empty-state__icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
.empty-state__text { font-size: var(--font-size-sm); }

/* ============ 模态框 ============ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(74,59,69,0.4);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0;

  <div id="app">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column">
      <div style="font-size:48px;margin-bottom:16px">🌸</div>
      <div class="spinner"></div>
      <p style="color:var(--color-text-soft);margin-top:16px;font-size:14px">正在加载昭昭专属个人站…</p>

  <script>
// === js/db.js ===
/**
 * 昭昭专属个人站 - 数据持久化层
 * 基于 IndexedDB，固定数据库名称，支持版本迁移
 *
 * 核心原则：
 * - 界面与数据彻底分离，升级只改界面不改数据
 * - 启动时已有数据只读取不覆盖
 * - 每次迁移前自动备份
 * - 数据库/表名/键名一经确定不随意改变
 */

// ============ 常量定义（固定身份，不得随意修改） ============
const DB_NAME = 'zhaozhao_station_db';       // 固定数据库名
const DB_VERSION = 1;                          // 数据版本号
const LS_PREFIX = 'zhaozhao_';                 // localStorage 键前缀
const BACKUP_PREFIX = 'zhaozhao_backup_';      // 备份键前缀

// ============ 数据表定义 ============
// 每个表的 keyPath 为 'id'，所有记录使用 UUID
const STORE_DEFS = [
  { name: 'settings',        keyPath: 'key' },           // 设置（key-value）
  { name: 'tasks',           keyPath: 'id' },            // 待办任务
  { name: 'timers',          keyPath: 'id' },            // 计时记录（已结束）
  { name: 'timer_running',   keyPath: 'id' },            // 运行中的计时器
  { name: 'projects',        keyPath: 'id' },            // 项目
  { name: 'project_tasks',   keyPath: 'id' },            // 项目子任务
  { name: 'books',           keyPath: 'id' },            // 书籍
  { name: 'book_notes',      keyPath: 'id' },            // 阅读笔记/摘录
  { name: 'workouts',        keyPath: 'id' },            // 锻炼记录
  { name: 'emotions',        keyPath: 'id' },            // 情绪记录
  { name: 'reviews',         keyPath: 'id' },            // 每日复盘
  { name: 'link_profiles',   keyPath: 'id' },            // 灵魂链接对象档案
  { name: 'link_records',    keyPath: 'id' },            // 灵魂链接记录
  { name: 'link_daily_status', keyPath: 'id' },          // 每日链接状态
  { name: 'link_wishes',     keyPath: 'id' },            // 链接星图愿望
  { name: 'link_wish_events', keyPath: 'id' },           // 愿望后续事件
  { name: 'link_treasures',  keyPath: 'id' },            // 宝物袋
  { name: 'card_decks',      keyPath: 'id' },            // 字卡卡组
  { name: 'card_items',      keyPath: 'id' },            // 字卡
  { name: 'card_draws',      keyPath: 'id' },            // 抽卡记录
  { name: 'ai_resources',    keyPath: 'id' },            // AI 资料（角色卡/预设/世界书/长记忆）
  { name: 'ai_connections',  keyPath: 'id' },            // AI 连接配置
  { name: 'ai_conversations', keyPath: 'id' },           // 对话
  { name: 'ai_messages',     keyPath: 'id' },            // 对话消息
  { name: 'ai_branches',     keyPath: 'id' },            // 分支记录
  { name: 'ai_memories',     keyPath: 'id' },            // 长记忆
  { name: 'ai_proactive',    keyPath: 'id' },            // 角色主动消息
  { name: 'reminders',       keyPath: 'id' },            // 提醒
  { name: 'attachments',     keyPath: 'id' },            // 附件/图片
  { name: 'relations',       keyPath: 'id' },            // 关联关系
  { name: 'bookmarks',       keyPath: 'id' },            // 书签收藏
  { name: 'audit_log',       keyPath: 'id' },            // 审计日志
  { name: 'backups_meta',    keyPath: 'id' },            // 备份元数据
];

// ============ 工具函数 ============
function uuid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function nowISO() {
  return new Date().toISOString();
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ============ IndexedDB 封装 ============
let _db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (_db) { resolve(_db); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = (event) => {
      const db = req.result;
      const oldVersion = event.oldVersion;
      // 创建所有表（仅在不存在时创建）
      STORE_DEFS.forEach(def => {
        if (!db.objectStoreNames.contains(def.name)) {
          db.createObjectStore(def.name, { keyPath: def.keyPath });
        }
      });
      // 记录迁移日志
      console.log(`[DB] 升级: ${oldVersion} -> ${DB_VERSION}`);
    };

    req.onsuccess = () => {
      _db = req.result;
      _db.onversionchange = () => { _db.close(); _db = null; };
      resolve(_db);
    };
    req.onerror = () => reject(req.error);
  });
}

function txStore(storeName, mode = 'readonly') {
  return _db.transaction(storeName, mode).objectStore(storeName);
}

function dbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const store = txStore(storeName);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function dbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    const store = txStore(storeName);
    const req = store.get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(storeName, value) {
  return new Promise((resolve, reject) => {
    const store = txStore(storeName, 'readwrite');
    const req = store.put(value);
    req.onsuccess = () => resolve(value);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    const store = txStore(storeName, 'readwrite');
    const req = store.delete(key);
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}

function dbClear(storeName) {
  return new Promise((resolve, reject) => {
    const store = txStore(storeName, 'readwrite');
    const req = store.clear();
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}

function dbCount(storeName) {
  return new Promise((resolve, reject) => {
    const store = txStore(storeName);
    const req = store.count();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// ============ 高级 API ============
const DB = {
  name: DB_NAME,
  version: DB_VERSION,

  async init() {
    await openDB();
    console.log(`[DB] 已打开: ${DB_NAME} v${DB_VERSION}`);
    // 检查是否首次使用
    const settings = await dbGetAll('settings');
    return settings.length === 0;
  },

  async isNewUser() {
    const settings = await dbGetAll('settings');
    return settings.length === 0;
  },

  // 设置
  async getSetting(key, defaultVal = null) {
    const r = await dbGet('settings', key);
    return r ? r.value : defaultVal;
  },
  async setSetting(key, value) {
    await dbPut('settings', { key, value, updated_at: nowISO() });
    return value;
  },
  async getAllSettings() {
    const arr = await dbGetAll('settings');
    const obj = {};
    arr.forEach(s => obj[s.key] = s.value);
    return obj;
  },

  // 通用 CRUD
  async list(storeName) { return dbGetAll(storeName); },
  async get(storeName, id) { return dbGet(storeName, id); },
  async save(storeName, record) {
    if (!record.id) record.id = uuid();
    record.updated_at = nowISO();
    if (!record.created_at) record.created_at = nowISO();
    if (!record.data_version) record.data_version = DB_VERSION;
    if (!record.deleted_at) record.deleted_at = null;
    await dbPut(storeName, record);
    return record;
  },
  async softDelete(storeName, id) {
    const r = await dbGet(storeName, id);
    if (r) { r.deleted_at = nowISO(); await dbPut(storeName, r); }
    return true;
  },
  async hardDelete(storeName, id) { return dbDelete(storeName, id); },
  async count(storeName) { return dbCount(storeName); },

  // ============ 备份与恢复 ============
  async createBackup(reason = 'manual') {
    const ts = nowISO();
    const backupId = `${BACKUP_PREFIX}${ts.replace(/[:.]/g, '-')}`;
    const allData = {};
    for (const def of STORE_DEFS) {
      if (def.name === 'backups_meta') continue;
      allData[def.name] = await dbGetAll(def.name);
    }
    const meta = {
      id: backupId,
      created_at: ts,
      reason,
      data: allData,
      store_count: Object.keys(allData).length,
      record_count: Object.values(allData).reduce((s, a) => s + a.length, 0),
    };
    await dbPut('backups_meta', meta);
    // 保留最近 10 份
    const allBackups = (await dbGetAll('backups_meta')).sort((a,b) => b.created_at.localeCompare(a.created_at));
    for (let i = 10; i < allBackups.length; i++) {
      await dbDelete('backups_meta', allBackups[i].id);
    }
    return meta;
  },

  async listBackups() {
    return (await dbGetAll('backups_meta')).sort((a,b) => b.created_at.localeCompare(a.created_at));
  },

  async restoreBackup(backupId) {
    // 恢复前先备份当前数据
    await this.createBackup('pre-restore');
    const backup = await dbGet('backups_meta', backupId);
    if (!backup) throw new Error('备份不存在');
    for (const def of STORE_DEFS) {
      if (def.name === 'backups_meta') continue;
      await dbClear(def.name);
      const records = backup.data[def.name] || [];
      for (const r of records) {
        await dbPut(def.name, r);
      }
    }
    return backup;
  },

  // 导出 JSON
  async exportJSON() {
    const allData = {};
    for (const def of STORE_DEFS) {
      allData[def.name] = await dbGetAll(def.name);
    }
    return JSON.stringify({
      _meta: {
        app: 'zhaozhao-station',
        version: DB_VERSION,
        exported_at: nowISO(),
        record_count: Object.values(allData).reduce((s,a)=>s+a.length,0),
      },
      data: allData,
    }, null, 2);
  },

  async exportCSV(storeName) {
    const records = await dbGetAll(storeName);
    if (records.length === 0) return '';
    const keys = new Set();
    records.forEach(r => Object.keys(r).forEach(k => keys.add(k)));
    const headers = [...keys];
    const lines = [headers.join(',')];
    records.forEach(r => {
      lines.push(headers.map(h => {
        const v = r[h];
        if (v == null) return '';
        const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
        return `"${s.replace(/"/g, '""')}"`;
      }).join(','));
    });
    return lines.join('\n');
  },

  // 导入 JSON
  async importJSON(jsonStr, mode = 'merge') {
    const parsed = JSON.parse(jsonStr);
    const data = parsed.data || parsed;
    if (mode === 'replace') {
      await this.createBackup('pre-import-replace');
      for (const def of STORE_DEFS) {
        if (def.name === 'backups_meta') continue;
        await dbClear(def.name);
      }
    }
    let count = 0;
    for (const def of STORE_DEFS) {
      if (def.name === 'backups_meta') continue;
      const records = data[def.name] || [];
      for (const r of records) {
        await dbPut(def.name, r);
        count++;
      }
    }
    return count;
  },

  // ============ 数据健康检查 ============
  async healthCheck() {
    const stores = {};
    let totalRecords = 0;
    for (const def of STORE_DEFS) {
      const c = await dbCount(def.name);
      stores[def.name] = c;
      if (def.name !== 'backups_meta') totalRecords += c;
    }
    const backups = await this.listBackups();
    const settings = await this.getSetting('db_initialized_at', null);
    // 估算存储大小
    let estSize = 0;
    try {
      const est = await navigator.storage.estimate();
      estSize = est.usage || 0;
    } catch(e) {}
    return {
      db_name: DB_NAME,
      db_version: DB_VERSION,
      initialized_at: settings,
      last_check: nowISO(),
      stores,
      total_records: totalRecords,
      backup_count: backups.length,
      last_backup: backups[0]?.created_at || null,
      storage_usage: estSize,
      persistent: await this.checkPersistent(),
    };
  },

  async checkPersistent() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        return await navigator.storage.persisted();
      }
    } catch(e) {}
    return false;
  },

  async requestPersistent() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        return await navigator.storage.persist();
      }
    } catch(e) {}
    return false;
  },

  // ============ 每日重置（只重置今日视图，不删历史） ============
  async dailyReset() {
    // 只清除今日任务完成状态标记，不动历史记录
    const today = todayKey();
    const tasks = await dbGetAll('tasks');
    let changed = 0;
    for (const t of tasks) {
      if (t.completed_date && t.completed_date !== today && t.reset_daily) {
        t.completed = false;
        t.completed_date = null;
        t.updated_at = nowISO();
        await dbPut('tasks', t);
        changed++;
      }
    }
    return { reset_count: changed, date: today };
  },

  // 附件存储（图片用 base64 存 IndexedDB）
  async saveAttachment(file, meta = {}) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = async () => {
        const id = uuid();
        const record = {
          id,
          name: file.name,
          type: file.type,
          size: file.size,
          data: reader.result,  // base64 data URL
          ...meta,
          created_at: nowISO(),
        };
        await dbPut('attachments', record);
        resolve(record);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  },

  async getAttachment(id) { return dbGet('attachments', id); },

  // 审计日志
  async log(action, detail = {}) {
    await dbPut('audit_log', {
      id: uuid(),
      action,
      detail,
      created_at: nowISO(),
    });
  },
};

/**
 * 隐私模块独立密码保护
 * 使用 Web Crypto API (SHA-256 + salt) 加密保存
 */
const PrivacyLock = {
  async show(moduleId) {
    const pwd = await DB.getSetting('privacy_password');
    if (!pwd) {
      // 未设密码直接放行
      App.state.privacyUnlocked[moduleId] = true;
      App.navigate(moduleId);
      return;
    }
    const root = document.getElementById('app');
    const existing = document.getElementById('lockOverlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.className = 'lock-screen';
    overlay.id = 'lockOverlay';
    overlay.innerHTML = `
      <div class="lock-screen__icon">🔒</div>
      <div class="lock-screen__title">隐私模块</div>
      <p class="text-soft text-sm mb-4">请输入密码进入「${App.getModuleName(moduleId)}」</p>
      <input class="input lock-screen__input" type="password" id="lockInput" maxlength="8" inputmode="numeric" placeholder="密码">
      <div class="flex gap-3 mt-3" style="width:260px">
        <button class="btn flex-1" onclick="PrivacyLock.cancel()">取消</button>
        <button class="btn btn--primary flex-1" onclick="PrivacyLock.verify('${moduleId}')">解锁</button>
      </div>
      <p class="text-faint text-xs mt-6" id="lockError"></p>
    `;
    root.appendChild(overlay);
    const inp = document.getElementById('lockInput');
    inp.focus();
    inp.onkeydown = (e) => { if (e.key === 'Enter') PrivacyLock.verify(moduleId); };

    // 自动锁定计时（5分钟无操作锁定）
    this._startAutoLock(moduleId);
  },

  async verify(moduleId) {
    const input = document.getElementById('lockInput').value;
    const stored = await DB.getSetting('privacy_password');
    const hash = await this._hash(input);
    if (hash === stored) {
      App.state.privacyUnlocked[moduleId] = true;
      document.getElementById('lockOverlay').remove();
      App.navigate(moduleId);
      UI.toast('已解锁', 'success', 1500);
    } else {
      const err = document.getElementById('lockError');
      err.textContent = '密码错误，请重试';
      err.style.color = 'var(--color-danger)';
      document.getElementById('lockInput').value = '';
    }
  },

  cancel() {
    document.getElementById('lockOverlay')?.remove();
  },

  _startAutoLock(moduleId) {
    if (this._autoLockTimer) clearTimeout(this._autoLockTimer);
    this._autoLockTimer = setTimeout(() => {
      App.state.privacyUnlocked[moduleId] = false;
    }, 5 * 60 * 1000); // 5分钟
  },

  async _hash(pwd) {
    const salt = 'zhaozhao_station_2026';
    const data = new TextEncoder().encode(salt + pwd);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  },

  async setPassword(pwd) {
    if (!pwd) {
      await DB.setSetting('privacy_password', null);
      return;
    }
    const hash = await this._hash(pwd);
    await DB.setSetting('privacy_password', hash);
  },
};

    { id: 'stats',      name: '综合数据统计', icon: '📊', privacy: false },

    { id: 'star-map',   name: '链接星图', icon: '🌟', privacy: true },

    { id: 'ai-chat',    name: '跨维沟通', icon: '💬', privacy: true },
    { id: 'reminders',  name: '提醒中心', icon: '🔔', privacy: false },
  ],

  async init() {
    // 1. 初始化数据库
    const isNew = await DB.init();
    await DB.log('app_init', { is_new_user: isNew });

    // 2. 加载设置
    this.state.settings = await DB.getAllSettings();

    // 3. 判断是否需要向导
    if (isNew || !this.state.settings.wizard_completed) {
      this.state.wizardDone = false;
      await Wizard.start();
      return;
    }

    // 4. 应用主题
    this.applyTheme();
    this.state.wizardDone = true;

    // 5. 每日重置
    await DB.dailyReset();

    // 6. 恢复运行中的计时器
    await TimerModule.restoreRunning();

    // 7. 渲染主界面
    this.renderShell();
    this.navigate(this.state.settings.last_page || 'home');

    // 8. 启动时钟
    this.startClock();

    // 9. 检查提醒
    RemindersModule.checkAll();

    // 10. 装饰元素
    this.addDecorations();
  },

  applyTheme() {
    const s = this.state.settings;
    const theme = s.theme_mode || 'light';
    document.documentElement.setAttribute('data-theme', theme);
    const density = s.density || 'normal';
    document.documentElement.setAttribute('data-density', density);
    if (s.custom_primary) {
      document.documentElement.style.setProperty('--color-primary', s.custom_primary);
    }
    if (s.custom_bg) {
      document.documentElement.style.setProperty('--color-bg', s.custom_bg);
    }
  },

  renderShell() {
    const root = document.getElementById('app');
    const visibleModules = this.modules.filter(m => {
      const hidden = this.state.settings.hidden_modules || [];
      return !hidden.includes(m.id);
    });

    // 桌面端侧边栏
    const navItems = visibleModules.map(m => `
      <button class="nav-item" data-page="${m.id}" onclick="App.navigate('${m.id}')">
        <span class="nav-item__icon">${m.icon}</span>
        <span class="nav-item__label">${this.getModuleName(m.id)}</span>
        ${m.privacy ? '<span class="nav-item__icon" style="font-size:12px;opacity:0.5">🔒</span>' : ''}
      </button>
    `).join('');

    // 手机端底部导航（取前5个常用）
    const bottomModules = ['home', 'timer', 'emotion', 'soul', 'review']
      .map(id => visibleModules.find(m => m.id === id))
      .filter(Boolean);
    const bottomNav = bottomModules.map(m => `
      <button class="bottom-nav__item" data-page="${m.id}" onclick="App.navigate('${m.id}')">
        <span class="bottom-nav__item__icon">${m.icon}</span>
        <span>${this.getModuleName(m.id).slice(0,2)}</span>
      </button>
    `).join('');
    // 更多按钮
    const moreBtn = `
      <button class="bottom-nav__item" onclick="App.openModuleMenu()">
        <span class="bottom-nav__item__icon">☰</span>
        <span>更多</span>
      </button>`;

    root.innerHTML = `
      <div class="app-shell">
        <nav class="side-nav">
          <div class="side-nav__brand">
            <span class="side-nav__brand-icon">🌸</span>
            <div>
              <div class="side-nav__brand-name">${this.state.settings.station_name || '昭昭记录站'}</div>
              <span class="side-nav__brand-sub">${this.state.settings.subtitle || '我的记录空间'}</span>
            </div>
          </div>
          ${navItems}
          <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--color-divider)">
            <button class="nav-item" onclick="App.navigate('settings')">
              <span class="nav-item__icon">⚙️</span>
              <span class="nav-item__label">设置</span>
            </button>
          </div>
        </nav>
        <main class="main-area" id="mainArea"></main>
        <nav class="bottom-nav">
          ${bottomNav}
          ${moreBtn}
        </nav>
      </div>
    `;
    this.updateNavActive();
  },

  getModuleName(id) {
    const m = this.modules.find(x => x.id === id);
    if (!m) return id;
    const customNames = this.state.settings.custom_module_names || {};
    return customNames[id] || m.name;
  },

  navigate(pageId) {
    const mod = this.modules.find(m => m.id === pageId);
    // 隐私模块检查
    if (mod && mod.privacy) {
      if (!this.state.privacyUnlocked[pageId]) {
        PrivacyLock.show(pageId);
        return;
      }
    }
    this.state.currentPage = pageId;
    DB.setSetting('last_page', pageId);
    const main = document.getElementById('mainArea');
    if (!main) return;  // 主区域未渲染
    main.innerHTML = `<div class="page" id="pageContent"><div class="text-center" style="padding:40px"><div class="spinner"></div></div></div>`;

    // 路由到对应模块
    const router = {
      home: () => HomeModule.render(),
      timer: () => TimerModule.render(),
      projects: () => ProjectsModule.render(),
      reading: () => ReadingModule.render(),
      workout: () => WorkoutModule.render(),
      emotion: () => EmotionModule.render(),
      'emotion-analysis': () => EmotionAnalysis.render(),
      stats: () => StatsModule.render(),
      review: () => ReviewModule.render(),
      soul: () => SoulModule.render(),
      'star-map': () => StarMapModule.render(),
      cards: () => CardsModule.render(),
      'ai-chat': () => AIChatModule.render(),
      reminders: () => RemindersModule.render(),
      settings: () => SettingsModule.render(),
    };
    const fn = router[pageId];
    if (fn) { fn(); }
    else { document.getElementById('pageContent').innerHTML = '<div class="empty-state"><div class="empty-state__icon">🚧</div><div class="empty-state__text">模块开发中</div></div>'; }

    this.updateNavActive();
    // 滚动到顶
    document.getElementById('mainArea').scrollTop = 0;
    window.scrollTo(0, 0);
  },

  updateNavActive() {
    document.querySelectorAll('.nav-item, .bottom-nav__item').forEach(el => {
      el.classList.toggle('active', el.dataset.page === this.state.currentPage);
    });
  },

  openModuleMenu() {
    const visibleModules = this.modules.filter(m => {
      const hidden = this.state.settings.hidden_modules || [];
      return !hidden.includes(m.id);
    });
    const items = visibleModules.map(m => `
      <div class="list-item" onclick="App.navigate('${m.id}');App.closeModal()">
        <span style="font-size:22px">${m.icon}</span>
        <div class="list-item__main">
          <div class="list-item__title">${this.getModuleName(m.id)}</div>
        </div>
      </div>
    `).join('');
    UI.modal('全部模块', `<div>${items}</div>`);
  },

  closeModal() { UI.closeModal(); },

  startClock() {
    if (this._clockTimer) clearInterval(this._clockTimer);
    const tick = () => {
      const el = document.getElementById('liveClock');
      if (el) {
        const fmt = this.state.settings.time_format || '24h';
        const now = new Date();
        let h = now.getHours();
        const m = String(now.getMinutes()).padStart(2,'0');
        const s = String(now.getSeconds()).padStart(2,'0');
        let suffix = '';
        if (fmt === '12h') {
          suffix = h >= 12 ? ' PM' : ' AM';
          h = h % 12 || 12;
        }
        el.textContent = `${String(h).padStart(2,'0')}:${m}:${s}${suffix}`;
      }
    };
    tick();
    this._clockTimer = setInterval(tick, 1000);
  },

  addDecorations() {
    if (document.querySelector('.deco-layer')) return;
    const layer = document.createElement('div');
    layer.className = 'deco-layer';
    layer.innerHTML = `
      <span class="deco-heart">💗</span>

      <span class="deco-moon">🌙</span>
      <span class="deco-star">⭐</span>

    document.body.appendChild(layer);
  },

  getLinkName() {
    return this.state.settings.link_partner_name || '宝宝';
  },

  // 获取问候语
  getGreeting() {
    const h = new Date().getHours();
    const name = this.state.settings.user_nickname || '昭昭';
    if (h < 6) return `凌晨好，${name}，注意休息呀`;
    if (h < 11) return `早上好，${name}，今天也要元气满满`;
    if (h < 14) return `中午好，${name}，记得吃午饭哦`;
    if (h < 18) return `下午好，${name}，辛苦啦`;
    if (h < 22) return `晚上好，${name}，今天过得怎么样`;
    return `夜深了，${name}，早点休息`;
  },
};

  },

  _render() {
    const s = this.steps[this.step];
    const root = document.getElementById('app');
    const progress = ((this.step + 1) / this.steps.length * 100).toFixed(0);
    root.innerHTML = `
      <div class="wizard">
        <div class="wizard__card">
          <div class="wizard__step">第 ${this.step + 1} / ${this.steps.length} 步</div>
          <div class="wizard__title">${s.title}</div>
          <div class="wizard__progress"><div class="wizard__progress-bar" style="width:${progress}%"></div></div>
          <div id="wizardContent">${s.render()}</div>
          <div class="flex gap-3 mt-6">
            ${this.step > 0 ? '<button class="btn flex-1" onclick="Wizard.prev()">上一步</button>' : ''}
            ${this.step < this.steps.length - 1
              ? '<button class="btn btn--primary flex-1" onclick="Wizard.next()">下一步</button>'
              : '<button class="btn btn--primary flex-1" onclick="Wizard.finish()">开始使用 🌸</button>'}
          </div>
        </div>
      </div>
    `;
  },

  next() {
    this._collect();
    if (!this._validate()) return;
    this.step++;
    this._render();
  },

  prev() {
    this._collect();
    this.step = Math.max(0, this.step - 1);
    this._render();
  },

  _collect() {
    const c = document.getElementById('wizardContent');
    if (!c) return;
    c.querySelectorAll('[data-key]').forEach(el => {
      const key = el.dataset.key;
      if (el.type === 'checkbox') {
        if (el.dataset.type === 'multi') {
          // 数组类型 checkbox
          if (!Array.isArray(this.data[key])) this.data[key] = [];
          const val = el.value;
          if (el.checked && !this.data[key].includes(val)) this.data[key].push(val);
          if (!el.checked) this.data[key] = this.data[key].filter(v => v !== val);
        } else {
          // 单个 boolean
          this.data[key] = el.checked;
        }
      } else if (el.dataset.type === 'multi-text') {
        this.data[key] = el.value.split('\n').map(s => s.trim()).filter(Boolean);
      } else {
        this.data[key] = el.value;
      }
    });
  },

  _validate() {
    return true;
  },

                <div class="list-item" style="padding:10px">
                  <input type="checkbox" ${t.completed?'checked':''} onchange="HomeModule.toggleTask('${t.id}',this.checked)">
                  <div class="list-item__main">

          <!-- 今日统计 -->
          <div class="card">
            <div class="card-title">📊 今日概览</div>
            <div class="grid grid-2" style="gap:10px">
              <div class="health-item">
                <div class="health-item__label">完成任务</div>
                <div class="health-item__value">${completedToday.length}</div>
              </div>
              <div class="health-item">
                <div class="health-item__label">专注阅读</div>
                <div class="health-item__value">${this._fmtDur(readMs)}</div>
              </div>
              <div class="health-item">
                <div class="health-item__label">专注锻炼</div>
                <div class="health-item__value">${this._fmtDur(workoutMs)}</div>
              </div>
              <div class="health-item">
                <div class="health-item__label">情绪记录</div>
                <div class="health-item__value">${emotions.length}</div>
              </div>
            </div>

        </div>

        <!-- 本周目标 -->
        <div class="card mb-4">
          <div class="card-title">🎯 本周学习和成长目标</div>
          ${weekGoals.length === 0 ? UI.empty('🌱','还没有设置本周目标') : `
            <ul class="flex flex-col gap-2">
              ${weekGoals.map((g,i) => `
                <li class="flex items-center gap-2">
                  <input type="checkbox" ${g.done?'checked':''} onchange="HomeModule.toggleGoal(${i},this.checked)">
                  <span style="${g.done?'text-decoration:line-through;opacity:0.5':''}">${g.text}</span>

          <!-- 情绪天气 -->

            ${emotions.length === 0 ? '<p class="text-faint text-sm text-center mt-2">系统默认：平和（未记录）</p>' : ''}
          </div>

          <!-- 灵魂链接模糊提示 -->
          <div class="card card--blur" style="background:linear-gradient(135deg,rgba(187,164,217,0.08),rgba(241,148,166,0.08))">
            <div class="card-title">✨ 灵魂链接</div>
            ${linkRecords.length > 0
              ? `<p style="color:var(--color-primary)">今天有 ${linkRecords.length} 条私密记录 🌙</p>
                 <p class="text-faint text-xs mt-2">详情已隐藏，点击进入查看</p>
                 <button class="btn btn--sm btn--rose mt-3" onclick="App.navigate('soul')">进入查看</button>`
              : `<p class="text-faint text-sm">今天还没有链接记录</p>
                 <button class="btn btn--sm btn--ghost mt-3" onclick="App.navigate('soul')">去记录</button>`}
          </div>
        </div>

        <!-- 复盘状态 -->
        <div class="card">
          <div class="flex items-center justify-between">
            <div class="card-title">🌙 今日复盘</div>
            ${reviewDone
              ? '<span class="ai-badge" style="background:var(--color-success)">已完成</span>'

          <button class="btn btn--rose btn--sm mt-2" onclick="App.navigate('review');setTimeout(()=>ReviewModule.startToday(),300)">
            ${reviewDone ? '查看/编辑复盘' : '开始每日复盘'}
          </button>
        </div>

    `;
    document.getElementById('pageContent').innerHTML = html;
    this._renderEmotionMini(emotions);
  },

  _quickBtn(icon, label, onclick) {
    return `
      <button class="btn btn--sm" style="flex-direction:column;padding:12px 6px;min-height:72px" onclick="${onclick.replace(/"/g,'&quot;')}">
        <span style="font-size:22px">${icon}</span>
        <span class="text-xs" style="margin-top:4px">${label}</span>
      </button>
    `;
  },

  _fmtDur(ms) {
    if (!ms) return '0分';
    const m = Math.floor(ms / 60000);
    if (m < 60) return `${m}分`;
    return `${Math.floor(m/60)}时${m%60}分`;
  },

  _getDailyQuote() {
    const quotes = [
      { zh: '愿你成为自己的太阳，无需借谁的光。', en: 'May you become your own sun, needing no one else\'s light.' },
      { zh: '所有的努力都不会完全白费。', en: 'No effort is ever completely in vain.' },
      { zh: '今天的你，是过去所有你的总和。', en: 'Today\'s you is the sum of all your past selves.' },
      { zh: '慢慢来，比较快。', en: 'Slowly is the fastest way.' },
      { zh: '生活明朗，万物可爱。', en: 'Life is bright, and all things are lovely.' },
      { zh: '愿你眼里有光，心中有爱。', en: 'May there be light in your eyes and love in your heart.' },
      { zh: '每一个不曾起舞的日子，都是对生命的辜负。', en: 'Every day without dance is a betrayal of life.' },
      { zh: '你只管努力，剩下的交给时间。', en: 'Just do your best, and leave the rest to time.' },
      { zh: '心怀温柔，所遇皆温柔。', en: 'With a gentle heart, all you meet is gentle.' },
      { zh: '今日事，今日毕。', en: 'Finish today\'s work today.' },
    ];
    const d = new Date();
    const idx = (d.getFullYear()*1000 + d.getMonth()*32 + d.getDate()) % quotes.length;
    return quotes[idx];
  },

  async _renderEmotionMini(emotions) {
    const el = document.getElementById('homeEmotionChart');
    if (!el) return;
    if (emotions.length === 0 || typeof Chart === 'undefined') {
      el.innerHTML = '<div class="text-center text-faint text-sm" style="padding:30px 0">今天还没有情绪记录<br>系统默认：平和</div>';
      return;
    }
    const canvas = document.createElement('canvas');
    canvas.style.maxHeight = '120px';
    el.innerHTML = '';
    el.appendChild(canvas);
    const types = await DB.getSetting('emotion_types') || [];
    const labels = emotions.map(e => new Date(e.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
    const data = emotions.map(e => {
      const t = types.find(x => x.name === e.emotion_type);
      return t ? t.valence * (e.intensity||5) : 0;
    });
    new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [{ data, borderColor: '#F194A6', tension: 0.4, fill: true, backgroundColor: 'rgba(241,148,166,0.1)' }] },
      options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } }, maintainAspectRatio: false },
    });
  },

  async addTask() {
    UI.modal('添加今日待办', `
      <div class="field">
        <label class="field__label">任务内容</label>
        <input class="input" id="taskTitle" placeholder="今天要做什么？">
      </div>
      <div class="field">
        <label class="field__label">优先级</label>
        <select class="select" id="taskPrio">
          <option value="normal">普通</option>
          <option value="high">重要</option>
          <option value="urgent">紧急</option>
        </select>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="HomeModule._saveTask()">保存</button>
      </div>
    `);
    setTimeout(() => document.getElementById('taskTitle')?.focus(), 100);
  },

  async _saveTask() {
    const title = document.getElementById('taskTitle').value.trim();
    if (!title) { UI.toast('请输入任务内容','error'); return; }
    const prio = document.getElementById('taskPrio').value;
    await DB.save('tasks', {
      title, priority: prio, completed: false, date: todayKey(),
      reset_daily: false,
    });
    UI.closeModal();
    UI.toast('已添加','success');
    this.render();
  },

  async toggleTask(id, checked) {
    const t = await DB.get('tasks', id);
    if (t) {
      t.completed = checked;
      t.completed_date = checked ? todayKey() : null;
      await DB.save('tasks', t);
      this.render();
    }
  },

  async toggleGoal(idx, checked) {
    const goals = await DB.getSetting('week_goals') || [];
    if (goals[idx]) {
      goals[idx].done = checked;
      await DB.setSetting('week_goals', goals);
    }
  },
};


// === js/modules/timer.js ===
/**
 * 工作与专注计时模块
 * 支持自由计时、番茄钟、刷新恢复、补录、统计
 */
const TimerModule = {
  _tickTimer: null,
  _running: null,  // 当前运行中的计时器缓存

  async render() {
    const taskTypes = await DB.getSetting('task_types') || ['阅读','锻炼','电影/电影解说','纪录片','复盘阿苡视频','其他'];
    const running = (await DB.list('timer_running')).filter(t => !t.deleted_at);
    const todayRecords = (await DB.list('timers')).filter(t => !t.deleted_at && t.start_time?.startsWith(todayKey()));

    const html = `
      <div class="page">
        <div class="page__title">⏱️ 工作与专注计时</div>

        <!-- 当前计时 -->
        <div class="card mb-4" id="timerPanel" style="${running.length>0?'border:1px solid var(--color-rose);background:rgba(241,148,166,0.04)':''}">
          ${running.length > 0 ? this._renderRunning(running[0]) : this._renderStartForm(taskTypes)}
        </div>

        <!-- 今日记录 -->
        <div class="card mb-4">
          <div class="card-header">
            <div class="card-title">📋 今日记录</div>
            <button class="btn btn--sm btn--ghost" onclick="TimerModule.addManual()">+ 补录</button>
          </div>
          ${todayRecords.length === 0 ? UI.empty('⏰','今天还没有计时记录') : `
            <div class="flex flex-col gap-2">
              ${todayRecords.sort((a,b)=>b.start_time.localeCompare(a.start_time)).map(t => `
                <div class="list-item">
                  <span style="font-size:20px">${this._typeIcon(t.task_type)}</span>
                  <div class="list-item__main">
                    <div class="list-item__title">${t.task_name}</div>
                    <div class="list-item__sub">${t.task_type} · ${this._fmtDur(t.duration)} · ${new Date(t.start_time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}-${new Date(t.end_time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</div>
                  </div>
                  <button class="btn btn--sm btn--ghost" onclick="TimerModule.viewDetail('${t.id}')">详情</button>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <!-- 统计 -->
        <div class="grid grid-3 mb-4">
          <div class="card">
            <div class="card-title text-sm">📅 今日</div>
            <div class="text-2xl" style="color:var(--color-primary);font-weight:600">${this._fmtDur(todayRecords.reduce((s,t)=>s+(t.duration||0),0))}</div>
            <div class="text-faint text-xs mt-1">${todayRecords.length} 次计时</div>
          </div>
          <div class="card">
            <div class="card-title text-sm">📆 本周</div>
            <div class="text-2xl" style="color:var(--color-rose);font-weight:600" id="weekStat">-</div>
            <div class="text-faint text-xs mt-1" id="weekCount">-</div>
          </div>
          <div class="card">
            <div class="card-title text-sm">🗓️ 本月</div>
            <div class="text-2xl" style="color:var(--color-wisteria);font-weight:600" id="monthStat">-</div>
            <div class="text-faint text-xs mt-1" id="monthCount">-</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">📊 按类型统计</div>
          <div id="typeStatChart" style="min-height:200px"></div>
        </div>

        <div class="flex gap-3 mt-4">
          <button class="btn flex-1" onclick="TimerModule.showStats('day')">日统计</button>
          <button class="btn flex-1" onclick="TimerModule.showStats('week')">周统计</button>
          <button class="btn flex-1" onclick="TimerModule.showStats('month')">月统计</button>
          <button class="btn flex-1" onclick="TimerModule.showStats('year')">年统计</button>
        </div>
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;

    // 启动计时显示
    if (running.length > 0) {
      this._running = running[0];
      this._startTick();
    }
    await this._loadStats();
  },

  _renderStartForm(taskTypes) {
    return `
      <div class="card-title">开始专注</div>
      <div class="field">
        <label class="field__label">任务类型</label>
        <div class="tag-select" id="typeSelect">
          ${taskTypes.map((t,i) => `<div class="tag-chip ${i===0?'active':''}" onclick="TimerModule._selectType(this)">${t}</div>`).join('')}
        </div>
      </div>
      <div class="field">
        <label class="field__label">任务名称</label>
        <input class="input" id="taskName" placeholder="例如：读《被讨厌的勇气》第3章">
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label class="field__label">目标</label>
          <input class="input" id="taskGoal" placeholder="完成什么算成功？">
        </div>
        <div class="field">
          <label class="field__label">预计时长（分钟）</label>
          <input class="input" id="estMin" type="number" min="1" placeholder="25">
        </div>
      </div>
      <div class="field">
        <label class="field__label">模式</label>
        <div class="tag-select">
          <div class="tag-chip active" onclick="TimerModule._selectMode(this,'free')">自由计时</div>
          <div class="tag-chip" onclick="TimerModule._selectMode(this,'pomodoro')">番茄钟（25分+5分）</div>
        </div>
      </div>
      <div class="flex gap-3 mt-2">
        <button class="btn btn--primary btn--lg flex-1" onclick="TimerModule.start()">▶ 开始</button>
      </div>
    `;
  },

  _renderRunning(r) {
    const elapsed = (Date.now() - new Date(r.start_time).getTime()) - (r.paused_ms||0);
    const isPaused = r.paused;
    return `
      <div class="card-title">⏱️ 正在计时</div>
      <div class="text-center" style="padding:20px 0">
        <div style="font-size:48px;color:var(--color-primary);font-weight:600;font-variant-numeric:tabular-nums" id="timerDisplay">${this._fmtDur(elapsed)}</div>
        <div class="text-soft mt-2">${r.task_name} · ${r.task_type}</div>
        <div class="text-faint text-xs mt-1">预计 ${r.estimated_min||0} 分钟 · 开始于 ${new Date(r.start_time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div class="flex gap-3" style="justify-content:center">
        ${isPaused
          ? '<button class="btn btn--primary" onclick="TimerModule.resume()">▶ 继续</button>'
          : '<button class="btn" onclick="TimerModule.pause()">⏸ 暂停</button>'}
        <button class="btn btn--accent" onclick="TimerModule.stop()">⏹ 结束</button>
      </div>
    `;
  },

  _selectedType: '阅读',
  _selectedMode: 'free',

  _selectType(el) {
    document.querySelectorAll('#typeSelect .tag-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this._selectedType = el.textContent;
  },

  _selectMode(el, mode) {
    el.parentElement.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this._selectedMode = mode;
    if (mode === 'pomodoro') {
      const est = document.getElementById('estMin');
      if (est && !est.value) est.value = 25;
    }
  },

  async quickStart(type) {
    this._selectedType = type || '阅读';
    const form = document.getElementById('taskName');
    if (form) {
      form.value = type === '阅读' ? '阅读时间' : (type === '锻炼' ? '锻炼时间' : '专注时间');
      this.start();
    }
  },

  async start() {
    // 检查是否已有运行中
    const running = (await DB.list('timer_running')).filter(t => !t.deleted_at);
    if (running.length > 0) {
      UI.toast('已有计时进行中，同一时间只能运行一个','error');
      return;
    }
    const name = document.getElementById('taskName')?.value.trim();
    if (!name) { UI.toast('请填写任务名称','error'); return; }
    const goal = document.getElementById('taskGoal')?.value.trim() || '';
    const estMin = parseInt(document.getElementById('estMin')?.value) || 0;
    const record = {
      id: uuid(),
      task_type: this._selectedType,
      task_name: name,
      goal,
      estimated_min: estMin,
      mode: this._selectedMode,
      start_time: nowISO(),
      paused: false,
      paused_ms: 0,
      pause_start: null,
    };
    await DB.save('timer_running', record);
    this._running = record;
    this._startTick();
    UI.toast('计时开始！专注中…','success');
    this.render();
  },

  async pause() {
    if (!this._running) return;
    this._running.paused = true;
    this._running.pause_start = nowISO();
    await DB.save('timer_running', this._running);
    this.render();
  },

  async resume() {
    if (!this._running) return;
    if (this._running.pause_start) {
      const pauseDur = Date.now() - new Date(this._running.pause_start).getTime();
      this._running.paused_ms = (this._running.paused_ms||0) + pauseDur;
      this._running.pause_start = null;
    }
    this._running.paused = false;
    await DB.save('timer_running', this._running);
    this._startTick();
    this.render();
  },

  async stop() {
    if (!this._running) return;
    const r = this._running;
    const end = nowISO();
    // 计算实际时长（减去暂停时间）
    let dur = new Date(end).getTime() - new Date(r.start_time).getTime();
    if (r.paused_ms) dur -= r.paused_ms;
    if (r.pause_start) dur -= (Date.now() - new Date(r.pause_start).getTime());

    // 询问完成情况
    UI.modal('计时结束 🎉', `
      <div class="text-center mb-4">
        <div style="font-size:36px;color:var(--color-primary);font-weight:600">${this._fmtDur(dur)}</div>
        <div class="text-soft text-sm mt-1">${r.task_name}</div>
        ${r.estimated_min ? `<div class="text-faint text-xs mt-1">预计 ${r.estimated_min} 分钟 / 实际 ${Math.round(dur/60000)} 分钟</div>` : ''}
      </div>
      <div class="field">
        <label class="field__label">完成成果</label>
        <textarea class="textarea" id="endResult" placeholder="这次专注完成了什么？"></textarea>
      </div>
      <div class="field">
        <label class="field__label">专注程度</label>
        <div class="tag-select" id="focusLevel">
          <div class="tag-chip" onclick="TimerModule._selFocus(this,1)">1 分心</div>
          <div class="tag-chip" onclick="TimerModule._selFocus(this,2)">2</div>
          <div class="tag-chip" onclick="TimerModule._selFocus(this,3)">3 一般</div>
          <div class="tag-chip" onclick="TimerModule._selFocus(this,4)">4</div>
          <div class="tag-chip active" onclick="TimerModule._selFocus(this,5)">5 专注</div>
        </div>
      </div>
      <div class="field">
        <label class="field__label">备注</label>
        <textarea class="textarea" id="endNote" placeholder="可留空"></textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="TimerModule._discardStop()">放弃不保存</button>
        <button class="btn btn--primary" onclick="TimerModule._saveStop('${dur}')">保存记录</button>
      </div>
    `);
    this._focusLevel = 5;
  },

  _selFocus(el, lvl) {
    el.parentElement.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this._focusLevel = lvl;
  },

  async _saveStop(durStr) {
    const dur = parseInt(durStr);
    const r = this._running;
    const record = {
      task_type: r.task_type,
      task_name: r.task_name,
      goal: r.goal,
      estimated_min: r.estimated_min || 0,
      mode: r.mode,
      start_time: r.start_time,
      end_time: nowISO(),
      duration: dur,
      result: document.getElementById('endResult')?.value || '',
      focus_level: this._focusLevel || 3,
      note: document.getElementById('endNote')?.value || '',
    };
    await DB.save('timers', record);
    // 删除运行中
    await DB.hardDelete('timer_running', r.id);
    this._running = null;
    this._stopTick();
    UI.closeModal();
    UI.toast('记录已保存','success');
    // 提醒休息
    if (dur > 50 * 60000) {
      setTimeout(() => UI.toast('已经专注超过50分钟了，记得休息一下哦 💕','info',4000), 500);
    }
    this.render();
  },

  async _discardStop() {
    if (!UI.confirm('确定放弃这条计时记录吗？')) return;
    await DB.hardDelete('timer_running', this._running.id);
    this._running = null;
    this._stopTick();
    UI.closeModal();
    UI.toast('已放弃','info');
    this.render();
  },

  _startTick() {
    this._stopTick();
    this._tickTimer = setInterval(() => {
      const el = document.getElementById('timerDisplay');
      if (!el || !this._running) { this._stopTick(); return; }
      let elapsed = Date.now() - new Date(this._running.start_time).getTime();
      if (this._running.paused_ms) elapsed -= this._running.paused_ms;
      if (this._running.pause_start) elapsed -= (Date.now() - new Date(this._running.pause_start).getTime());
      el.textContent = this._fmtDur(elapsed);
    }, 1000);
  },

  _stopTick() {
    if (this._tickTimer) { clearInterval(this._tickTimer); this._tickTimer = null; }
  },

  // 刷新/重新打开时恢复
  async restoreRunning() {
    const running = (await DB.list('timer_running')).filter(t => !t.deleted_at);
    if (running.length > 0) {
      this._running = running[0];
      console.log('[Timer] 恢复运行中计时器:', this._running.task_name);
    }
  },

  _fmtDur(ms) {
    if (!ms || ms < 0) ms = 0;
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    return `${m}:${String(sec).padStart(2,'0')}`;
  },

  _typeIcon(type) {
    const map = { '阅读':'📖','锻炼':'🏃','电影/电影解说':'🎬','纪录片':'🎞️','复盘阿苡视频':'📹','其他':'✨' };
    return map[type] || '⏱️';
  },

  async _loadStats() {
    const now = new Date();
    const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay()); weekStart.setHours(0,0,0,0);
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const all = (await DB.list('timers')).filter(t => !t.deleted_at);
    const weekRecs = all.filter(t => new Date(t.start_time) >= weekStart);
    const monthRecs = all.filter(t => new Date(t.start_time) >= monthStart);
    const wEl = document.getElementById('weekStat');
    const wcEl = document.getElementById('weekCount');
    const mEl = document.getElementById('monthStat');
    const mcEl = document.getElementById('monthCount');
    if (wEl) wEl.textContent = this._fmtDur(weekRecs.reduce((s,t)=>s+(t.duration||0),0));
    if (wcEl) wcEl.textContent = `${weekRecs.length} 次计时`;
    if (mEl) mEl.textContent = this._fmtDur(monthRecs.reduce((s,t)=>s+(t.duration||0),0));
    if (mcEl) mcEl.textContent = `${monthRecs.length} 次计时`;

    // 类型统计图
    const chartEl = document.getElementById('typeStatChart');
    if (chartEl && typeof Chart !== 'undefined') {
      const byType = {};
      all.forEach(t => { byType[t.task_type] = (byType[t.task_type]||0) + (t.duration||0); });
      const labels = Object.keys(byType);
      const data = Object.values(byType).map(ms => Math.round(ms/60000));
      if (labels.length === 0) {
        chartEl.innerHTML = '<div class="text-center text-faint text-sm" style="padding:30px">暂无数据</div>';
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.style.maxHeight = '200px';
      chartEl.innerHTML = '';
      chartEl.appendChild(canvas);
      new Chart(canvas, {
        type: 'bar',
        data: { labels, datasets: [{ data, backgroundColor: ['#F194A6','#8A4E7B','#BBA4D9','#DB5A6B','#7EC8A0','#F5B97A'] }] },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } }, maintainAspectRatio: false },
      });
    }
  },

  async showStats(range) {
    const now = new Date();
    let start;
    let title;
    if (range === 'day') { start = new Date(now); start.setHours(0,0,0,0); title = '今日'; }
    else if (range === 'week') { start = new Date(now); start.setDate(now.getDate()-now.getDay()); start.setHours(0,0,0,0); title = '本周'; }
    else if (range === 'month') { start = new Date(now.getFullYear(), now.getMonth(), 1); title = '本月'; }
    else { start = new Date(now.getFullYear(), 0, 1); title = '本年'; }
    const all = (await DB.list('timers')).filter(t => !t.deleted_at && new Date(t.start_time) >= start);
    const byType = {};
    all.forEach(t => { byType[t.task_type] = byType[t.task_type] || { count:0, ms:0 }; byType[t.task_type].count++; byType[t.task_type].ms += t.duration||0; });
    UI.modal(`${title}计时统计`, `
      <div class="text-center mb-4">
        <div class="text-2xl" style="color:var(--color-primary);font-weight:600">${this._fmtDur(all.reduce((s,t)=>s+(t.duration||0),0))}</div>
        <div class="text-soft text-sm">${all.length} 次计时</div>
      </div>
      ${Object.keys(byType).length === 0 ? UI.empty('📭','该时段暂无记录') : `
        <table class="w-full text-sm">
          <tr style="color:var(--color-text-soft)"><td>类型</td><td>次数</td><td>时长</td></tr>
          ${Object.entries(byType).map(([type,v]) => `
            <tr style="border-top:1px solid var(--color-divider)">
              <td style="padding:8px 0">${this._typeIcon(type)} ${type}</td>
              <td>${v.count}</td>
              <td>${this._fmtDur(v.ms)}</td>
            </tr>
          `).join('')}
        </table>
      `}
    `);
  },

  async addManual() {
    const taskTypes = await DB.getSetting('task_types') || ['阅读','锻炼','其他'];
    UI.modal('补录计时记录', `
      <div class="field">
        <label class="field__label">任务类型</label>
        <select class="select" id="mType">${taskTypes.map(t => `<option>${t}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label class="field__label">任务名称</label>
        <input class="input" id="mName">
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label class="field__label">开始时间</label>
          <input class="input" type="datetime-local" id="mStart">
        </div>
        <div class="field">
          <label class="field__label">时长（分钟）</label>
          <input class="input" type="number" id="mMin" min="1">
        </div>
      </div>
      <div class="field">
        <label class="field__label">备注</label>
        <textarea class="textarea" id="mNote"></textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="TimerModule._saveManual()">保存</button>
      </div>
    `);
    // 默认开始时间为1小时前
    const oneHourAgo = new Date(Date.now() - 3600000);
    const pad = n => String(n).padStart(2,'0');
    document.getElementById('mStart').value = `${oneHourAgo.getFullYear()}-${pad(oneHourAgo.getMonth()+1)}-${pad(oneHourAgo.getDate())}T${pad(oneHourAgo.getHours())}:${pad(oneHourAgo.getMinutes())}`;
  },

  async _saveManual() {
    const type = document.getElementById('mType').value;
    const name = document.getElementById('mName').value.trim();
    const startStr = document.getElementById('mStart').value;
    const min = parseInt(document.getElementById('mMin').value) || 0;
    if (!name || !startStr || !min) { UI.toast('请填写完整','error'); return; }
    const start = new Date(startStr);
    const end = new Date(start.getTime() + min * 60000);
    await DB.save('timers', {
      task_type: type, task_name: name, mode: 'manual',
      start_time: start.toISOString(), end_time: end.toISOString(),
      duration: min * 60000, note: document.getElementById('mNote').value,
      source_type: 'manual',
    });
    UI.closeModal();
    UI.toast('已补录','success');
    this.render();
  },

  async viewDetail(id) {
    const t = await DB.get('timers', id);
    if (!t) return;
    UI.modal('计时详情', `
      <div class="list-item"><div class="list-item__main">
        <div class="list-item__title">${this._typeIcon(t.task_type)} ${t.task_name}</div>
        <div class="list-item__sub">${t.task_type}</div>
      </div></div>
      <table class="w-full text-sm mt-3">
        <tr><td class="text-soft">开始</td><td>${new Date(t.start_time).toLocaleString('zh-CN')}</td></tr>
        <tr><td class="text-soft">结束</td><td>${new Date(t.end_time).toLocaleString('zh-CN')}</td></tr>
        <tr><td class="text-soft">时长</td><td>${this._fmtDur(t.duration)}</td></tr>
        ${t.estimated_min ? `<tr><td class="text-soft">预计</td><td>${t.estimated_min} 分钟</td></tr>` : ''}
        ${t.goal ? `<tr><td class="text-soft">目标</td><td>${t.goal}</td></tr>` : ''}
        ${t.result ? `<tr><td class="text-soft">成果</td><td>${t.result}</td></tr>` : ''}
        ${t.focus_level ? `<tr><td class="text-soft">专注度</td><td>${'⭐'.repeat(t.focus_level)}</td></tr>` : ''}
        ${t.note ? `<tr><td class="text-soft">备注</td><td>${t.note}</td></tr>` : ''}
      </table>
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn btn--accent btn--sm" onclick="TimerModule._deleteRec('${id}')">删除</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  async _deleteRec(id) {
    if (!await UI.confirm('确定删除这条记录吗？删除后会影响相关统计。')) return;
    await DB.hardDelete('timers', id);
    UI.closeModal();
    UI.toast('已删除','success');
    this.render();
  },
};


// === js/modules/reading.js ===
/**
 * 阅读模块
 * 四类分类：在看/待看/已看完/多钟类可看
 */
const ReadingModule = {
  async render() {
    const books = (await DB.list('books')).filter(b => !b.deleted_at);
    const categories = ['在看','待看','已看完','多钟类可看'];

    const html = `
      <div class="page">
        <div class="flex justify-between items-center mb-4">
          <div class="page__title" style="margin:0">📖 阅读模块</div>
          <button class="btn btn--primary btn--sm" onclick="ReadingModule.add()">+ 添加书籍</button>
        </div>

        ${books.length === 0 ? `
          <div class="card">
            ${UI.empty('📚','还没有书籍，点击右上角添加')}
          </div>
        ` : categories.map(cat => {
          const catBooks = books.filter(b => b.category === cat);
          if (catBooks.length === 0) return '';
          return `
            <div class="card mb-4">
              <div class="card-header">
                <div class="card-title">${this._catIcon(cat)} ${cat}</div>
                <span class="badge">${catBooks.length}</span>
              </div>
              <div class="flex flex-col gap-2">
                ${catBooks.map(b => `
                  <div class="list-item">
                    <span style="font-size:24px">${b.format==='电子'?'📱':'📕'}</span>
                    <div class="list-item__main" style="cursor:pointer" onclick="ReadingModule.detail('${b.id}')">
                      <div class="list-item__title">${b.title}</div>
                      <div class="list-item__sub">${b.author||'未知作者'} · ${b.platform||'-'}</div>
                    </div>
                    <button class="btn btn--sm btn--ghost" onclick="ReadingModule.moveCategory('${b.id}')">↕</button>
                    <button class="btn btn--sm btn--ghost" onclick="ReadingModule.edit('${b.id}')">✏️</button>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).join('')}

        <!-- 阅读复盘分析 -->
        ${books.filter(b => b.category === '已看完').length >= 3 ? `
          <div class="card">
            <div class="card-title">📊 阅读复盘分析</div>
            <div id="readingAnalysis">加载中...</div>
          </div>
        ` : ''}
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
    if (books.filter(b => b.category === '已看完').length >= 3) {
      this._renderAnalysis(books);
    }
  },

  _catIcon(cat) {
    return { '在看':'📖','待看':'📋','已看完':'✅','多钟类可看':'🌟' }[cat] || '📚';
  },

  async add() {
    this._editForm(null);
  },

  async edit(id) {
    const b = await DB.get('books', id);
    this._editForm(b);
  },

  _editForm(book) {
    const categories = ['在看','待看','已看完','多钟类可看'];
    UI.modal(book ? '编辑书籍' : '添加书籍', `
      <div class="field">
        <label class="field__label">书名 *</label>
        <input class="input" id="bTitle" value="${book?.title||''}">
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label class="field__label">作者</label>
          <input class="input" id="bAuthor" value="${book?.author||''}">
        </div>
        <div class="field">
          <label class="field__label">类型</label>
          <input class="input" id="bType" placeholder="如：心理学、小说" value="${book?.type||''}">
        </div>
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label class="field__label">电子/实体</label>
          <select class="select" id="bFormat">
            <option ${book?.format==='电子'?'selected':''}>电子</option>
            <option ${book?.format==='实体'?'selected':''}>实体</option>
          </select>
        </div>
        <div class="field">
          <label class="field__label">阅读平台</label>
          <input class="input" id="bPlatform" placeholder="如：微信读书" value="${book?.platform||''}">
        </div>
      </div>
      <div class="field">
        <label class="field__label">分类</label>
        <div class="tag-select" id="bCatSelect">
          ${categories.map(c => `<div class="tag-chip ${(book?.category||'在看')===c?'active':''}" onclick="ReadingModule._selCat(this)">${c}</div>`).join('')}
        </div>
      </div>
      <div class="field">
        <label class="field__label">阅读时间</label>
        <input class="input" type="date" id="bDate" value="${book?.read_date||todayKey()}">
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="ReadingModule._save('${book?.id||''}')">保存</button>
      </div>
    `);
    this._selCat = book?.category || '在看';
  },

  _selCat(el) {
    el.parentElement.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this._selCat = el.textContent;
  },

  async _save(id) {
    const title = document.getElementById('bTitle').value.trim();
    if (!title) { UI.toast('请填写书名','error'); return; }
    const data = {
      title,
      author: document.getElementById('bAuthor').value,
      type: document.getElementById('bType').value,
      format: document.getElementById('bFormat').value,
      platform: document.getElementById('bPlatform').value,
      category: this._selCat || '在看',
      read_date: document.getElementById('bDate').value,
    };
    if (id) { data.id = id; }
    await DB.save('books', data);
    UI.closeModal();
    UI.toast('已保存','success');
    this.render();
  },

  async moveCategory(id) {
    const categories = ['在看','待看','已看完','多钟类可看'];
    UI.modal('移动到分类', categories.map(c => `
      <div class="list-item" onclick="ReadingModule._doMove('${id}','${c}')">
        <span style="font-size:20px">${this._catIcon(c)}</span>
        <div class="list-item__main"><div class="list-item__title">${c}</div></div>
      </div>
    `).join(''));
  },

  async _doMove(id, cat) {
    const b = await DB.get('books', id);
    if (b) { b.category = cat; await DB.save('books', b); }
    UI.closeModal();
    UI.toast('已移动','success');
    this.render();
  },

  async detail(id) {
    const b = await DB.get('books', id);
    if (!b) return;
    const notes = (await DB.list('book_notes')).filter(n => !n.deleted_at && n.book_id === id);
    UI.modal(`📖 ${b.title}`, `
      <div class="text-soft text-sm mb-3">${b.author||'未知'} · ${b.type||''} · ${b.format} · ${b.platform||''}</div>
      <div class="card-header">
        <div class="card-title">📝 笔记与摘录</div>
        <button class="btn btn--sm btn--ghost" onclick="ReadingModule.addNote('${id}')">+ 添加</button>
      </div>
      ${notes.length === 0 ? '<p class="text-faint text-sm">还没有笔记</p>' : notes.map(n => `
        <div class="list-item" style="cursor:pointer" onclick="ReadingModule.viewNote('${n.id}')">
          <div class="list-item__main">
            <div class="list-item__title">${n.quote?.slice(0,40)||'笔记'}...</div>
            <div class="list-item__sub">${n.note_type||'摘录'}</div>
          </div>
        </div>
      `).join('')}
      <div class="flex gap-3 mt-4">
        <button class="btn btn--accent btn--sm" onclick="ReadingModule._deleteBook('${id}')">删除书籍</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  async _deleteBook(id) {
    if (!await UI.confirm('删除这本书及其所有笔记？此操作不可撤销。')) return;
    await DB.hardDelete('books', id);
    const notes = (await DB.list('book_notes')).filter(n => n.book_id === id);
    for (const n of notes) await DB.hardDelete('book_notes', n.id);
    UI.closeModal();
    UI.toast('已删除','success');
    this.render();
  },

  async addNote(bookId) {
    UI.closeModal();
    const b = await DB.get('books', bookId);
    UI.modal(`添加笔记 - ${b.title}`, `
      <div class="field">
        <label class="field__label">笔记类型</label>
        <select class="select" id="nType">
          <option value="触动语句">触动语句</option>
          <option value="喜欢的片段">最喜欢的片段/故事</option>
          <option value="思考方向">引发思考的方向</option>
          <option value="核心收获">核心收获</option>
        </select>
      </div>
      <div class="field">
        <label class="field__label">原文摘录</label>
        <textarea class="textarea" id="nQuote" placeholder="摘录原文内容"></textarea>
      </div>
      <div class="field">
        <label class="field__label">我的感受（自选）</label>
        <textarea class="textarea" id="nFeeling" placeholder="可选"></textarea>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end">
        <button class="btn" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="ReadingModule._saveNote('${bookId}')">保存</button>
      </div>
    `);
  },

  async _saveNote(bookId) {
    await DB.save('book_notes', {
      book_id: bookId,
      note_type: document.getElementById('nType').value,
      quote: document.getElementById('nQuote').value,
      feeling: document.getElementById('nFeeling').value,
    });
    UI.closeModal();
    UI.toast('笔记已保存','success');
    this.detail(bookId);
  },

  async viewNote(id) {
    const n = await DB.get('book_notes', id);
    if (!n) return;
    UI.modal('笔记详情', `
      <div class="text-soft text-sm mb-2">${n.note_type}</div>
      <div class="card--blur" style="background:var(--color-bg-alt);padding:12px;border-radius:10px;margin-bottom:12px">
        <div class="text-xs text-faint mb-1">原文摘录</div>
        <div>${n.quote||''}</div>
      </div>
      ${n.feeling ? `
        <div class="card--blur" style="background:rgba(241,148,166,0.06);padding:12px;border-radius:10px">
          <div class="text-xs text-faint mb-1">我的感受</div>
          <div>${n.feeling}</div>
        </div>
      ` : ''}
      <div class="flex gap-3 mt-4" style="justify-content:flex-end">
        <button class="btn btn--accent btn--sm" onclick="ReadingModule._delNote('${id}','${n.book_id}')">删除</button>
        <button class="btn btn--sm" onclick="UI.closeModal()">关闭</button>
      </div>
    `);
  },

  async _delNote(id, bookId) {
    if (!await UI.confirm('删除这条笔记？')) return;
    await DB.hardDelete('book_notes', id);
    UI.closeModal();
    UI.toast('已删除','success');
    this.detail(bookId);
  },

  async _renderAnalysis(books) {
    const el = document.getElementById('readingAnalysis');
    if (!el) return;
    const finished = books.filter(b => b.category === '已看完');
    const notes = (await DB.list('book_notes')).filter(n => !n.deleted_at && finished.some(b => b.id === n.book_id));
    // 高频类型
    const typeCount = {};
    finished.forEach(b => { if (b.type) typeCount[b.type] = (typeCount[b.type]||0)+1; });
    // 高频笔记关键词
    const noteTypes = {};
    notes.forEach(n => { noteTypes[n.note_type] = (noteTypes[n.note_type]||0)+1; });
    el.innerHTML = `
      <div class="grid grid-2">
        <div>
          <div class="text-soft text-sm mb-2">📚 已读 ${finished.length} 本</div>
          <div class="text-faint text-xs">类型分布：</div>
          <ul class="text-sm mt-1">
            ${Object.entries(typeCount).sort((a,b)=>b[1]-a[1]).map(([t,c]) => `<li>${t}: ${c} 本</li>`).join('') || '<li class="text-faint">暂无</li>'}
          </ul>
        </div>
        <div>
          <div class="text-soft text-sm mb-2">📝 笔记 ${notes.length} 条</div>
          <div class="text-faint text-xs">笔记类型分布：</div>
          <ul class="text-sm mt-1">
            ${Object.entries(noteTypes).sort((a,b)=>b[1]-a[1]).map(([t,c]) => `<li>${t}: ${c} 条</li>`).join('') || '<li class="text-faint">暂无</li>'}
          </ul>
        </div>
      </div>
      <div class="ai-block mt-3">
        💡 以上分析基于你的真实记录自动统计。随着记录增多，可以观察哪种类型的书更容易引发深度思考。
      </div>
    `;
  },
};

/**
 * 锻炼板块
 * 周一到周日竖向排列打卡
 * 月度曲线图（蓝/紫/红三色）
 */
const WorkoutModule = {
  async render() {
    const all = (await DB.list('workouts')).filter(w => !w.deleted_at);
    const today = todayKey();
    const todayRecs = all.filter(w => w.date === today);

    // 本周记录
    const now = new Date();
    const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay()); weekStart.setHours(0,0,0,0);
    const weekRecs = all.filter(w => new Date(w.date) >= weekStart);

    const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];

    const html = `
      <div class="page">
        <div class="flex justify-between items-center mb-4">
          <div class="page__title" style="margin:0">🏃🏻‍♀️ 锻炼板块</div>
          <button class="btn btn--primary btn--sm" onclick="WorkoutModule.add()">+ 今日打卡</button>
        </div>

        <!-- 今日运动 -->
        <div class="card mb-4">
          <div class="card-title">🌟 今日运动（${today}）</div>
          ${todayRecs.length === 0 ? '<p class="text-faint text-sm">今天还没有运动打卡</p>' : `
            <div class="flex flex-col gap-2">
              ${todayRecs.map(w => `
                <div class="list-item">
                  <span style="font-size:20px">${this._intensityIcon(w.intensity)}</span>
                  <div class="list-item__main">
                    <div class="list-item__title">${w.project} · ${w.duration}分钟</div>
                    <div class="list-item__sub">强度:${w.intensity} · 身体:${'☆'.repeat(w.body_score||3)} · 心理:${'☆'.repeat(w.mind_score||3)}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <!-- 一周打卡（竖向） -->
        <div class="card mb-4">
          <div class="card-title">📅 本周打卡</div>
          <div class="week-checkin">
            ${[1,2,3,4,5,6,0].map(d => {
              const dayRecs = weekRecs.filter(w => new Date(w.date).getDay() === d);
