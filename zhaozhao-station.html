          <button class="btn btn--sm btn--ghost" onclick="AIChatModule._showCalendar('${convId}')">📆 日历</button>
        </div>

        <div class="card" style="min-height:400px;display:flex;flex-direction:column">
          ${this._renderDateFilterBar(messages)}
          <div id="chatMessages" style="flex:1;overflow-y:auto;max-height:50vh;margin-bottom:12px">
            ${(() => {
              const df = this._state.dateFilter;
              const visible = df ? messages.filter(m => (m.created_at || '').slice(0, 10) === df) : messages;
              if (visible.length === 0) {
                return df
                  ? `<div class="text-center text-faint" style="padding:40px">${df} 当天没有消息</div>`
                  : '<div class="text-center text-faint" style="padding:40px">开始对话吧 💬</div>';
              }
              return visible.sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||'')).map(m => this._renderMsg(m)).join('');
            })()}
          </div>
          <div class="chat-input-bar">
            <div class="flex gap-2" style="align-items:flex-end">
              <textarea class="input" id="chatInput" placeholder="输入消息…（Enter 换行，点发送按钮发送）" rows="1" style="resize:vertical;min-height:40px;max-height:140px;font-family:inherit"></textarea>
              <button class="btn btn--primary" onclick="AIChatModule._sendMsg('${convId}')">发送</button>
            </div>
          </div>
        </div>

        <!-- 多选操作栏 -->
        <div id="multiSelectBar" class="multi-select-bar hidden">
          <div class="flex gap-2 justify-center">
            <span class="text-sm" id="selectCount">已选 0 条</span>
            <button class="btn btn--sm btn--rose" onclick="AIChatModule._bookmarkFragment('${convId}')">收藏片段</button>
            <button class="btn btn--sm btn--ghost" onclick="AIChatModule._exportFragment('${convId}')">导出片段</button>
            <button class="btn btn--sm" onclick="AIChatModule._toggleMultiSelect()">取消</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
    const cm = document.getElementById('chatMessages');
    if (cm) cm.scrollTop = cm.scrollHeight;
    // 多选模式恢复
    if (this._state.multiSelectMode) {
      const bar = document.getElementById('multiSelectBar');
      if (bar) bar.classList.remove('hidden');
      const countEl = document.getElementById('selectCount');
      if (countEl) countEl.textContent = `已选 ${this._state.selectedMsgIds.size} 条`;
    }
  },

  _renderMsg(m) {
    const isUser = m.role === 'user';
    const isError = m.status === 'error';
    return `
      <div data-msg-id="${m.id}" style="display:flex;justify-content:${isUser?'flex-end':'flex-start'};margin-bottom:8px">
        <div class="chat-msg chat-msg--${isUser?'user':'ai'} ${isError?'chat-msg--error':''}">
          <div class="chat-msg__content">${this._escapeHtml(m.content)}</div>
          ${!isUser && !isError ? '<div class="ai-badge" style="font-size:9px;margin-top:4px;opacity:.6">AI 生成</div>' : ''}
          <div class="chat-msg__time" title="${this._escapeHtml(m.created_at || '')}">${this._fmtMsgTime(m.created_at)}</div>
          ${isError ? '<div class="text-xs" style="color:var(--color-danger)">发送失败</div>' : ''}
          <div class="chat-msg__actions">
            <span class="chat-msg__action" onclick="AIChatModule._copyMsg('${m.id}')">复制</span>
            ${isUser ? `<span class="chat-msg__action" onclick="AIChatModule._editMsg('${m.id}')">编辑</span>` : `<span class="chat-msg__action" onclick="AIChatModule._regen('${m.id}')">重说</span>`}
            <span class="chat-msg__action" onclick="AIChatModule._bookmark('${m.id}')">书签</span>
          </div>
        </div>
      </div>
    `;
  },

  // 消息时间格式化：MM/DD HH:mm，当年消息省略年份；跨年显示 YYYY/MM/DD HH:mm
  // 同时处理 UTC（带Z）和本地时区两种格式
  _fmtMsgTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso.slice(11, 16) || '';
    const pad = n => String(n).padStart(2, '0');
    const y = d.getFullYear(), mo = pad(d.getMonth()+1), da = pad(d.getDate()), hh = pad(d.getHours()), mm = pad(d.getMinutes());
    const thisYear = new Date().getFullYear();
    return y === thisYear ? `${mo}/${da} ${hh}:${mm}` : `${y}/${mo}/${da} ${hh}:${mm}`;
  },

  _renderStreamingMsg(fullText) {
    return `
      <div class="chat-msg chat-msg--ai">
        ${this._escapeHtml(fullText)}<span class="streaming-cursor">▋</span>
        <div class="chat-msg__actions">
          <span class="chat-msg__action" onclick="AIChatModule._stopGeneration()">停止</span>
        </div>
      </div>
    `;
  },

  _escapeHtml(s) {
    return s?.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') || '';
  },

  async _sendMsg(convId) {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    const conv = await DB.get('ai_conversations', convId);
    const conn = await DB.get('ai_connections', conv.connection_id);
    if (!conn) { UI.toast('连接不存在','error'); return; }

    // 保存用户消息
    const userMsg = await DB.save('ai_messages', {
      conversation_id: convId, role: 'user', content: text, status: 'sent',
    });

    const cm = document.getElementById('chatMessages');
    cm.innerHTML += this._renderMsg(userMsg);

    // 创建 AI 消息占位（流式更新）
    const placeholderId = 'ai-streaming-' + Date.now();
    cm.innerHTML += `
      <div id="${placeholderId}" style="display:flex;justify-content:flex-start;margin-bottom:8px">
        <div class="chat-msg chat-msg--ai">
          <span class="spinner" style="width:16px;height:16px;display:inline-block"></span>
          <div class="chat-msg__actions">
            <span class="chat-msg__action" onclick="AIChatModule._stopGeneration()">停止</span>
          </div>
        </div>
      </div>
    `;
    cm.scrollTop = cm.scrollHeight;

    // 构建上下文
    const apiKey = conn.api_key_encrypted ? await this._decryptKey(conn.api_key_encrypted) : '';
    const { messages } = await this._orchestrate(conv, text);

    try {
      const reply = await this._callAPI(conn, messages, apiKey, {
        stream: true,
        onChunk: (delta, fullText) => {
          const el = document.getElementById(placeholderId);
          if (el) el.innerHTML = this._renderStreamingMsg(fullText);
          cm.scrollTop = cm.scrollHeight;
        },
        onDone: async (fullText) => {
          const el = document.getElementById(placeholderId);
          if (el) el.remove();
          const aiMsg = await DB.save('ai_messages', {
            conversation_id: convId, role: 'assistant', content: fullText, status: 'complete',
          });
          cm.innerHTML += this._renderMsg(aiMsg);
          cm.scrollTop = cm.scrollHeight;
        },
      });
    } catch (err) {
      const el = document.getElementById(placeholderId);
      if (el) el.remove();
      UI.toast('发送失败：'+err.message,'error',5000);
      const errMsg = await DB.save('ai_messages', {
        conversation_id: convId, role: 'assistant', content: `[发送失败] ${err.message}`, status: 'error',
      });
      cm.innerHTML += this._renderMsg(errMsg);
    }
  },

  // ============ 提示词编排器 ============
  async _buildContext(conv, currentText) {
    const { messages } = await this._orchestrate(conv, currentText || '');
    return messages;
  },

  _getSafetyPrompt() {
    return '【基础安全与事实边界】\n' +
      '1. 所有角色口吻文字为象征性/创意文本，仅供自我探索与娱乐，不代表现实人物的真实想法。\n' +
      '2. 不得使用"对方一定在想你""命中注定"等确定性表达。\n' +
      '3. 不冒充现实人物，不伪造现实事件。\n' +
      '4. 涉及未成年角色的内容必须符合安全准则。\n' +
      '5. 用户标注为"绝不能被AI引用"的信息不得出现在任何形式中。';
  },

  async _orchestrate(conv, currentText, opts = {}) {
    const debug = { steps: [], matchedLorebook: [], macros: {}, warnings: [] };
    const parts = []; // { label, content, position, order }

    // Step 1: 基础安全与事实边界
    parts.push({ label: '基础安全与事实边界', content: this._getSafetyPrompt(), position: 'system', order: 0 });

    // 宏值
    const macros = await this._getMacroValues(conv);
    debug.macros = macros;

    // Step 2: 预设系统提示
    if (conv.preset_id) {
      const preset = await DB.get('ai_resources', conv.preset_id);
      if (preset) {
        const sp = preset.data.system_prompt || '';
        if (sp) {
          parts.push({ label: '预设系统提示', content: this._applyMacros(sp, macros), position: 'system', order: 1 });
        }
        const presetInstr = this._formatPresetFields(preset.data, macros);
        if (presetInstr) {
          parts.push({ label: '预设指令', content: presetInstr, position: 'system', order: 1.5 });
        }
      }
    }

    // Step 3: 对方角色卡
    if (conv.character_id) {
      const char = await DB.get('ai_resources', conv.character_id);
      if (char) {
        parts.push({ label: '对方角色卡', content: this._formatResource(char), position: 'system', order: 2 });
      }
    }

    // Step 4: 我的角色卡
    if (conv.persona_id) {
      const persona = await DB.get('ai_resources', conv.persona_id);
      if (persona) {
        parts.push({ label: '我的角色卡', content: this._formatResource(persona), position: 'system', order: 3 });
      }
    }

    // Step 5 & 6: 世界书（常驻 + 关键词触发）
    const lorebooks = await this._getLorebooks(conv.lorebook_ids || []);
    const alwaysOnEntries = [];
    for (const lb of lorebooks) {
      for (const e of (lb.data.entries || [])) {
        if (e.trigger_type === '常驻（always_active）' && e.enabled !== '停用') {
          alwaysOnEntries.push(e);
        }
      }
    }
    if (alwaysOnEntries.length > 0) {
      parts.push({
        label: '常驻世界书',
        content: alwaysOnEntries.map(e => `【${e.entry_title}】\n${e.entry_content || ''}`).join('\n\n'),
        position: 'system', order: 4,
      });
    }

    // 关键词匹配
    const recentText = await this._getRecentText(conv, 5);
    const matchContext = (currentText || '') + ' ' + recentText;
    const keywordEntries = this._matchLorebook(lorebooks, matchContext, alwaysOnEntries);
    debug.matchedLorebook = keywordEntries.map(e => e.entry_title);

    if (keywordEntries.length > 0) {
      const sysEntries = keywordEntries.filter(e => (e.insert_position || 'system') === 'system');
      const beforeEntries = keywordEntries.filter(e => e.insert_position === 'before_last');
      const afterEntries = keywordEntries.filter(e => e.insert_position === 'after_last');
      if (sysEntries.length) parts.push({ label: '关键词世界书', content: sysEntries.map(e => `【${e.entry_title}】\n${e.entry_content||''}`).join('\n\n'), position: 'system', order: 5 });
      if (beforeEntries.length) parts.push({ label: '关键词世界书(消息前)', content: beforeEntries.map(e => `【${e.entry_title}】\n${e.entry_content||''}`).join('\n\n'), position: 'before_last', order: 5.5 });
      if (afterEntries.length) parts.push({ label: '关键词世界书(消息后)', content: afterEntries.map(e => `【${e.entry_title}】\n${e.entry_content||''}`).join('\n\n'), position: 'after_last', order: 5.8 });
    }

    // Step 7: 手工长记忆
    const memories = await this._getActiveMemories(conv.memory_ids || []);
    if (memories.length > 0) {
      parts.push({ label: '手工长记忆', content: memories.map(m => this._formatMemory(m)).join('\n\n'), position: 'system', order: 6 });
    }

    // Step 8: 自动长记忆
    const autoMems = (await DB.list('ai_memories')).filter(m => !m.deleted_at && m.conversation_id === conv.id && !m.stale);
    if (autoMems.length > 0) {
      parts.push({ label: '自动长记忆', content: autoMems.map(m => `【${m.title||'记忆'}】${m.content||''}`).join('\n\n'), position: 'system', order: 7 });
    }

    // Step 9: 工作台摘要
    const summary = await this._buildSummary();
    if (summary) {
      parts.push({ label: '工作台摘要', content: summary, position: 'system', order: 8 });
    }

    // Step 10: AI 安全标注
    parts.push({ label: 'AI标注', content: '【重要】所有角色口吻文字为象征性/创意文本，仅供自我探索与娱乐，不代表现实人物的真实想法。不得使用"对方一定在想你""命中注定"等确定性表达。', position: 'system', order: 9 });

    // 自定义排序
    const customOrder = await this._getCustomPromptOrder(conv);
    if (customOrder) {
      parts.sort((a, b) => {
        const ia = customOrder.indexOf(a.label);
        const ib = customOrder.indexOf(b.label);
        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      });
    } else {
      parts.sort((a, b) => a.order - b.order);
    }

    // 组装 messages
    const messages = [];
    const sysParts = parts.filter(p => p.position === 'system');
    if (sysParts.length > 0) {
      messages.push({ role: 'system', content: sysParts.map(p => `=== ${p.label} ===\n${p.content}`).join('\n\n') });
    }

    // 历史消息
    const history = await this._getHistory(conv, 20);
    history.forEach(m => messages.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }));

    // before_last 插入
    const beforeParts = parts.filter(p => p.position === 'before_last');
    if (beforeParts.length > 0 && messages.length > 0) {
      messages.splice(messages.length - 1, 0, { role: 'system', content: beforeParts.map(p => p.content).join('\n\n') });
    }

    // after_last 插入
    const afterParts = parts.filter(p => p.position === 'after_last');
    if (afterParts.length > 0) {
      messages.push({ role: 'system', content: afterParts.map(p => p.content).join('\n\n') });
    }

    // Step 11: 预设历史后指令
    if (conv.preset_id) {
      const preset = await DB.get('ai_resources', conv.preset_id);
      if (preset?.data?.post_history_prompt) {
        messages.push({ role: 'system', content: this._applyMacros(preset.data.post_history_prompt, macros) });
      }
    }

    debug.steps = parts.map(p => ({ step: p.label, tokens_est: Math.ceil((p.content||'').length / 4), position: p.position }));
    this._lastDebug = debug;
    return { messages, debug };
  },

  async _getMacroValues(conv) {
    const macros = {
      datetime: nowISO().slice(0, 16).replace('T', ' '),
      date: todayKey(),
      time: new Date().toTimeString().slice(0, 5),
      conversation_title: conv.title || '未命名对话',
      user_nickname: App.state.settings.user_nickname || '用户',
    };
    if (conv.character_id) {
      const char = await DB.get('ai_resources', conv.character_id);
      if (char) macros.character_name = char.data.name || char.data.nickname || '';
    }
    if (conv.persona_id) {
      const persona = await DB.get('ai_resources', conv.persona_id);
      if (persona) macros.user_name = persona.data.preferred_address || persona.data.name || '';
    }
    return macros;
  },

  _applyMacros(text, macros) {
    if (!text) return '';
    let result = text;
    for (const [key, value] of Object.entries(macros)) {
      const regex = new RegExp(`\\{\\{\\s*${key}\\s*\\}\\}`, 'g');
      result = result.replace(regex, value || `[未定义:${key}]`);
    }
    // 清理未匹配的宏
    result = result.replace(/\{\{[^}]+\}\}/g, (m) => `[未知宏:${m}]`);
    return result;
  },

  _formatResource(resource) {
    const data = resource.data || {};
    const lines = [];
    for (const [key, value] of Object.entries(data)) {
      if (value && typeof value === 'string' && value.trim()) {
        const label = this._getFieldLabel(resource.kind, key);
        lines.push(`${label}: ${value}`);
      }
    }
    return lines.join('\n');
  },

  _getFieldLabel(kind, key) {
    const schema = this._schemas[kind] || [];
    const field = schema.find(f => f.key === key);
    return field ? field.label : key;
  },

  _formatPresetFields(data, macros) {
    const skip = ['system_prompt', 'post_history_prompt', 'prompt_order'];
    const lines = [];
    for (const [key, value] of Object.entries(data)) {
      if (skip.includes(key) || !value || !String(value).trim()) continue;
      const label = this._getFieldLabel('preset', key);
      lines.push(`${label}: ${value}`);
    }
    return lines.join('\n');
  },

  _formatMemory(mem) {
    const d = mem.data || mem;
    const parts = [];
    if (d.title) parts.push(`标题: ${d.title}`);
    if (d.involved_parties) parts.push(`涉及: ${d.involved_parties}`);
    if (d.time_range) parts.push(`时间: ${d.time_range}`);
    if (d.facts) parts.push(`事实: ${d.facts}`);
    if (d.user_feelings) parts.push(`感受: ${d.user_feelings}`);
    if (d.relationship_changes) parts.push(`关系变化: ${d.relationship_changes}`);
    if (d.stable_prefs) parts.push(`稳定偏好: ${d.stable_prefs}`);
    if (d.unfulfilled_promises) parts.push(`未完成约定: ${d.unfulfilled_promises}`);
    return parts.join('\n');
  },

  async _getLorebooks(ids) {
    const result = [];
    for (const id of ids) {
      const lb = await DB.get('ai_resources', id);
      if (lb && !lb.deleted_at) result.push(lb);
    }
    return result;
  },

  _matchLorebook(lorebooks, context, excludeEntries = []) {
    const excludeTitles = new Set(excludeEntries.map(e => e.entry_title));
    const ctxLower = (context || '').toLowerCase();
    const matched = [];
    for (const lb of lorebooks) {
      for (const entry of (lb.data.entries || [])) {
        if (entry.trigger_type !== '关键词触发（keyword）') continue;
        if (entry.enabled === '停用') continue;
        if (excludeTitles.has(entry.entry_title)) continue;
        const keywords = (entry.keywords || '').split(',').map(k => k.trim().toLowerCase()).filter(Boolean);
        const hit = keywords.some(kw => kw && ctxLower.includes(kw));
        if (hit) matched.push(entry);
      }
    }
    matched.sort((a, b) => (parseInt(b.priority) || 10) - (parseInt(a.priority) || 10));
    return matched;
  },

  async _getActiveMemories(ids) {
    const result = [];
    for (const id of ids) {
      const m = await DB.get('ai_resources', id);
      if (m && !m.deleted_at && m.data?.active !== '停用') result.push(m);
    }
    return result;
  },

  async _getHistory(conv, limit) {
    const all = (await DB.list('ai_messages'))
      .filter(m => !m.deleted_at && m.conversation_id === conv.id && !m.branch_archived)
      .sort((a, b) => a.created_at.localeCompare(b.created_at));
    return all.slice(-limit);
  },

  async _getRecentText(conv, count) {
    const history = await this._getHistory(conv, count);
    return history.map(m => m.content || '').join(' ');
  },

  async _getCustomPromptOrder(conv) {
    if (!conv.preset_id) return null;
    const preset = await DB.get('ai_resources', conv.preset_id);
    if (!preset?.data?.prompt_order) return null;
    const orderStr = preset.data.prompt_order.trim();
    if (!orderStr) return null;
    return orderStr.split(',').map(s => s.trim()).filter(Boolean);
  },

  // 顶部日期过滤条：当有 dateFilter 时显示"当前过滤：xx，显示全部"提示
  _renderDateFilterBar(messages) {
    const df = this._state.dateFilter;
    if (!df) return '';
    const count = messages.filter(m => (m.created_at || '').slice(0, 10) === df).length;
    return `
      <div class="date-filter-bar">
        <span>📆 当前只看：<b>${df}</b>（${count} 条）</span>
        <button class="btn btn--sm btn--ghost" onclick="AIChatModule._clearDateFilter()">显示全部</button>
      </div>
    `;
  },

  // 显示日历面板
  async _showCalendar(convId) {
    const messages = (await DB.list('ai_messages')).filter(m => !m.deleted_at && m.conversation_id === convId && !m.branch_archived);
    const daysWithMsgs = new Set();
    messages.forEach(m => { const d = (m.created_at || '').slice(0, 10); if (d) daysWithMsgs.add(d); });
    if (daysWithMsgs.size === 0) {
      UI.toast('当前对话还没有消息', 'info', 2000);
      return;
    }
    const dates = [...daysWithMsgs].sort();
    const latest = dates[dates.length - 1];
    this._calView = { y: +latest.slice(0, 4), m: +latest.slice(5, 7), days: daysWithMsgs, convId };
    this._renderCalendar();
  },

  _renderCalendar() {
    const { y, m, days, convId } = this._calView;
    const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    const firstDay = new Date(y, m - 1, 1).getDay();
    const daysInMonth = new Date(y, m, 0).getDate();
    const today = new Date();
    const todayKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const df = this._state.dateFilter;

    const cells = [];
    for (let i = 0; i < firstDay; i++) cells.push('<div class="cal-cell cal-empty"></div>');
    for (let d = 1; d <= daysInMonth; d++) {
      const k = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const has = days.has(k);
      const isToday = k === todayKey;
      const isSel = k === df;
      cells.push(`<div class="cal-cell ${has?'cal-has':''} ${isToday?'cal-today':''} ${isSel?'cal-sel':''}" data-key="${k}">
        <span class="cal-d">${d}</span>
        ${has ? '<span class="cal-dot"></span>' : ''}
      </div>`);
    }
    while (cells.length % 7 !== 0) cells.push('<div class="cal-cell cal-empty"></div>');

    const html = `
      <div class="cal-panel">
        <div class="cal-head">
          <button class="btn btn--sm btn--ghost" onclick="AIChatModule._calNav(-1)">‹</button>
          <div class="cal-title">${y}年 ${monthNames[m-1]}</div>
          <button class="btn btn--sm btn--ghost" onclick="AIChatModule._calNav(1)">›</button>
        </div>
        <div class="cal-weekrow">

    m += delta;
    if (m < 1) { m = 12; y--; }
    if (m > 12) { m = 1; y++; }
    this._calView.y = y;
    this._calView.m = m;
    this._renderCalendar();
  },

      if (tasks.length) parts.push(`今日任务: ${tasks.length}个，完成${tasks.filter(t=>t.completed).length}个`);

  async _copyMsg(id) {

  async _editMsg(id) {
    // 回溯编辑：停止生成 → 封存后续 → 创建分支记录 → 原文放回输入框
    this._stopGeneration();
    const m = await DB.get('ai_messages', id);
    if (!m) return;
    if (!await UI.confirm('编辑此消息会封存后续回复分支（可恢复）。继续？')) return;

    const all = (await DB.list('ai_messages')).filter(x => !x.deleted_at && x.conversation_id === m.conversation_id && !x.branch_archived).sort((a,b)=>a.created_at.localeCompare(b.created_at));
    const idx = all.findIndex(x => x.id === id);
    const archivedIds = [];
    for (let i = idx+1; i < all.length; i++) {
      all[i].branch_archived = true;
      all[i].archived_reason = 'edit-branch';
      all[i].archived_at = nowISO();
      await DB.save('ai_messages', all[i]);
      archivedIds.push(all[i].id);
    }
    if (archivedIds.length > 0) {
      await this._createBranchRecord(m.conversation_id, id, 'edit-branch', archivedIds);
      await this._markStaleMemories(m.conversation_id, archivedIds);
    }
    document.getElementById('chatInput').value = m.content;
    await DB.hardDelete('ai_messages', id);
    UI.toast('已放入输入框，后续已封存','info');
    this.openChat(m.conversation_id);
  },

  async _regen(id) {
    // 让他重说：停止生成 → 封存当前回复及后续 → 流式重新生成
    this._stopGeneration();
    const m = await DB.get('ai_messages', id);
    if (!m || m.role !== 'assistant') return;

    m.branch_archived = true;
    m.archived_reason = 'regen-branch';
    m.archived_at = nowISO();
    await DB.save('ai_messages', m);

    const all = (await DB.list('ai_messages')).filter(x => !x.deleted_at && x.conversation_id === m.conversation_id && !x.branch_archived).sort((a,b)=>a.created_at.localeCompare(b.created_at));
    const archivedIds = [m.id];
    for (const msg of all) {
      if (msg.created_at > m.created_at) {
        msg.branch_archived = true;
        msg.archived_reason = 'regen-branch';
        await DB.save('ai_messages', msg);
        archivedIds.push(msg.id);
      }
    }
    await this._createBranchRecord(m.conversation_id, m.id, 'regen-branch', archivedIds);
    await this._markStaleMemories(m.conversation_id, archivedIds);

    this.openChat(m.conversation_id);

    const conv = await DB.get('ai_conversations', m.conversation_id);
    const conn = await DB.get('ai_connections', conv.connection_id);
    const apiKey = conn.api_key_encrypted ? await this._decryptKey(conn.api_key_encrypted) : '';
    const { messages } = await this._orchestrate(conv, '');

    const cm = document.getElementById('chatMessages');
    const placeholderId = 'ai-regen-' + Date.now();
    if (cm) {
      cm.innerHTML += `<div id="${placeholderId}" style="display:flex;justify-content:flex-start;margin-bottom:8px"><div class="chat-msg chat-msg--ai"><span class="spinner" style="width:16px;height:16px;display:inline-block"></span><div class="chat-msg__actions"><span class="chat-msg__action" onclick="AIChatModule._stopGeneration()">停止</span></div></div></div>`;
      cm.scrollTop = cm.scrollHeight;
    }

    try {
      await this._callAPI(conn, messages, apiKey, {
        stream: true,
        onChunk: (delta, fullText) => {
          const el = document.getElementById(placeholderId);
          if (el) el.innerHTML = this._renderStreamingMsg(fullText);
          if (cm) cm.scrollTop = cm.scrollHeight;
        },
        onDone: async (fullText) => {
          const el = document.getElementById(placeholderId);
          if (el) el.remove();
          const aiMsg = await DB.save('ai_messages', { conversation_id: m.conversation_id, role: 'assistant', content: fullText, status: 'complete' });
          this.openChat(m.conversation_id);
        },
      });
    } catch (err) {
      UI.toast('重新生成失败：'+err.message,'error');
    }
  },

  // ============ 分支系统 ============
  async _createBranchRecord(convId, branchPointMsgId, reason, archivedMsgIds) {
    await DB.save('ai_branches', {
      conversation_id: convId,
      branch_point_message_id: branchPointMsgId,
      reason,
      archived_message_ids: archivedMsgIds,
      restored: false,
    });
  },

  async _markStaleMemories(convId, archivedMsgIds) {
    const memories = (await DB.list('ai_memories')).filter(m => !m.deleted_at && m.conversation_id === convId && !m.stale);
    for (const mem of memories) {
      if (mem.source_message_ids && mem.source_message_ids.some(id => archivedMsgIds.includes(id))) {
        mem.stale = true;
        mem.stale_reason = 'branch_archived';
        mem.stale_at = nowISO();
        await DB.save('ai_memories', mem);
      }
    }
  },

  async _showBranchTree(convId) {
    const branches = (await DB.list('ai_branches')).filter(b => !b.deleted_at && b.conversation_id === convId).sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
    if (branches.length === 0) { UI.toast('没有分支历史','info'); return; }
    UI.modal('分支历史', `
      <div class="branch-tree">
        <p class="text-soft text-sm mb-3">被封存的分支可以恢复。恢复后当前活跃分支将被封存。</p>
        ${branches.map((b, i) => `
          <div class="card--blur" style="padding:12px;margin-bottom:8px">
            <div class="flex justify-between items-center">
              <div>
                <div class="font-bold text-sm">
                  分支 ${branches.length - i}
                  <span class="tag-chip" style="font-size:10px;padding:1px 6px">${b.reason === 'edit-branch' ? '回溯编辑' : b.reason === 'regen-branch' ? '重说' : '恢复'}</span>
                </div>
                <div class="text-faint text-xs">${b.created_at?.slice(0,16).replace('T',' ')||''}</div>
                <div class="text-faint text-xs">封存 ${b.archived_message_ids?.length||0} 条消息</div>
              </div>
              <button class="btn btn--sm btn--ghost" onclick="AIChatModule._restoreBranch('${b.id}')">恢复</button>
            </div>
          </div>
        `).join('')}
      </div>
    `);
  },

  async _restoreBranch(branchId) {
    const branch = await DB.get('ai_branches', branchId);
    if (!branch) return;
    if (!await UI.confirm('恢复此分支？当前活跃分支将被封存。')) return;
    const convId = branch.conversation_id;

    // 封存当前活跃
    const currentActive = (await DB.list('ai_messages')).filter(m => !m.deleted_at && m.conversation_id === convId && !m.branch_archived);
    const currentArchivedIds = [];
    for (const m of currentActive) {
      m.branch_archived = true;
      m.archived_reason = 'restore-other-branch';
      await DB.save('ai_messages', m);
      currentArchivedIds.push(m.id);
    }
    if (currentArchivedIds.length > 0) {
      await this._createBranchRecord(convId, currentActive[0]?.id || '', 'restore-other-branch', currentArchivedIds);
    }

    // 恢复目标分支
    for (const msgId of (branch.archived_message_ids || [])) {
      const msg = await DB.get('ai_messages', msgId);
      if (msg) {
        msg.branch_archived = false;
        msg.archived_reason = null;
        await DB.save('ai_messages', msg);
      }
    }
    branch.restored = true;
    branch.restored_at = nowISO();
    await DB.save('ai_branches', branch);

    UI.closeModal();
    UI.toast('分支已恢复','success');
    this.openChat(convId);
  },

    await DB.save('bookmarks', {

  _showSearch(convId) {
    UI.modal('搜索消息', `
      <div class="field"><label class="field__label">关键词</label><input class="input" id="searchKeyword" placeholder="搜索消息内容..."></div>
      <div class="grid grid-2">
        <div class="field"><label class="field__label">开始日期</label><input class="input" type="date" id="searchDateFrom"></div>
        <div class="field"><label class="field__label">结束日期</label><input class="input" type="date" id="searchDateTo"></div>
      </div>
      <div class="grid grid-2">
        <div class="field"><label class="field__label">发言方</label><select class="select" id="searchRole"><option value="">全部</option><option value="user">我说的</option><option value="assistant">AI说的</option></select></div>
        <div class="field"><label class="field__label">是否收藏</label><select class="select" id="searchBookmarked"><option value="">全部</option><option value="yes">仅收藏</option></select></div>
      </div>
      <button class="btn btn--primary btn--block" onclick="AIChatModule._doSearch('${convId}')">搜索</button>
      <div id="searchResults" class="mt-3"></div>
    `);
  },

  async _doSearch(convId) {
    const keyword = document.getElementById('searchKeyword').value.trim().toLowerCase();
    const dateFrom = document.getElementById('searchDateFrom').value;
    const dateTo = document.getElementById('searchDateTo').value;
    const role = document.getElementById('searchRole').value;
    const bookmarkedOnly = document.getElementById('searchBookmarked').value === 'yes';

    let messages = (await DB.list('ai_messages')).filter(m => !m.deleted_at && m.conversation_id === convId);
    if (keyword) messages = messages.filter(m => (m.content||'').toLowerCase().includes(keyword));
    if (dateFrom) messages = messages.filter(m => (m.created_at||'') >= dateFrom);
    if (dateTo) messages = messages.filter(m => (m.created_at||'') <= dateTo + 'T23:59:59');
    if (role) messages = messages.filter(m => m.role === role);
    if (bookmarkedOnly) {
      const bookmarks = (await DB.list('bookmarks')).filter(b => !b.deleted_at && b.conversation_id === convId);
      const bookmarkedIds = new Set(bookmarks.map(b => b.source_id));
      messages = messages.filter(m => bookmarkedIds.has(m.id));
    }
    messages.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));

    const resultsEl = document.getElementById('searchResults');
    if (messages.length === 0) { resultsEl.innerHTML = '<p class="text-faint text-center">没有匹配结果</p>'; return; }
    resultsEl.innerHTML = `
      <div class="text-soft text-xs mb-2">找到 ${messages.length} 条结果</div>
      ${messages.map(m => `
        <div class="list-item" style="cursor:pointer;flex-direction:column;align-items:flex-start" onclick="AIChatModule._jumpToMsg('${convId}','${m.id}')">
          <div class="flex gap-2 w-full">
            <span class="tag-chip" style="font-size:10px;padding:1px 6px">${m.role === 'user' ? '我' : 'AI'}</span>
            <span class="text-faint text-xs">${m.created_at?.slice(0,16).replace('T',' ')||''}</span>
          </div>
          <div class="text-sm mt-1" style="white-space:pre-wrap">${this._highlightKeyword(m.content, keyword)}</div>
        </div>
      `).join('')}
    `;
  },

  _highlightKeyword(text, keyword) {
    if (!keyword) return this._escapeHtml(text);
    const escaped = this._escapeHtml(text);
    const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return escaped.replace(regex, '<mark style="background:var(--color-rose-soft);color:var(--color-primary);padding:0 2px;border-radius:2px">$1</mark>');
  },

  async _jumpToMsg(convId, msgId) {

      const el = document.querySelector(`[data-msg-id="${msgId}"]`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.style.transition = 'background 0.5s';
        el.style.background = 'var(--color-rose-soft)';
        setTimeout(() => { el.style.background = ''; }, 2000);
      }
    }, 300);
  },

  async _exportFragment(convId) {

    if (ids.length === 0) { UI.toast('请先选择消息','error'); return; }
    UI.modal('导出片段', `
      <div class="flex flex-col gap-2">
        <button class="btn btn--ghost btn--block" onclick="AIChatModule._doExportFragment('${convId}','txt')">导出为 TXT</button>
        <button class="btn btn--ghost btn--block" onclick="AIChatModule._doExportFragment('${convId}','json')">导出为 JSON</button>
        <button class="btn btn--ghost btn--block" onclick="AIChatModule._doExportFragment('${convId}','md')">导出为 Markdown</button>
      </div>
    `);
  },

  async _doExportFragment(convId, format) {
    const ids = [...this._state.selectedMsgIds];
    const msgs = [];
    for (const id of ids) { const m = await DB.get('ai_messages', id); if (m) msgs.push(m); }
    msgs.sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
    const conv = await DB.get('ai_conversations', convId);
    let content = '', mime = '', ext = '';
    if (format === 'txt') {
      content = `对话片段 - ${conv?.title||''}\n导出时间: ${nowISO()}\n${'='.repeat(40)}\n\n`;
      content += msgs.map(m => `[${m.created_at?.slice(0,19).replace('T',' ')||''}] ${m.role === 'user' ? '我' : 'AI'}:\n${m.content}\n`).join('\n');
      mime = 'text/plain;charset=utf-8'; ext = 'txt';
    } else if (format === 'json') {
      content = JSON.stringify({ conversation: conv?.title, exported_at: nowISO(), messages: msgs.map(m => ({ role: m.role, content: m.content, created_at: m.created_at })) }, null, 2);
      mime = 'application/json;charset=utf-8'; ext = 'json';
    } else if (format === 'md') {
      content = `## 对话片段 - ${conv?.title||''}\n\n> 导出时间: ${nowISO()}\n\n`;
      content += msgs.map(m => `**${m.role === 'user' ? '我' : 'AI'}** (${m.created_at?.slice(0,19).replace('T',' ')||''}):\n\n${m.content}\n`).join('\n---\n\n');
      mime = 'text/markdown;charset=utf-8'; ext = 'md';
    }
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `对话片段-${todayKey()}.${ext}`; a.click();
    URL.revokeObjectURL(url);
    UI.closeModal();
    UI.toast('已导出','success');
  },

    bookmarks.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));

const AngelModule = (function () {

  /* ---------- 工具 ---------- */
  function esc(s) {

  /* ---------- 默认动向标签（种子） ---------- */

  /* ---------- 一次性迁移：旧 localStorage -> IndexedDB（旧键保留，只复制不删除） ---------- */
  async function migrateFromLegacy() {
    try {
      if (localStorage.getItem(MIGRATED_KEY) === '1') return { skipped: true };
      const raw = localStorage.getItem('angel_numbers_v1');
      if (raw) {
        const store = JSON.parse(raw);
        const records = Array.isArray(store.records) ? store.records : [];
        let added = 0;
        const existingRec = await loadRecords();
        const existingIds = new Set(existingRec.map(r => r.id));
        for (const r of records) {
          if (r && r.id && !existingIds.has(r.id)) {
            // 把结果重新按当前词典补算，保证结构字段齐全
            const grps = Array.isArray(r.groups) ? r.groups : [];
            const dict = await getDict();
            r.results = { groups: grps.map(g => generateGroupResult(g, dict)) };
            await saveRecord(r); added++;
          }
        }
        // 私人约定
        const p = store.dict && Array.isArray(store.dict.personal) ? store.dict.personal : [];
        if (p.length) {
          const cur = await loadPersonal();
          const curNum = new Set(cur.map(x => x.number));
          for (const item of p) { if (item && item.number && !curNum.has(item.number)) await DB.put('angel_personal', { id: item.number, number: item.number, meaning: item.meaning }); }
        }
        // 词典编辑标记 + 编辑值
        const edited = Array.isArray(store.dictEdited) ? store.dictEdited : [];
        const udict = store.dict && typeof store.dict === 'object' ? store.dict : {};
        for (const k of edited) {
          const val = extractEditedValue(k, udict);
          if (val !== undefined) await saveDictEdit(k, val);
        }
        // 自定义标签
        try {
          const tags = JSON.parse(localStorage.getItem('angel_recent_tags')) || [];
          const curTags = await loadCustomTags();
          for (const t of tags) { if (t && !curTags.includes(t)) await DB.put('angel_custom_tags', { id: t, name: t }); }
        } catch (e) { /* ignore */ }
        localStorage.setItem(MIGRATED_KEY, '1');
        return { migrated: true, added };
      }
      localStorage.setItem(MIGRATED_KEY, '1');
      return { skipped: true };
    } catch (e) {
      console.warn('[Angel] 旧数据迁移失败（不影响使用）:', e);
      return { error: true };

  }
  function extractEditedValue(key, udict) {
    // 把词典编辑值从旧结构里取出来，转成 angel_dict 的 value
    if (key.indexOf('digit:') === 0) {
      const d = key.slice(6);
      const u = udict.digits && udict.digits[d];
      if (!u) return undefined;
      const base = { core: u.core, overview: u.overview, translations: u.translations };
      const editedAspects = (Array.isArray(u.aspects) ? u.aspects : []).map(a => ({ id: a.id, label: a.label, text: a.text, conditions: a.conditions }));
      return { kind: 'digit', digit: d, base, aspects: editedAspects };
    }
    if (key.indexOf('aspect:') === 0) {
      const aId = key.slice(7);
      // 在 SEED 里找它属于哪个数位
      for (const d of Object.keys(SEED_DICT.digits)) {
        const sa = SEED_DICT.digits[d].aspects.find(x => x.id === aId);
        if (sa) {
          const u = udict.digits && udict.digits[d];
          const ua = u && Array.isArray(u.aspects) ? u.aspects.find(x => x.id === aId) : null;
          if (ua) return { kind: 'aspect', aspectId: aId, aspect: { id: ua.id, label: ua.label, text: ua.text, conditions: ua.conditions } };
        }
      }
      return undefined;
    }
    if (key.indexOf('pair:') === 0) {
      const k = key.slice(5);
      const v = udict.pairs && udict.pairs[k];
      return v ? { kind: 'pair', key: k, value: v } : undefined;
    }
    if (key.indexOf('narr:') === 0) {
      const k = key.slice(5);
      const v = Array.isArray(udict.narratives) ? udict.narratives.find(n => n.key === k) : null;
      return v ? { kind: 'narr', key: k, value: { key: v.key, label: v.label, text: v.text } } : undefined;
    }
    return undefined;
  }

  /* ---------- 有效词典 = 种子 + 用户编辑（带编辑标记的用用户版，种子升级不覆盖） ---------- */
  async function getDict() {
    const edits = await loadDictEdits();
    const cp = o => JSON.parse(JSON.stringify(o));
    const merged = { digits: {}, pairs: {}, narratives: [], personal: await loadPersonal() };
    for (const d of Object.keys(SEED_DICT.digits)) {
      const seed = SEED_DICT.digits[d];
      const de = edits['digit:' + d];
      let base;
      if (de && de.kind === 'digit') base = { core: de.base.core, overview: de.base.overview, translations: de.base.translations };
      else base = { core: seed.core, overview: seed.overview, translations: cp(seed.translations) };
      const seedIds = new Set(seed.aspects.map(a => a.id));
      const outA = [];
      // 用户新增/编辑过的面向
      const customAspects = [];
      for (const k of Object.keys(edits)) {
        if (k.indexOf('aspect:') === 0 && edits[k].kind === 'aspect') {
          const ae = edits[k].aspect;
          if (ae.id && seedIds.has(ae.id)) {
            outA.push(cp(ae)); // 用户编辑的种子面向
          } else {
            customAspects.push(cp(ae)); // 用户新增的面向
          }
        }
      }
      for (const sa of seed.aspects) {
        if (!outA.some(a => a.id === sa.id)) outA.push(cp(sa)); // 未编辑的跟种子走
      }
      outA.push(...customAspects.filter(a => !outA.some(x => x.id === a.id)));
      merged.digits[d] = { core: base.core, overview: base.overview, translations: base.translations, aspects: outA };
    }
    for (const k of Object.keys(SEED_DICT.pairs)) {
      const e = edits['pair:' + k];
      merged.pairs[k] = (e && e.kind === 'pair' && e.value) ? e.value : cp(SEED_DICT.pairs[k]);
    }
    merged.narratives = SEED_DICT.narratives.map(sn => {
      const e = edits['narr:' + sn.key];
      return (e && e.kind === 'narr' && e.value) ? e.value : cp(sn);
    });
    return merged;
  }

  /* ---------- 纯引擎（复用独立工具逻辑） ---------- */
  const EMPTY_PATTERNS = ['什么都没想', '什么都没', '没有想什么', '无特定', '无念头', '空白', '没有', '无', 'nothing'];
  function isEmptyThought(t) {
    const s = String(t || '').trim().toLowerCase();
    if (!s) return true;
    return EMPTY_PATTERNS.some(p => s.includes(p.toLowerCase()));
  }
  function scoreAspect(aspect, ctx, digit) {
    const c = aspect.conditions || {};
    const hasCond = !!((c.thoughtContains && c.thoughtContains.length) || c.emptyThought || (c.recent && c.recent.length) || (c.mood && c.mood.length));
    if (!hasCond) {
      let score = 3; const reasons = ['默认面向 +3'];
      if (ctx.emptyThought && ['1', '5', '7', '8', '9'].includes(digit) && ['中性', '平静'].includes(ctx.mood)) {
        score = 1; reasons.length = 0; reasons.push('你没有特定念头，默认的确认/运作/完成类面向自然降权');
      }
      return { score, reasons, conditioned: false, hit: false };
    }
    let score = 2; const reasons = ['条件面向基础 +2'];
    const hitThought = !!(c.thoughtContains && c.thoughtContains.length) && !ctx.emptyThought && c.thoughtContains.some(k => ctx.thought.includes(k));
    const hitEmpty = !!c.emptyThought && ctx.emptyThought;
    const hitRecent = !!(c.recent && c.recent.length) && c.recent.some(r => ctx.recent.includes(r));
    const hitMood = !!(c.mood && c.mood.length) && c.mood.includes(ctx.mood);
    const checks = [];
    if (c.thoughtContains && c.thoughtContains.length) checks.push(hitThought);
    if (c.emptyThought) checks.push(hitEmpty);
    if (c.recent && c.recent.length) checks.push(hitRecent);
    if (c.mood && c.mood.length) checks.push(hitMood);
    const isHit = c.requireAll ? checks.every(Boolean) : checks.some(Boolean);
    if (!isHit) { return { score: 0, reasons: ['触发条件未命中 -2'], conditioned: true, hit: false }; }
    if (hitThought) { score += 5; reasons.push('念头语义匹配 +5'); }
    else if (hitEmpty) { score += 4; reasons.push('无特定念头 +4'); }
    else if (hitRecent) { score += 3; reasons.push('链接动向匹配 +3'); }
    else if (hitMood) { score += 2; reasons.push('心理状态匹配 +2'); }
    return { score, reasons, conditioned: true, hit: true };
  }
  function structureBonus(numStr, digit, dict) {
    let bonus = 0; const reasons = [];
    const digits = numStr.split('');
    const core = (dict.digits[digit] && dict.digits[digit].core) || digit;
    const cnt = digits.filter(x => x === digit).length;
    if (cnt >= 2) { bonus += 2; reasons.push(core + '×' + cnt + ' 同位重复 +2'); }
    if (digits.every(x => x === digits[0])) { bonus += 1; reasons.push('所有数位相同 +1'); }
    if (numStr.length >= 2 && numStr === [...numStr].reverse().join('')) { bonus += 1; reasons.push('首尾镜像 +1'); }
    return { bonus, reasons };
  }
  function interpretNumber(numStr, ctx, dict) {
    const candidates = [];
    const digits = numStr.split('');
    const personal = (dict.personal || []).find(p => p.number === numStr);
    if (personal) {
      candidates.push({ kind: 'personal', label: '私人约定', digit: null, core: null, text: '【私人约定】' + personal.meaning, score: 10, reasons: ['命中私人约定（优先级最高）'] });
    }
    const uniq = [...new Set(digits)];
    for (const d of uniq) {
      const entry = dict.digits[d];
      if (!entry || !Array.isArray(entry.aspects)) continue;
      for (const asp of entry.aspects) {
        const r = scoreAspect(asp, ctx, d);
        if (r.score <= 0) continue;
        let score = r.score; const reasons = r.reasons.slice();
        if (r.conditioned && r.hit) {
          const st = structureBonus(numStr, d, dict);
          score += st.bonus; reasons.push(...st.reasons);
        }
        score = Math.min(score, 10);
        if (score <= 0) continue;
        candidates.push({ kind: 'aspect', label: asp.label, digit: d, core: entry.core, text: asp.text, score, reasons });
      }
    }
    const seenPair = new Set();
    for (let i = 0; i < digits.length - 1; i++) {
      const key = digits[i] + digits[i + 1];
      if (seenPair.has(key)) continue;
      seenPair.add(key);
      const pair = dict.pairs[key];
      if (pair) {
        candidates.push({ kind: 'pair', label: pair.label, digit: null, core: null, text: pair.text, score: 6, reasons: ['相邻组合 ' + key + ' 命中词典 +6'] });
      }
    }
    const byText = {};
    for (const c of candidates) {
      if (!byText[c.text] || byText[c.text].score < c.score) byText[c.text] = c;
    }
    const rank = { personal: 0, pair: 1, aspect: 2 };
    return Object.values(byText).sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      return rank[a.kind] - rank[b.kind];
    });
  }
  function reasonChain(numStr, dict) {
    const digits = numStr.split('');
    const coreOf = d => (dict.digits[d] && dict.digits[d].core) || d;
    const cnt = {};
    digits.forEach(d => cnt[d] = (cnt[d] || 0) + 1);
    const repeats = Object.entries(cnt).filter(e => e[1] >= 2).map(e => e[0] + '（' + coreOf(e[0]) + '）×' + e[1]);
    const st = [];
    if (Object.values(cnt).some(v => v >= 2)) st.push('同位重复');
    if (digits.length > 1 && digits.every(x => x === digits[0])) st.push('所有数位相同');
    if (numStr.length >= 2 && numStr === [...numStr].reverse().join('')) st.push('镜像对称');
    const pairs = [];
    const seen = new Set();
    for (let i = 0; i < digits.length - 1; i++) {
      const key = digits[i] + digits[i + 1];
      if (seen.has(key)) continue; seen.add(key);
      const p = dict.pairs[key];
      if (p) pairs.push(key + '（' + p.label + '）');
    }
    return { split: digits.join(' '), splitCores: digits.map(coreOf).join('、'), repeats, structures: st, pairs };
  }
  function dominantDigits(numbers, dict) {
    const cnt = {};
    numbers.forEach(n => String(n).split('').forEach(d => cnt[d] = (cnt[d] || 0) + 1));
    const coreOf = d => (dict.digits[d] && dict.digits[d].core) || d;
    return Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 3)
      .map(e => ({ digit: e[0], count: e[1], core: coreOf(e[0]) }));
  }
  function interpretNarratives(numbers, dict) {
    if (!numbers || numbers.length < 2) return [];
    const cnt = {};
    numbers.forEach(n => String(n).split('').forEach(d => cnt[d] = (cnt[d] || 0) + 1));
    const sorted = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
    const top3 = sorted.slice(0, 3).map(e => e[0]);
    const out = [];
    for (const rule of (dict.narratives || [])) {
      const keys = rule.key.split('+');
      if (!keys.every(k => cnt[k])) continue;
      let score = 6;
      const parts = keys.map(k => k + '×' + cnt[k]);
      let eachBonus = 0;
      keys.forEach(k => { if (cnt[k] >= 2) eachBonus += 1; });
      score += eachBonus;
      const reasons = [];
      reasons.push(parts.join('、'));
      if (eachBonus > 0) reasons.push('每个原型出现≥2次 +' + eachBonus);
      if (keys.every(k => top3.includes(k))) { score += 1; reasons.push('核心原型均为主导位 Top3 +1'); }
      if (score >= 6) out.push({ key: rule.key, label: rule.label, text: rule.text, score, reasons });
    }
    return out.sort((a, b) => b.score - a.score);
  }
  async function generateGroupResult(g, dict) {
    const cal = g.calibration || {};
    const ctx = {
      situation: cal.situation || '', mood: cal.mood || '中性',
      thought: cal.thought || '', emptyThought: isEmptyThought(cal.thought),
      recent: Array.isArray(cal.recent) ? cal.recent : []
    };
    const perNumber = (g.numbers || []).map(n => ({ number: n, candidates: interpretNumber(n, ctx, dict), chain: reasonChain(n, dict) }));
    return {
      numbers: g.numbers || [], calibration: cal,
      ctxSnapshot: { mood: ctx.mood, emptyThought: ctx.emptyThought },
      perNumber, dominant: dominantDigits(g.numbers || [], dict),
      narratives: interpretNarratives(g.numbers || [], dict),
      biasWarning: ctx.recent.includes('专门去盯车牌·订单号找数字')
    };
  }

  /* ============================================================
     模块内部状态
     ============================================================ */
  let SUB = 'wizard';
  let W = newWizard();

    // 清理主站 router 留下的 loading spinner，避免内容叠加
    if (pageContent) pageContent.innerHTML = '';
    _dom = document.createElement('div');

    _dom.innerHTML =
      '<div class="angel-topbar"><div class="angel-title">🔢 天使数字解读</div>' +
      '<div class="angel-tabs">' +
      '<button class="angel-tab" data-sub="wizard" onclick="AngelModule.sub(\'wizard\')">✨ 解读</button>' +
      '<button class="angel-tab" data-sub="records" onclick="AngelModule.sub(\'records\')">📖 记录</button>' +
      '<button class="angel-tab" data-sub="dict" onclick="AngelModule.sub(\'dict\')">📚 词典</button>' +
      '<button class="angel-tab" data-sub="backup" onclick="AngelModule.sub(\'backup\')">💾 备份</button>' +
      '</div></div>' +
      '<div class="angel-body" id="angel-body"></div>';
    pageContent.appendChild(_dom);
    // 尝试迁移旧数据（静默）
    try { await migrateFromLegacy(); } catch (e) { /* ignore */ }
    await sub(SUB);
  }

  async function sub(t) {
    SUB = t;
    if (_dom) {
      _dom.querySelectorAll('.angel-tab').forEach(b => b.classList.toggle('active', b.dataset.sub === t));
    }
    const body = document.getElementById('angel-body');
    if (!body) return;
    if (t === 'wizard') await renderWizard();
    else if (t === 'records') await renderRecords();
    else if (t === 'dict') await renderDictPage();
    else await renderBackup();
  }

  /* ============================================================

     ============================================================ */
  function parseNumbers(raw) {
    const tokens = String(raw || '').split(/[\s,，、;；]+/).map(t => t.trim()).filter(Boolean);
    const nums = [];
    for (const t of tokens) { if (/^\d{1,10}$/.test(t) && !nums.includes(t)) nums.push(t); }
    return nums;
  }
  function goStep2() {
    const r = document.getElementById('aw-raw'); if (r) W.raw = r.value;
    const d = document.getElementById('aw-date'); if (d) W.reviewDate = d.value || todayStr();
    W.numbers = parseNumbers(W.raw);
    if (!W.numbers.length) { atoast('请先输入至少一个数字'); return; }
    if (!W.groups.length || W.groups.reduce((a, g) => a + g.numbers.length, 0) !== W.numbers.length) {
      W.groups = [{ numbers: W.numbers.slice(), calibration: defaultCalib() }];
    }
    W.step = W.numbers.length >= 2 ? 2 : 3;
    renderWizard();
  }
  async function renderWizard() {
    const body = document.getElementById('angel-body');
    if (!body) return;
    const s = W.step;
    const showGroupStep = W.numbers.length >= 2;
    let stepBar = '<div class="astepbar">';
    const steps = ['输入', '分组', '校准', '结果'];
    steps.forEach((name, i) => {
      const n = i + 1;
      if (n === 2 && !showGroupStep) return;
      const active = n <= s;
      stepBar += '<div class="as' + (active ? ' on' : '') + '"><span class="adot">' + n + '</span>' + name + '</div>';
      if (n < 4) stepBar += '<span class="aln"></span>';
    });
    stepBar += '</div>';
    let html = '';
    if (W.editId) html += '<div class="acard aedit-banner">✏️ 正在编辑已保存的记录，保存后更新原记录（感受与验证保留）<button class="achip-btn" onclick="AngelModule.cancelEdit()">取消编辑</button></div>';
    html += stepBar;
    if (s === 1) html += await viewStep1Html();
    else if (s === 2) html += await viewStep2Html();
    else if (s === 3) { html += await viewStep3Html(); }
    else html += await viewStep4Html();
    body.innerHTML = html;
    if (s === 3) W.groups.forEach((g, i) => updateEmptyHint(i));
  }

      if (gi < 0) gi = 0;
      let btns = '';
      for (let i = 0; i < groupCount; i++) { btns += '<button class="achip' + (i === gi ? ' on' : '') + '" onclick="AngelModule.assignGroup(\'' + n + '\',' + i + ')">组' + (i + 1) + '</button>'; }

        '<span class="anum-big" style="font-size:18px">' + esc(n) + '</span><span class="amuted">→</span>' + btns + '</div>';

        if (g.calibration && g.calibration.mood) moods.add(g.calibration.mood);

  function condSummary(c) {
    if (!c || !(c.thoughtContains || c.emptyThought || c.recent || c.mood)) return '';
    const parts = [];
    if (c.thoughtContains && c.thoughtContains.length) parts.push('念头关键词×' + c.thoughtContains.length);
    if (c.emptyThought) parts.push('空念头');
    if (c.recent && c.recent.length) parts.push('动向:' + c.recent.join('/'));
    if (c.mood && c.mood.length) parts.push('心态:' + c.mood.join('/'));
    if (c.requireAll) parts.push('需同时满足');
    return parts.join(' · ');
  }

  async function saveDigitEdit(d) {
    const dict = await getDict();
    const edits = await loadDictEdits();
    const entry = dict.digits[d];
    const labelEl = document.getElementById('adict-core-' + d);
    if (!labelEl) return;
    const newEntry = {
      core: labelEl.value.trim(),
      overview: document.getElementById('adict-ov-' + d).value.trim(),
      translations: document.getElementById('adict-tr-' + d).value.split('\n').map(s => s.trim()).filter(Boolean),
      aspects: []
    };
    const containers = [...document.querySelectorAll('.angel .acond-editor')].filter(el => el.id && el.id.indexOf('aasp-' + d + '-') === 0);
    for (const el of containers) {
      const asp = collectAspectFromDom(el);
      newEntry.aspects.push(asp);
    }
    // 计算该数位下被标记编辑的面向（在 SEED 里的）
    const editedAspects = [];
    for (const a of newEntry.aspects) {
      const isSeed = SEED_DICT.digits[d].aspects.some(sa => sa.id === a.id);
      if (isSeed) {
        const sa = SEED_DICT.digits[d].aspects.find(sa => sa.id === a.id);
        if (JSON.stringify(a) !== JSON.stringify(sa)) { editedAspects.push(a); await saveDictEdit('aspect:' + a.id, { kind: 'aspect', aspectId: a.id, aspect: { id: a.id, label: a.label, text: a.text, conditions: a.conditions } }); }
        else { await DB.delete('angel_dict', 'aspect:' + a.id); }
      } else {
        await saveDictEdit('aspect:' + a.id, { kind: 'aspect', aspectId: a.id, aspect: { id: a.id, label: a.label, text: a.text, conditions: a.conditions } });
      }
    }
    // 数位基础字段编辑检测
    const seedBase = { core: SEED_DICT.digits[d].core, overview: SEED_DICT.digits[d].overview, translations: SEED_DICT.digits[d].translations };
    const newBase = { core: newEntry.core, overview: newEntry.overview, translations: newEntry.translations };
    if (JSON.stringify(newBase) === JSON.stringify(seedBase)) {
      await DB.delete('angel_dict', 'digit:' + d);
    } else {
      await saveDictEdit('digit:' + d, { kind: 'digit', digit: d, base: newBase, aspects: editedAspects.map(a => ({ id: a.id, label: a.label, text: a.text, conditions: a.conditions })) });
    }
    renderDictPage();
    atoast('已保存数位 ' + d + ' 的词典编辑');
  }
  function collectAspectFromDom(el) {
    const label = el.querySelector('[data-asp="label"]').value.trim();
    const text = el.querySelector('[data-asp="text"]').value.trim();
    const thought = el.querySelector('[data-asp="thought"]').value.split('\n').map(s => s.trim()).filter(Boolean);
    const empty = el.querySelector('[data-cond="empty"]').classList.contains('on');
    const requireAll = el.querySelector('[data-cond="requireAll"]').classList.contains('on');
    const recent = [...el.querySelectorAll('[data-cond="recent"].on')].map(e => e.dataset.val);
    const mood = [...el.querySelectorAll('[data-cond="mood"].on')].map(e => e.dataset.val);
    const conditions = {};
    if (thought.length) conditions.thoughtContains = thought;
    if (empty) conditions.emptyThought = true;
    if (recent.length) conditions.recent = recent;
    if (mood.length) conditions.mood = mood;
    if (requireAll && Object.keys(conditions).length > 1) conditions.requireAll = true;
    return { id: el.dataset.aspid, label: label || '未命名面向', text, conditions };
  }

  function handleImportFile(input) {
    const f = input.files && input.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = e => {
      let data;
      try { data = JSON.parse(e.target.result); } catch (err) { atoast('文件解析失败，请确认是本工具导出的 JSON'); return; }
      doImport(data);
    };
    reader.readAsText(f);
    input.value = '';
  }
  async function doImport(data) {
    // 兼容两种格式：新格式 {records, personal, dictEdited, recentTags}，旧格式 {store:{records,...}}
    let impRecords = data.records, impPersonal = data.personal, impEdited = data.dictEdited, impTags = data.recentTags;
    if (!Array.isArray(impRecords) && data.store && Array.isArray(data.store.records)) {
      impRecords = data.store.records;
      impPersonal = data.store.dict && Array.isArray(data.store.dict.personal) ? data.store.dict.personal : [];
      impEdited = data.store.dictEdited || [];
      impTags = data.recentTags || [];
    }
    if (!Array.isArray(impRecords)) { atoast('这不是天使数字解读的备份文件'); return; }
    const localRecs = await loadRecords();
    const localIds = new Set(localRecs.map(r => r.id));
    const conflicts = impRecords.filter(r => r && r.id && localIds.has(r.id));
    const newRecs = impRecords.filter(r => r && r.id && !localIds.has(r.id));
    const applyImport = async (keepLocal) => {
      if (!keepLocal) {
        for (const r of impRecords) {
          if (r && r.id) { const r2 = Object.assign({}, r); r2.feelings = r2.feelings || ''; r2.verification = r2.verification || ''; await saveRecord(r2); }
        }
      }
      for (const r of newRecs) { const r2 = Object.assign({}, r); r2.feelings = r2.feelings || ''; r2.verification = r2.verification || ''; await saveRecord(r2); }
      // 私人约定按 number 合并
      if (Array.isArray(impPersonal)) {
        const cur = await loadPersonal();
        const curNum = new Set(cur.map(x => x.number));
        for (const p of impPersonal) { if (p && p.number && !curNum.has(p.number)) cur.push({ number: p.number, meaning: p.meaning }); }
        await savePersonal(cur);
      }
      // 词典编辑标记：仅补入本地没有的键
      if (impEdited && typeof impEdited === 'object') {
        const curEdits = await loadDictEdits();
        for (const k of Object.keys(impEdited)) {
          if (!curEdits[k] && impEdited[k]) await saveDictEdit(k, impEdited[k]);
        }
      }
      // 自定义标签并集
      if (Array.isArray(impTags)) {
        const curTags = await loadCustomTags();
        for (const t of impTags) { if (t && !curTags.includes(t) && !DEFAULT_TAGS.includes(t)) curTags.push(t); }
        await saveCustomTags(curTags);
      }
      renderBackup();
      atoast('导入完成：新增 ' + newRecs.length + ' 条记录' + (conflicts.length ? (keepLocal ? '，冲突 ' + conflicts.length + ' 条保留本地' : '，冲突 ' + conflicts.length + ' 条用导入版本') : ''));
    };
    if (conflicts.length) {
      let m = document.getElementById('angel-modal');
      if (!m) { m = document.createElement('div'); m.id = 'angel-modal'; m.className = 'amodal-wrap'; document.body.appendChild(m); }
      m.innerHTML = '<div class="amodal-mask"><div class="amodal"><h3>发现 ' + conflicts.length + ' 条冲突记录</h3>' +
        '<p>导入文件里有 ' + conflicts.length + ' 条记录和本地记录 ID 相同（同一次解读的两个版本）。要保留哪个版本？</p>' +
        '<div class="arow" style="justify-content:flex-end"><button class="abtn asm" id="aimp-local" data-ghost>保留本地版本</button>' +
        '<button class="abtn asm abtn-primary" id="aimp-new">用导入版本</button></div></div></div>';
      document.getElementById('aimp-local').onclick = () => { closeModal(); applyImport(true); };
      document.getElementById('aimp-new').onclick = () => { closeModal(); applyImport(false); };
    } else {
      applyImport(true);
    }
  }

    const T = [];
    const ctxA = { situation: '', mood: '中性', thought: '什么都没想', emptyThought: true, recent: [] };
    const cA = interpretNumber('1111', ctxA, dict);
    T.push(['A1 最可能是「新开始/消息」', cA.length > 0 && cA[0].label === '新开始/消息']);
    T.push(['A2 Top1 分数为 10', cA.length > 0 && cA[0].score === 10]);
    const fA = cA.find(c => c.label === '确认焦点');
    T.push(['A3 「确认焦点」约 1 分且排最后', !!fA && fA.score === 1 && cA[cA.length - 1].label === '确认焦点']);
    T.push(['A4 无「同位聚焦/镜像」结构条目', !cA.some(c => /同位|镜像|对称/.test(c.label))]);
    const ctxB = { situation: '', mood: '焦虑', thought: '我希望他能回应我，我很想他', emptyThought: false, recent: ['感到焦虑的事'] };
    const cB = interpretNumber('1111', ctxB, dict);
    const sB = cB.find(c => c.label === '主体确认');
    const aB = cB.find(c => c.label === '鼓励行动');
    T.push(['B1 最可能是「主体确认」10 分', cB.length > 0 && cB[0].label === '主体确认' && !!sB && sB.score === 10]);
    T.push(['B2 「鼓励行动」第二且低于主体确认', !!aB && aB.score < sB.score && cB[1].label === '鼓励行动']);
    const ctxC = { situation: '', mood: '平静', thought: '', emptyThought: true, recent: ['刚经历清晰沟通'] };
    const numsC = ['6446', '555', '1616', '4433'];
    let cOk = true;
    for (const n of numsC) { if (!interpretNumber(n, ctxC, dict).length) cOk = false; }
    T.push(['C0 四数字均有解读', cOk]);
    const narrs = interpretNarratives(numsC, dict);
    T.push(['C1 综合指向已生成', narrs.length >= 1]);
    T.push(['C2 综合 Top1 是 5+6+4', narrs.length > 0 && narrs[0].key === '5+6+4']);
    T.push(['C3 综合 Top1 分数为 10', narrs.length > 0 && narrs[0].score === 10]);
    const dom = dominantDigits(numsC, dict);
    T.push(['C4 主导数字 Top3 为 6/4/5', dom.length === 3 && ['6', '4', '5'].every(d => dom.some(x => x.digit === d))]);
    return T;
  }
